<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIEO — Master Pelanggan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef1f7;
      --surface: #ffffff;
      --border: #d0cec8;
      --navy: #1a2744;
      --orange: #e8521a;
      --text: #1c1c1c;
      --muted: #777;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); font-family: var(--sans); color: var(--text); font-size: 14px; }

    .page-header {
      background: var(--navy); color: #fff;
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 3px solid var(--orange);
    }
    .page-header .title { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .page-header .subtitle { font-size: 11px; opacity: 0.6; margin-top: 2px; font-family: var(--mono); }
    .btn-back { color: #fff; text-decoration: none; font-size: 13px; opacity: 0.8; }
    .btn-back:hover { opacity: 1; color: #fff; }

    .tab-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1rem; display: flex; }
    .tab-btn { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.6rem 1.1rem; border: none; background: none; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
    .tab-btn.active { color: var(--navy); border-bottom-color: var(--navy); }

    .filter-bar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .filter-bar input, .filter-bar select { font-size: 13px; border: 1px solid var(--border); border-radius: 3px; padding: 6px 10px; background: var(--bg); color: var(--text); font-family: var(--sans); }
    .filter-bar input { flex: 1; min-width: 160px; }
    .filter-bar select { min-width: 110px; }
    .btn-tambah { background: var(--orange); color: #fff; border: none; border-radius: 3px; padding: 6px 14px; font-size: 13px; font-family: var(--mono); font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-tambah:hover { background: #c8401a; }

    .counter-bar { padding: 6px 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--bg); }

    .table-wrap { overflow-x: auto; padding: 0 0 80px 0; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); }
    thead th { background: var(--navy); color: #fff; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 9px 10px; border-right: 1px solid rgba(255,255,255,0.1); white-space: nowrap; }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:hover { background: #f0ede8; }
    tbody td { padding: 8px 10px; font-size: 13px; vertical-align: middle; }
    .td-id { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
    .td-nama { font-weight: 500; }

    .badge-tipe { font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 2px; letter-spacing: 0.05em; }
    .badge-PT { background: #dbeafe; color: #1e40af; }
    .badge-DK { background: #dcfce7; color: #15803d; }
    .badge-RESELLER { background: #fef9c3; color: #854d0e; }
    .badge-status { font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 2px; }
    .badge-AKTIF { background: #dcfce7; color: #15803d; }
    .badge-NONAKTIF { background: #fee2e2; color: #991b1b; }

    .btn-edit { background: none; border: 1px solid var(--navy); color: var(--navy); border-radius: 2px; padding: 3px 10px; font-size: 11px; font-family: var(--mono); cursor: pointer; white-space: nowrap; }
    .btn-edit:hover { background: var(--navy); color: #fff; }

    .loading-state { text-align: center; padding: 40px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--navy); border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-content { border-radius: 4px; border: 2px solid var(--navy); }
    .modal-header { background: var(--navy); color: #fff; border-radius: 0; padding: 10px 16px; }
    .modal-title { font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: 0.06em; }
    .modal-header .btn-close { filter: invert(1); }
    .modal-body { padding: 16px; }
    .form-label { font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 4px; }
    .form-control, .form-select { font-size: 13px; border: 1px solid var(--border); border-radius: 3px; font-family: var(--sans); }
    .form-control:focus, .form-select:focus { border-color: var(--navy); box-shadow: 0 0 0 2px rgba(26,39,68,0.15); }
    .npwp-group { display: none; }
    .npwp-group.show { display: block; }
    .btn-simpan { background: var(--navy); color: #fff; border: none; border-radius: 3px; padding: 8px 20px; font-family: var(--mono); font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-simpan:hover { background: #243257; }
    .btn-batal { background: none; border: 1px solid var(--border); border-radius: 3px; padding: 8px 16px; font-family: var(--mono); font-size: 13px; cursor: pointer; color: var(--text); }

    @media (max-width: 600px) {
      .filter-bar input { min-width: 100%; }
      thead th:nth-child(5), tbody td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <div>
    <div class="title">Master Pelanggan</div>
    <div class="subtitle">SIEO — PT. Elim Citra Offset</div>
  </div>
  <div style="display:flex;align-items:center;gap:16px">
    <span id="userPill" style="font-family:var(--mono);font-size:11px;opacity:0.7"></span>
    <a href="../index.html" class="btn-back">← Kembali</a>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tabPelanggan" onclick="gantTab('pelanggan')">Pelanggan</button>
  <button class="tab-btn" id="tabAgen" onclick="gantTab('agen')">Agen</button>
</div>

<div class="filter-bar">
  <input type="text" id="searchNama" placeholder="Cari nama pelanggan..." oninput="filterTabel()">
  <select id="filterTipe" onchange="filterTabel()">
    <option value="">Semua Tipe</option>
    <option value="PT">PT</option>
    <option value="DK">DK</option>
    <option value="RESELLER">Reseller</option>
  </select>
  <select id="filterStatus" onchange="filterTabel()">
    <option value="">Semua Status</option>
    <option value="AKTIF">Aktif</option>
    <option value="NONAKTIF">Nonaktif</option>
  </select>
  <button class="btn-tambah" onclick="bukaModalTambahAktif()">+ Tambah</button>
</div>

<div class="counter-bar" id="counterBar">Memuat data...</div>

<div class="table-wrap">
  <div class="loading-state" id="loadingState"><span class="spinner"></span> Mengambil data...</div>

  <table id="tabelPelanggan" style="display:none">
    <thead><tr><th>ID</th><th>Nama</th><th>Tipe</th><th>Status</th><th>Telepon</th><th>Aksi</th></tr></thead>
    <tbody id="tbodyPelanggan"></tbody>
  </table>

  <div id="wrapAgen" style="display:none">
    <table id="tabelAgen">
      <thead><tr><th>ID</th><th>Nama</th><th>Telepon</th><th>Status</th><th>Aksi</th></tr></thead>
      <tbody id="tbodyAgen"></tbody>
    </table>
  </div>
</div>

<!-- MODAL PELANGGAN -->
<div class="modal fade" id="modalPelanggan" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modalJudul">TAMBAH PELANGGAN</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alert-form"></div>
        <input type="hidden" id="fId">
        <div class="mb-3">
          <label class="form-label">Nama *</label>
          <input type="text" class="form-control" id="fNama" placeholder="Nama pelanggan">
        </div>
        <div class="mb-3">
          <label class="form-label">Tipe *</label>
          <select class="form-select" id="fTipe" onchange="toggleNpwp()">
            <option value="">-- Pilih --</option>
            <option value="PT">PT</option>
            <option value="DK">DK</option>
            <option value="RESELLER">Reseller</option>
          </select>
        </div>
        <div class="mb-3 npwp-group" id="npwpGroup">
          <label class="form-label">NPWP *</label>
          <input type="text" class="form-control" id="fNpwp" placeholder="xx.xxx.xxx.x-xxx.xxx">
        </div>
        <div class="mb-3">
          <label class="form-label">Telepon</label>
          <input type="text" class="form-control" id="fTelepon" placeholder="08xx-xxxx-xxxx">
        </div>
        <div class="mb-3">
          <label class="form-label">Alamat</label>
          <textarea class="form-control" id="fAlamat" rows="2" placeholder="Alamat lengkap"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Agen</label>
          <select class="form-select" id="fAgen">
            <option value="">-- Tidak ada agen --</option>
          </select>
        </div>
        <div class="mb-3" id="statusGroup" style="display:none">
          <label class="form-label">Status</label>
          <select class="form-select" id="fStatus">
            <option value="AKTIF">Aktif</option>
            <option value="NONAKTIF">Nonaktif</option>
          </select>
        </div>
        <div class="d-flex gap-2 justify-content-end mt-3">
          <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
          <button class="btn-simpan" id="btnSimpanPelanggan" onclick="simpanPelanggan()">Simpan</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL AGEN -->
<div class="modal fade" id="modalAgen" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modalAgenJudul">TAMBAH AGEN</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alert-form-agen"></div>
        <input type="hidden" id="fAgenId">
        <div class="mb-3">
          <label class="form-label">Nama Agen *</label>
          <input type="text" class="form-control" id="fAgenNama" placeholder="Nama agen">
        </div>
        <div class="mb-3">
          <label class="form-label">Telepon</label>
          <input type="text" class="form-control" id="fAgenTelepon" placeholder="08xx-xxxx-xxxx">
        </div>
        <div class="mb-3" id="statusAgenGroup" style="display:none">
          <label class="form-label">Status</label>
          <select class="form-select" id="fAgenStatus">
            <option value="AKTIF">Aktif</option>
            <option value="NONAKTIF">Nonaktif</option>
          </select>
        </div>
        <div class="d-flex gap-2 justify-content-end mt-3">
          <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
          <button class="btn-simpan" id="btnSimpanAgen" onclick="simpanAgen()">Simpan</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
'use strict';

let dataPelanggan = [];
let dataAgen      = [];
let tabAktif      = 'pelanggan';
let modalPelangganInst, modalAgenInst;

// ── INIT ────────────────────────────────────────────────────
window.addEventListener('load', function() {
  guardHalaman();
  modalPelangganInst = new bootstrap.Modal(document.getElementById('modalPelanggan'));
  modalAgenInst      = new bootstrap.Modal(document.getElementById('modalAgen'));
  muatData();
});

// ── LOAD DATA ───────────────────────────────────────────────
function muatData() {
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('tabelPelanggan').style.display = 'none';
  document.getElementById('wrapAgen').style.display = 'none';

  Promise.all([
    dbGet('m_pelanggan', { order: 'id_pelanggan.asc' }),
    dbGet('m_agen',      { order: 'id_agen.asc' })
  ]).then(([resPelanggan, resAgen]) => {
    dataPelanggan = Array.isArray(resPelanggan) ? resPelanggan : [];
    dataAgen      = Array.isArray(resAgen)      ? resAgen      : [];
    isiDropdownAgen();
    document.getElementById('loadingState').style.display = 'none';
    if (tabAktif === 'pelanggan') {
      document.getElementById('tabelPelanggan').style.display = 'table';
      renderTabelPelanggan(dataPelanggan);
    } else {
      document.getElementById('wrapAgen').style.display = 'block';
      renderTabelAgen(dataAgen);
    }
  }).catch(err => {
    document.getElementById('loadingState').innerHTML =
      '<span style="color:var(--orange);font-family:var(--mono)">Gagal memuat: ' + err.message + '</span>';
  });
}

// ── RENDER PELANGGAN ────────────────────────────────────────
function renderTabelPelanggan(data) {
  const tbody = document.getElementById('tbodyPelanggan');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--muted);font-family:var(--mono);font-size:12px">Tidak ada data</td></tr>';
    document.getElementById('counterBar').textContent = '0 pelanggan';
    return;
  }
  tbody.innerHTML = data.map(p => `
    <tr>
      <td class="td-id">${escHtml(p.id_pelanggan)}</td>
      <td class="td-nama">${escHtml(p.nama)}</td>
      <td><span class="badge-tipe badge-${p.tipe}">${p.tipe}</span></td>
      <td><span class="badge-status badge-${p.status}">${p.status}</span></td>
      <td style="color:var(--muted)">${p.telepon ? escHtml(p.telepon) : '—'}</td>
      <td><button class="btn-edit" onclick='bukaModalEdit(${JSON.stringify(p)})'>Edit</button></td>
    </tr>
  `).join('');
  document.getElementById('counterBar').textContent =
    data.length + ' dari ' + dataPelanggan.length + ' pelanggan';
}

// ── RENDER AGEN ─────────────────────────────────────────────
function renderTabelAgen(data) {
  const tbody = document.getElementById('tbodyAgen');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--muted);font-family:var(--mono);font-size:12px">Belum ada agen</td></tr>';
    document.getElementById('counterBar').textContent = '0 agen';
    return;
  }
  tbody.innerHTML = data.map(a => `
    <tr>
      <td class="td-id">${escHtml(a.id_agen)}</td>
      <td class="td-nama">${escHtml(a.nama)}</td>
      <td style="color:var(--muted)">${a.telepon ? escHtml(a.telepon) : '—'}</td>
      <td><span class="badge-status badge-${a.status}">${a.status}</span></td>
      <td><button class="btn-edit" onclick='bukaModalEditAgen(${JSON.stringify(a)})'>Edit</button></td>
    </tr>
  `).join('');
  document.getElementById('counterBar').textContent = data.length + ' agen';
}

// ── FILTER ──────────────────────────────────────────────────
function filterTabel() {
  const cari   = document.getElementById('searchNama').value.toLowerCase();
  const tipe   = document.getElementById('filterTipe').value;
  const status = document.getElementById('filterStatus').value;
  if (tabAktif === 'pelanggan') {
    const hasil = dataPelanggan.filter(p =>
      p.nama.toLowerCase().includes(cari) &&
      (!tipe   || p.tipe   === tipe) &&
      (!status || p.status === status)
    );
    renderTabelPelanggan(hasil);
  } else {
    const hasil = dataAgen.filter(a => a.nama.toLowerCase().includes(cari));
    renderTabelAgen(hasil);
  }
}

// ── TAB ─────────────────────────────────────────────────────
function gantTab(tab) {
  tabAktif = tab;
  document.getElementById('tabPelanggan').classList.toggle('active', tab === 'pelanggan');
  document.getElementById('tabAgen').classList.toggle('active', tab === 'agen');
  document.getElementById('filterTipe').style.display   = tab === 'pelanggan' ? '' : 'none';
  document.getElementById('filterStatus').style.display = tab === 'pelanggan' ? '' : 'none';
  document.getElementById('searchNama').placeholder     = tab === 'pelanggan' ? 'Cari nama pelanggan...' : 'Cari nama agen...';
  document.getElementById('tabelPelanggan').style.display = tab === 'pelanggan' ? 'table' : 'none';
  document.getElementById('wrapAgen').style.display       = tab === 'agen'      ? 'block' : 'none';
  document.getElementById('searchNama').value = '';
  if (tab === 'pelanggan') renderTabelPelanggan(dataPelanggan);
  else renderTabelAgen(dataAgen);
}

function bukaModalTambahAktif() {
  if (tabAktif === 'agen') bukaModalTambahAgen();
  else bukaModalTambah();
}

// ── DROPDOWN AGEN ───────────────────────────────────────────
function isiDropdownAgen() {
  const sel = document.getElementById('fAgen');
  while (sel.options.length > 1) sel.remove(1);
  dataAgen.filter(a => a.status === 'AKTIF').forEach(a => {
    const opt = document.createElement('option');
    opt.value = a.id_agen;
    opt.textContent = a.nama;
    sel.appendChild(opt);
  });
}

// ── TOGGLE NPWP ─────────────────────────────────────────────
function toggleNpwp() {
  const tipe = document.getElementById('fTipe').value;
  document.getElementById('npwpGroup').classList.toggle('show', tipe === 'PT');
}

// ── MODAL TAMBAH PELANGGAN ───────────────────────────────────
function bukaModalTambah() {
  document.getElementById('modalJudul').textContent = 'TAMBAH PELANGGAN';
  document.getElementById('alert-form').innerHTML = '';
  ['fId','fNama','fNpwp','fTelepon','fAlamat'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fTipe').value   = '';
  document.getElementById('fAgen').value   = '';
  document.getElementById('fStatus').value = 'AKTIF';
  document.getElementById('statusGroup').style.display = 'none';
  document.getElementById('npwpGroup').classList.remove('show');
  modalPelangganInst.show();
}

// ── MODAL EDIT PELANGGAN ─────────────────────────────────────
function bukaModalEdit(p) {
  document.getElementById('modalJudul').textContent = 'EDIT PELANGGAN — ' + p.id_pelanggan;
  document.getElementById('alert-form').innerHTML = '';
  document.getElementById('fId').value      = p.id_pelanggan;
  document.getElementById('fNama').value    = p.nama;
  document.getElementById('fTipe').value    = p.tipe;
  document.getElementById('fNpwp').value    = p.npwp    || '';
  document.getElementById('fTelepon').value = p.telepon || '';
  document.getElementById('fAlamat').value  = p.alamat  || '';
  document.getElementById('fAgen').value    = p.id_agen || '';
  document.getElementById('fStatus').value  = p.status  || 'AKTIF';
  document.getElementById('statusGroup').style.display = 'block';
  toggleNpwp();
  modalPelangganInst.show();
}

// ── SIMPAN PELANGGAN ─────────────────────────────────────────
function simpanPelanggan() {
  const id     = document.getElementById('fId').value;
  const nama   = document.getElementById('fNama').value.trim().toUpperCase();
  const tipe   = document.getElementById('fTipe').value;
  const npwp   = document.getElementById('fNpwp').value.trim();
  const telp   = document.getElementById('fTelepon').value.trim();
  const alamat = document.getElementById('fAlamat').value.trim();
  const agen   = document.getElementById('fAgen').value;
  const status = document.getElementById('fStatus').value;

  if (!nama) return tampilError('Nama wajib diisi');
  if (!tipe) return tampilError('Tipe wajib dipilih');
  if (tipe === 'PT' && !npwp) return tampilError('NPWP wajib diisi untuk pelanggan PT');

  const btn = document.getElementById('btnSimpanPelanggan');
  btn.textContent = 'Menyimpan...'; btn.disabled = true;

  const payload = {
    nama, tipe,
    npwp:    npwp   || null,
    telepon: telp   || null,
    alamat:  alamat || null,
    id_agen: agen   || null,
    status
  };

  let p;
  if (id) {
    // EDIT — PATCH berdasarkan id_pelanggan
    p = dbUpdate('m_pelanggan', { id_pelanggan: 'eq.' + id }, payload);
  } else {
    // TAMBAH — generate ID lokal lalu INSERT
    const newId = generateIdLokal(dataPelanggan, 'PLE', 'id_pelanggan', 3);
    payload.id_pelanggan = newId;
    payload.tgl_daftar   = new Date().toISOString().slice(0, 10);
    p = dbInsert('m_pelanggan', payload);
  }

  p.then(res => {
    // Supabase error: array kosong atau ada field 'code'
    if (res && res.code) throw new Error(res.message || 'Gagal menyimpan');
    modalPelangganInst.hide();
    muatData();
  }).catch(err => {
    tampilError(err.message || 'Gagal menyimpan. Coba lagi.');
  }).finally(() => {
    btn.textContent = 'Simpan'; btn.disabled = false;
  });
}

function tampilError(msg) {
  document.getElementById('alert-form').innerHTML =
    `<div class="alert alert-danger py-2 mb-3" style="font-size:12px">${msg}</div>`;
}

// ── MODAL TAMBAH AGEN ────────────────────────────────────────
function bukaModalTambahAgen() {
  document.getElementById('modalAgenJudul').textContent = 'TAMBAH AGEN';
  document.getElementById('alert-form-agen').innerHTML = '';
  document.getElementById('fAgenId').value      = '';
  document.getElementById('fAgenNama').value    = '';
  document.getElementById('fAgenTelepon').value = '';
  document.getElementById('fAgenStatus').value  = 'AKTIF';
  document.getElementById('statusAgenGroup').style.display = 'none';
  modalAgenInst.show();
}

// ── MODAL EDIT AGEN ──────────────────────────────────────────
function bukaModalEditAgen(a) {
  document.getElementById('modalAgenJudul').textContent = 'EDIT AGEN — ' + a.id_agen;
  document.getElementById('alert-form-agen').innerHTML = '';
  document.getElementById('fAgenId').value      = a.id_agen;
  document.getElementById('fAgenNama').value    = a.nama;
  document.getElementById('fAgenTelepon').value = a.telepon || '';
  document.getElementById('fAgenStatus').value  = a.status  || 'AKTIF';
  document.getElementById('statusAgenGroup').style.display = 'block';
  modalAgenInst.show();
}

// ── SIMPAN AGEN ──────────────────────────────────────────────
function simpanAgen() {
  const id     = document.getElementById('fAgenId').value;
  const nama   = document.getElementById('fAgenNama').value.trim().toUpperCase();
  const telp   = document.getElementById('fAgenTelepon').value.trim();
  const status = document.getElementById('fAgenStatus').value;

  if (!nama) {
    document.getElementById('alert-form-agen').innerHTML =
      '<div class="alert alert-danger py-2 mb-3" style="font-size:12px">Nama agen wajib diisi</div>';
    return;
  }

  const btn = document.getElementById('btnSimpanAgen');
  btn.textContent = 'Menyimpan...'; btn.disabled = true;

  const payload = { nama, telepon: telp || null, status };

  let p;
  if (id) {
    p = dbUpdate('m_agen', { id_agen: 'eq.' + id }, payload);
  } else {
    const newId = generateIdLokal(dataAgen, 'AGN', 'id_agen', 3);
    payload.id_agen = newId;
    p = dbInsert('m_agen', payload);
  }

  p.then(res => {
    if (res && res.code) throw new Error(res.message || 'Gagal menyimpan');
    modalAgenInst.hide();
    muatData();
  }).catch(err => {
    document.getElementById('alert-form-agen').innerHTML =
      '<div class="alert alert-danger py-2 mb-3" style="font-size:12px">' + (err.message || 'Gagal menyimpan') + '</div>';
  }).finally(() => {
    btn.textContent = 'Simpan'; btn.disabled = false;
  });
}
</script>
