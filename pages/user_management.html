<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management — SIEO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--navy:#1a2744;--navy-dk:#131e36;--orange:#e8521a;--bg:#eef1f7;--surface:#fff;--border:#d0d8e8;--text:#1a2744;--muted:#6b7a99;--green:#1a9e5c;--green-bg:#e6f7ef;--green-bd:#a3d9be;--red:#dc3545;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding-bottom:2rem;}
    .topbar{background:var(--navy);border-bottom:3px solid var(--orange);padding:.7rem 1.1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
    .topbar-left{display:flex;align-items:center;gap:.75rem;}
    .topbar-back{color:rgba(255,255,255,.7);font-size:.75rem;font-family:var(--mono);text-decoration:none;}
    .topbar-back:hover{color:#fff;}
    .topbar-title{font-family:var(--mono);font-weight:600;font-size:.88rem;letter-spacing:.05em;color:#fff;text-transform:uppercase;}
    #userPill{font-family:var(--mono);font-size:.65rem;color:rgba(255,255,255,.55);}
    .main{padding:1.1rem;}
    .section-title{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:.4rem;border-bottom:1px solid var(--border);margin-bottom:.85rem;}
    .card-section{background:var(--surface);border-radius:10px;border:1px solid var(--border);padding:1rem;margin-bottom:1.1rem;}
    .user-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.75rem;margin-bottom:.6rem;}
    .user-card:last-child{margin-bottom:0;}
    .user-nama{font-size:.88rem;font-weight:600;margin-bottom:.1rem;}
    .user-email{font-family:var(--mono);font-size:.72rem;color:var(--muted);}
    .user-meta{font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-top:.2rem;}
    .badge-wrap{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;margin-top:.25rem;}
    .badge-role{font-family:var(--mono);font-size:.62rem;font-weight:600;padding:.15rem .45rem;border-radius:4px;letter-spacing:.04em;}
    .role-direktur{background:#1a274420;color:#1a2744;}
    .role-manager{background:#e8f0fe;color:#1a56b0;}
    .role-admin{background:#e0f2f1;color:#00695c;}
    .role-sales{background:#fff3e0;color:#c45a00;}
    .role-operator{background:#f3e5f5;color:#6a1b9a;}
    .badge-status{font-family:var(--mono);font-size:.62rem;font-weight:600;padding:.15rem .45rem;border-radius:4px;}
    .st-aktif{background:var(--green-bg);color:var(--green);}
    .st-pending{background:#fff9c4;color:#827717;}
    .st-nonaktif{background:#fff0f0;color:var(--red);}
    .user-actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem;}
    .tgl-daftar{font-family:var(--mono);font-size:.63rem;color:var(--muted);}
    .btn-approve{background:var(--green);color:#fff;border:none;font-family:var(--mono);font-size:.7rem;font-weight:600;padding:.35rem .75rem;border-radius:5px;cursor:pointer;}
    .btn-approve:hover{background:#158a4e;}
    .btn-approve:disabled{opacity:.5;cursor:not-allowed;}
    .btn-nonaktif{background:#fff0f0;color:var(--red);border:1px solid #ffc9c9;font-family:var(--mono);font-size:.7rem;padding:.35rem .75rem;border-radius:5px;cursor:pointer;}
    .btn-nonaktif:hover{background:#ffe0e0;}
    .btn-aktifkan{background:#e8f0fe;color:#1a56b0;border:1px solid #b3c9f9;font-family:var(--mono);font-size:.7rem;padding:.35rem .75rem;border-radius:5px;cursor:pointer;}
    .btn-refresh{background:var(--navy);color:#fff;border:none;font-family:var(--mono);font-size:.72rem;padding:.38rem .8rem;border-radius:5px;cursor:pointer;}
    .btn-simpan{background:var(--navy);color:#fff;border:none;font-family:var(--mono);font-size:.75rem;font-weight:600;padding:.5rem .9rem;border-radius:6px;cursor:pointer;}
    .btn-simpan:disabled{opacity:.5;cursor:not-allowed;}
    .btn-batal{background:transparent;color:var(--muted);border:1px solid var(--border);font-family:var(--mono);font-size:.75rem;padding:.5rem .9rem;border-radius:6px;cursor:pointer;}
    .alert-box{font-family:var(--mono);font-size:.75rem;padding:.5rem .75rem;border-radius:6px;margin-bottom:.75rem;}
    .alert-err{background:#fff0f0;color:var(--red);border:1px solid #ffc9c9;}
    .alert-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}
    .loading{text-align:center;padding:1.5rem;font-family:var(--mono);font-size:.8rem;color:var(--muted);}
    .empty{text-align:center;padding:1.2rem;font-family:var(--mono);font-size:.78rem;color:var(--muted);}
    .modal-content{border:none;border-radius:10px;box-shadow:0 8px 32px rgba(26,39,68,.18);}
    .modal-header{background:var(--navy);color:#fff;border-radius:10px 10px 0 0;padding:.85rem 1.1rem;border-bottom:3px solid var(--orange);}
    .modal-title{font-family:var(--mono);font-weight:600;font-size:.88rem;color:#fff;text-transform:uppercase;}
    .modal-header .btn-close{filter:invert(1);opacity:.7;}
    .modal-body{padding:1.1rem;background:#f8fafc;}
    .modal-footer{background:var(--bg);border-top:1px solid var(--border);padding:.75rem 1.1rem;border-radius:0 0 10px 10px;gap:.5rem;}
    .form-label{font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:.3rem;display:block;}
    .form-select{font-family:var(--mono);font-size:.8rem;border:1px solid var(--border);border-radius:6px;padding:.5rem .7rem;width:100%;color:var(--text);}
    .form-select:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 2px rgba(26,39,68,.1);}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="../index.html" class="topbar-back">← Menu</a>
    <span style="color:rgba(255,255,255,.2)">|</span>
    <span class="topbar-title">User Management</span>
  </div>
  <div style="display:flex;align-items:center;gap:.6rem">
    <span id="userPill"></span>
    <button class="btn-refresh" onclick="muatUser()">↻ Refresh</button>
  </div>
</div>

<div class="main">
  <div id="alertGlobal"></div>

  <div class="card-section">
    <div class="section-title">⚠ Menunggu Persetujuan</div>
    <div id="listPending"><div class="loading">Memuat…</div></div>
  </div>

  <div class="card-section">
    <div class="section-title">✓ User Aktif</div>
    <div id="listAktif"><div class="loading">Memuat…</div></div>
  </div>

  <div class="card-section">
    <div class="section-title">✕ Nonaktif</div>
    <div id="listNonaktif"><div class="loading">Memuat…</div></div>
  </div>
</div>

<!-- MODAL APPROVE -->
<div class="modal fade" id="modalApprove" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Approve User</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alertApprove"></div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:.6rem .85rem;margin-bottom:.85rem;">
          <div class="user-nama" id="approveNama">—</div>
          <div class="user-email" id="approveEmail">—</div>
          <div class="tgl-daftar" id="approveTgl">—</div>
        </div>
        <div>
          <label class="form-label">Role *</label>
          <select class="form-select" id="approveRole">
            <option value="">— Pilih Role —</option>
            <option value="MANAGER">MANAGER</option>
            <option value="ADMIN">ADMIN</option>
            <option value="SALES">SALES</option>
            <option value="OPERATOR">OPERATOR</option>
          </select>
        </div>
      </div>
      <div class="modal-footer" style="justify-content:space-between">
        <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
        <button class="btn-approve" id="btnKonfirmasiApprove" onclick="konfirmasiApprove()">✓ Approve</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL NONAKTIF -->
<div class="modal fade" id="modalNonaktif" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" style="background:var(--red)">
        <span class="modal-title">Nonaktifkan User</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alertNonaktif"></div>
        <div class="alert-box alert-err" style="margin-bottom:.75rem">User yang dinonaktifkan tidak bisa login ke SIEO.</div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:.6rem .85rem;">
          <div class="user-nama" id="nonaktifNama">—</div>
          <div class="user-email" id="nonaktifEmail">—</div>
        </div>
      </div>
      <div class="modal-footer" style="justify-content:space-between">
        <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
        <button class="btn-simpan" id="btnKonfirmasiNonaktif" onclick="konfirmasiNonaktif()" style="background:var(--red)">Nonaktifkan</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL AKTIFKAN KEMBALI -->
<div class="modal fade" id="modalAktifkan" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Aktifkan Kembali</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alertAktifkan"></div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:.6rem .85rem;margin-bottom:.85rem;">
          <div class="user-nama" id="aktifkanNama">—</div>
          <div class="user-email" id="aktifkanEmail">—</div>
        </div>
        <div>
          <label class="form-label">Role *</label>
          <select class="form-select" id="aktifkanRole">
            <option value="MANAGER">MANAGER</option>
            <option value="ADMIN">ADMIN</option>
            <option value="SALES">SALES</option>
            <option value="OPERATOR">OPERATOR</option>
          </select>
        </div>
      </div>
      <div class="modal-footer" style="justify-content:space-between">
        <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
        <button class="btn-approve" id="btnKonfirmasiAktifkan" onclick="konfirmasiAktifkan()">Aktifkan</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
var emailTarget=null, semuaUser=[];

document.addEventListener('DOMContentLoaded',function(){
  if(!guardHalaman()) return;
  // Hanya Direktur
  var role=getRoleUser();
  if(role!=='DIREKTUR'){
    document.getElementById('alertGlobal').innerHTML='<div class="alert-box alert-err">Akses ditolak. Halaman ini hanya untuk Direktur.</div>';
    ['listPending','listAktif','listNonaktif'].forEach(function(id){document.getElementById(id).innerHTML='';});
    return;
  }
  muatUser();
});

function esc(s){return escHtml(s);}
function fmtTgl(v){if(!v)return'—';var d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'});}

function muatUser(){
  ['listPending','listAktif','listNonaktif'].forEach(function(id){
    document.getElementById(id).innerHTML='<div class="loading">Memuat…</div>';
  });
  dbGet('m_user',{order:'tgl_daftar.asc'}).then(function(res){
    semuaUser=Array.isArray(res)?res:[];
    renderUser();
  }).catch(function(){
    document.getElementById('alertGlobal').innerHTML='<div class="alert-box alert-err">Gagal memuat data user.</div>';
  });
}

function renderUser(){
  var pending=semuaUser.filter(function(u){return u.status==='PENDING';});
  var aktif=semuaUser.filter(function(u){return u.status==='AKTIF';});
  var nonaktif=semuaUser.filter(function(u){return u.status==='NONAKTIF';});

  document.getElementById('listPending').innerHTML=pending.length
    ?pending.map(kartuPending).join('')
    :'<div class="empty">Tidak ada user yang menunggu persetujuan.</div>';

  document.getElementById('listAktif').innerHTML=aktif.length
    ?aktif.map(kartuAktif).join('')
    :'<div class="empty">Belum ada user aktif.</div>';

  document.getElementById('listNonaktif').innerHTML=nonaktif.length
    ?nonaktif.map(kartuNonaktif).join('')
    :'<div class="empty">Tidak ada user nonaktif.</div>';
}

function badgeRole(role){
  var cls={DIREKTUR:'role-direktur',MANAGER:'role-manager',ADMIN:'role-admin',SALES:'role-sales',OPERATOR:'role-operator'}[role]||'role-admin';
  return '<span class="badge-role '+cls+'">'+esc(role||'—')+'</span>';
}

function kartuPending(u){
  return '<div class="user-card">'+
    '<div class="user-nama">'+esc(u.nama||u.email)+'</div>'+
    '<div class="user-email">'+esc(u.email)+'</div>'+
    '<div class="badge-wrap"><span class="badge-status st-pending">PENDING</span></div>'+
    '<div class="tgl-daftar">Daftar: '+fmtTgl(u.tgl_daftar)+'</div>'+
    '<div class="user-actions">'+
      '<button class="btn-approve" onclick="bukaApprove(\''+esc(u.email)+'\',\''+esc(u.nama||u.email)+'\',\''+esc(u.tgl_daftar||'')+'\')">✓ Approve</button>'+
    '</div>'+
  '</div>';
}

function kartuAktif(u){
  return '<div class="user-card">'+
    '<div class="user-nama">'+esc(u.nama||u.email)+'</div>'+
    '<div class="user-email">'+esc(u.email)+'</div>'+
    '<div class="badge-wrap">'+badgeRole(u.role)+'<span class="badge-status st-aktif">AKTIF</span></div>'+
    '<div class="user-meta">Login terakhir: '+fmtTgl(u.last_login||null)+'</div>'+
    '<div class="user-actions">'+
      '<button class="btn-nonaktif" onclick="bukaNonaktif(\''+esc(u.email)+'\',\''+esc(u.nama||u.email)+'\')">Nonaktifkan</button>'+
    '</div>'+
  '</div>';
}

function kartuNonaktif(u){
  return '<div class="user-card">'+
    '<div class="user-nama">'+esc(u.nama||u.email)+'</div>'+
    '<div class="user-email">'+esc(u.email)+'</div>'+
    '<div class="badge-wrap">'+badgeRole(u.role)+'<span class="badge-status st-nonaktif">NONAKTIF</span></div>'+
    '<div class="user-actions">'+
      '<button class="btn-aktifkan" onclick="bukaAktifkan(\''+esc(u.email)+'\',\''+esc(u.nama||u.email)+'\',\''+esc(u.role||'ADMIN')+'\')">Aktifkan Kembali</button>'+
    '</div>'+
  '</div>';
}

// ── APPROVE ──
function bukaApprove(email,nama,tgl){
  emailTarget=email;
  document.getElementById('approveNama').textContent=nama;
  document.getElementById('approveEmail').textContent=email;
  document.getElementById('approveTgl').textContent='Daftar: '+fmtTgl(tgl);
  document.getElementById('approveRole').value='';
  document.getElementById('alertApprove').innerHTML='';
  new bootstrap.Modal(document.getElementById('modalApprove')).show();
}

function konfirmasiApprove(){
  var role=document.getElementById('approveRole').value;
  if(!role){document.getElementById('alertApprove').innerHTML='<div class="alert-box alert-err">Role wajib dipilih.</div>';return;}
  var btn=document.getElementById('btnKonfirmasiApprove');
  btn.disabled=true; btn.textContent='Memproses…';
  dbUpdate('m_user',{email:'eq.'+emailTarget},{role:role,status:'AKTIF',last_login:null})
    .then(function(res){
      if(res&&res.code) throw new Error(res.message);
      bootstrap.Modal.getInstance(document.getElementById('modalApprove')).hide();
      muatUser();
    })
    .catch(function(e){
      document.getElementById('alertApprove').innerHTML='<div class="alert-box alert-err">Gagal: '+esc(e.message)+'</div>';
      btn.disabled=false; btn.textContent='✓ Approve';
    });
}

// ── NONAKTIF ──
function bukaNonaktif(email,nama){
  emailTarget=email;
  document.getElementById('nonaktifNama').textContent=nama;
  document.getElementById('nonaktifEmail').textContent=email;
  document.getElementById('alertNonaktif').innerHTML='';
  new bootstrap.Modal(document.getElementById('modalNonaktif')).show();
}

function konfirmasiNonaktif(){
  var btn=document.getElementById('btnKonfirmasiNonaktif');
  btn.disabled=true; btn.textContent='Memproses…';
  dbUpdate('m_user',{email:'eq.'+emailTarget},{status:'NONAKTIF'})
    .then(function(res){
      if(res&&res.code) throw new Error(res.message);
      bootstrap.Modal.getInstance(document.getElementById('modalNonaktif')).hide();
      muatUser();
    })
    .catch(function(e){
      document.getElementById('alertNonaktif').innerHTML='<div class="alert-box alert-err">Gagal: '+esc(e.message)+'</div>';
      btn.disabled=false; btn.textContent='Nonaktifkan';
    });
}

// ── AKTIFKAN KEMBALI ──
function bukaAktifkan(email,nama,role){
  emailTarget=email;
  document.getElementById('aktifkanNama').textContent=nama;
  document.getElementById('aktifkanEmail').textContent=email;
  document.getElementById('aktifkanRole').value=role||'ADMIN';
  document.getElementById('alertAktifkan').innerHTML='';
  new bootstrap.Modal(document.getElementById('modalAktifkan')).show();
}

function konfirmasiAktifkan(){
  var role=document.getElementById('aktifkanRole').value;
  var btn=document.getElementById('btnKonfirmasiAktifkan');
  btn.disabled=true; btn.textContent='Memproses…';
  dbUpdate('m_user',{email:'eq.'+emailTarget},{role:role,status:'AKTIF'})
    .then(function(res){
      if(res&&res.code) throw new Error(res.message);
      bootstrap.Modal.getInstance(document.getElementById('modalAktifkan')).hide();
      muatUser();
    })
    .catch(function(e){
      document.getElementById('alertAktifkan').innerHTML='<div class="alert-box alert-err">Gagal: '+esc(e.message)+'</div>';
      btn.disabled=false; btn.textContent='Aktifkan';
    });
}
</script>
</body>
</html>
