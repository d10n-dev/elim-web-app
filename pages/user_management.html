<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management — SIEO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:#1a2744;--navy-dk:#131e36;--orange:#e8521a;
      --bg:#eef1f7;--surface:#fff;--border:#d0d8e8;--text:#1a2744;
      --muted:#6b7a99;--green:#1a9e5c;--green-bg:#e6f7ef;--green-bd:#a3d9be;
      --red:#dc3545;--yellow:#f59e0b;
      --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding-bottom:2rem;}
    .topbar{background:var(--navy);border-bottom:3px solid var(--orange);padding:0.7rem 1.1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
    .topbar-left{display:flex;align-items:center;gap:0.75rem;}
    .topbar-back{color:rgba(255,255,255,0.7);font-size:0.75rem;font-family:var(--mono);text-decoration:none;}
    .topbar-back:hover{color:#fff;}
    .topbar-divider{color:rgba(255,255,255,0.2);}
    .topbar-title{font-family:var(--mono);font-weight:600;font-size:0.88rem;letter-spacing:0.05em;color:#fff;text-transform:uppercase;}
    .main{padding:1.1rem;}
    .section-title{font-family:var(--mono);font-size:0.7rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);padding-bottom:0.4rem;border-bottom:1px solid var(--border);margin-bottom:0.85rem;}
    .card-section{background:var(--surface);border-radius:10px;border:1px solid var(--border);padding:1rem;margin-bottom:1.1rem;}
    .user-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0.75rem;margin-bottom:0.6rem;}
    .user-card:last-child{margin-bottom:0;}
    .user-email{font-family:var(--mono);font-size:0.72rem;color:var(--muted);}
    .user-nama{font-size:0.88rem;font-weight:600;margin-bottom:0.1rem;}
    .user-meta{font-family:var(--mono);font-size:0.65rem;color:var(--muted);margin-top:0.2rem;}
    .badge-role{font-family:var(--mono);font-size:0.62rem;font-weight:600;padding:0.15rem 0.45rem;border-radius:4px;letter-spacing:0.04em;}
    .role-direktur{background:#1a274420;color:#1a2744;}
    .role-manager{background:#e8f0fe;color:#1a56b0;}
    .role-admin{background:#e0f2f1;color:#00695c;}
    .role-sales{background:#fff3e0;color:#c45a00;}
    .badge-status{font-family:var(--mono);font-size:0.62rem;font-weight:600;padding:0.15rem 0.45rem;border-radius:4px;}
    .st-aktif{background:var(--green-bg);color:var(--green);}
    .st-pending{background:#fff9c4;color:#827717;}
    .st-nonaktif{background:#fff0f0;color:var(--red);}
    .btn-approve{background:var(--green);color:#fff;border:none;font-family:var(--mono);font-size:0.7rem;font-weight:600;padding:0.35rem 0.75rem;border-radius:5px;cursor:pointer;}
    .btn-approve:hover{background:#158a4e;}
    .btn-nonaktif{background:#fff0f0;color:var(--red);border:1px solid #ffc9c9;font-family:var(--mono);font-size:0.7rem;padding:0.35rem 0.75rem;border-radius:5px;cursor:pointer;}
    .btn-nonaktif:hover{background:#ffe0e0;}
    .btn-aktifkan{background:#e8f0fe;color:#1a56b0;border:1px solid #b3c9f9;font-family:var(--mono);font-size:0.7rem;padding:0.35rem 0.75rem;border-radius:5px;cursor:pointer;}
    .form-select-sm{font-family:var(--mono);font-size:0.75rem;border:1px solid var(--border);border-radius:5px;padding:0.3rem 0.5rem;color:var(--text);}
    .form-select-sm:focus{border-color:var(--navy);outline:none;}
    .loading{text-align:center;padding:1.5rem;font-family:var(--mono);font-size:0.8rem;color:var(--muted);}
    .empty{text-align:center;padding:1.2rem;font-family:var(--mono);font-size:0.78rem;color:var(--muted);}
    .alert-box{font-family:var(--mono);font-size:0.75rem;padding:0.5rem 0.75rem;border-radius:6px;margin-bottom:0.75rem;}
    .alert-err{background:#fff0f0;color:var(--red);border:1px solid #ffc9c9;}
    .alert-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}
    .modal-content{border-radius:12px;border:1px solid var(--border);}
    .modal-header{background:var(--navy);color:#fff;border-radius:12px 12px 0 0;padding:0.8rem 1.1rem;border-bottom:none;}
    .modal-title{font-family:var(--mono);font-size:0.85rem;font-weight:600;}
    .modal-header .btn-close{filter:invert(1);opacity:0.7;}
    .modal-body{padding:1.1rem;}
    .modal-footer{padding:0.75rem 1.1rem;border-top:1px solid var(--border);}
    .form-label{font-family:var(--mono);font-size:0.7rem;font-weight:600;color:var(--muted);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.3rem;display:block;}
    .form-control,.form-select{font-family:var(--mono);font-size:0.8rem;border:1px solid var(--border);border-radius:6px;padding:0.5rem 0.7rem;width:100%;color:var(--text);}
    .form-control:focus,.form-select:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 2px rgba(26,39,68,0.1);}
    .btn-simpan{background:var(--navy);color:#fff;border:none;font-family:var(--mono);font-size:0.75rem;font-weight:600;padding:0.5rem 0.9rem;border-radius:6px;cursor:pointer;}
    .btn-simpan:disabled{opacity:0.5;cursor:not-allowed;}
    .btn-batal{background:transparent;color:var(--muted);border:1px solid var(--border);font-family:var(--mono);font-size:0.75rem;padding:0.5rem 0.9rem;border-radius:6px;cursor:pointer;}
    .user-actions{display:flex;gap:0.4rem;flex-wrap:wrap;margin-top:0.5rem;}
    .tgl-daftar{font-family:var(--mono);font-size:0.63rem;color:var(--muted);}
    .badge-wrap{display:flex;gap:0.3rem;align-items:center;flex-wrap:wrap;margin-top:0.25rem;}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="../index.html" class="topbar-back">&#8592; Menu</a>
    <span class="topbar-divider">|</span>
    <span class="topbar-title">User Management</span>
  </div>
  <div>
    <button class="btn-approve" onclick="muatUser()" style="background:var(--navy)">&#8635; Refresh</button>
  </div>
</div>

<div class="main">
  <div id="alertGlobal"></div>

  <!-- PENDING -->
  <div class="card-section">
    <div class="section-title">&#9888; Menunggu Persetujuan</div>
    <div id="listPending"><div class="loading">Memuat…</div></div>
  </div>

  <!-- AKTIF -->
  <div class="card-section">
    <div class="section-title">&#10003; User Aktif</div>
    <div id="listAktif"><div class="loading">Memuat…</div></div>
  </div>

  <!-- NONAKTIF -->
  <div class="card-section">
    <div class="section-title">&#10005; Nonaktif</div>
    <div id="listNonaktif"><div class="loading">Memuat…</div></div>
  </div>
</div>

<!-- MODAL APPROVE -->
<div class="modal fade" id="modalApprove" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Approve User</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alertApprove"></div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:0.6rem 0.85rem;margin-bottom:0.85rem;">
          <div class="user-nama" id="approveNama">—</div>
          <div class="user-email" id="approveEmail">—</div>
          <div class="tgl-daftar" id="approveTgl">—</div>
        </div>
        <div>
          <label class="form-label">Role *</label>
          <select class="form-select" id="approveRole">
            <option value="">— Pilih Role —</option>
            <option value="MANAGER">MANAGER</option>
            <option value="ADMIN">ADMIN</option>
            <option value="SALES">SALES</option>
          </select>
        </div>
      </div>
      <div class="modal-footer" style="gap:0.5rem">
        <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
        <button class="btn-approve" id="btnKonfirmasiApprove" onclick="konfirmasiApprove()">&#10003; Approve</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL KONFIRMASI NONAKTIF -->
<div class="modal fade" id="modalNonaktif" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Nonaktifkan User</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alertNonaktif"></div>
        <div style="font-family:var(--mono);font-size:0.78rem;color:var(--red);background:#fff0f0;border:1px solid #ffc9c9;border-radius:6px;padding:0.6rem 0.8rem;margin-bottom:0.75rem;">
          User yang dinonaktifkan tidak bisa login ke SIEO.
        </div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:0.6rem 0.85rem;">
          <div class="user-nama" id="nonaktifNama">—</div>
          <div class="user-email" id="nonaktifEmail">—</div>
        </div>
      </div>
      <div class="modal-footer" style="gap:0.5rem">
        <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
        <button class="btn-nonaktif" id="btnKonfirmasiNonaktif" onclick="konfirmasiNonaktif()" style="background:var(--red);color:#fff;border:none">Nonaktifkan</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL AKTIFKAN KEMBALI -->
<div class="modal fade" id="modalAktifkan" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Aktifkan Kembali</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alertAktifkan"></div>
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:0.6rem 0.85rem;margin-bottom:0.85rem;">
          <div class="user-nama" id="aktifkanNama">—</div>
          <div class="user-email" id="aktifkanEmail">—</div>
        </div>
        <div>
          <label class="form-label">Role *</label>
          <select class="form-select" id="aktifkanRole">
            <option value="MANAGER">MANAGER</option>
            <option value="ADMIN">ADMIN</option>
            <option value="SALES">SALES</option>
          </select>
        </div>
      </div>
      <div class="modal-footer" style="gap:0.5rem">
        <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
        <button class="btn-approve" id="btnKonfirmasiAktifkan" onclick="konfirmasiAktifkan()">Aktifkan</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
var emailTarget = null;
var semuaUser   = [];

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', function() {
  // Cek akses — hanya Direktur
  var sesi = getSesi ? getSesi() : null;
  if (!sesi) { window.location.href = 'login.html'; return; }
  if (sesi.role !== 'DIREKTUR') {
    document.getElementById('alertGlobal').innerHTML =
      '<div class="alert-box alert-err">Akses ditolak. Halaman ini hanya untuk Direktur.</div>';
    return;
  }
  muatUser();
});

// ════════════════════════════════════════════════════════════
// MUAT DATA
// ════════════════════════════════════════════════════════════
function muatUser() {
  ['listPending','listAktif','listNonaktif'].forEach(function(id){
    document.getElementById(id).innerHTML = '<div class="loading">Memuat…</div>';
  });
  var idToken = localStorage.getItem('sieo_idtoken') || '';
  apiGet('getSemuaUser', {idToken: idToken}).then(function(res){
    semuaUser = (res && res.data) ? res.data : [];
    renderUser();
  }).catch(function(){
    ['listPending','listAktif','listNonaktif'].forEach(function(id){
      document.getElementById(id).innerHTML = '<div class="loading" style="color:var(--red)">Gagal memuat data.</div>';
    });
  });
}

function renderUser() {
  var pending   = semuaUser.filter(function(u){ return u.STATUS === 'PENDING'; });
  var aktif     = semuaUser.filter(function(u){ return u.STATUS === 'AKTIF'; });
  var nonaktif  = semuaUser.filter(function(u){ return u.STATUS === 'NONAKTIF'; });

  document.getElementById('listPending').innerHTML  = pending.length  ? pending.map(kartuPending).join('') : '<div class="empty">Tidak ada user pending.</div>';
  document.getElementById('listAktif').innerHTML    = aktif.length    ? aktif.map(kartuAktif).join('')   : '<div class="empty">Belum ada user aktif.</div>';
  document.getElementById('listNonaktif').innerHTML = nonaktif.length ? nonaktif.map(kartuNonaktif).join('') : '<div class="empty">Tidak ada user nonaktif.</div>';
}

// ════════════════════════════════════════════════════════════
// RENDER KARTU
// ════════════════════════════════════════════════════════════
function kartuPending(u) {
  var tgl = u.TGL_DAFTAR ? fmtTgl(u.TGL_DAFTAR) : '—';
  return '<div class="user-card">'+
    '<div class="user-nama">'+esc(u.NAMA||'—')+'</div>'+
    '<div class="user-email">'+esc(u.EMAIL)+'</div>'+
    '<div class="badge-wrap">'+
      '<span class="badge-status st-pending">PENDING</span>'+
      '<span class="tgl-daftar">Daftar: '+tgl+'</span>'+
    '</div>'+
    '<div class="user-actions">'+
      '<button class="btn-approve" onclick="bukaApprove(\''+esc(u.EMAIL)+'\',\''+esc(u.NAMA)+'\',\''+tgl+'\')">&#10003; Approve</button>'+
    '</div>'+
  '</div>';
}

function kartuAktif(u) {
  var roleCls = 'role-'+(u.ROLE||'').toLowerCase();
  var lastLogin = u.LAST_LOGIN ? fmtTgl(u.LAST_LOGIN) : '—';
  var isDirektur = (u.ROLE||'').toUpperCase() === 'DIREKTUR';
  return '<div class="user-card">'+
    '<div class="user-nama">'+esc(u.NAMA||'—')+'</div>'+
    '<div class="user-email">'+esc(u.EMAIL)+'</div>'+
    '<div class="badge-wrap">'+
      '<span class="badge-status st-aktif">AKTIF</span>'+
      (u.ROLE ? '<span class="badge-role '+roleCls+'">'+esc(u.ROLE)+'</span>' : '')+
      '<span class="tgl-daftar">Login terakhir: '+lastLogin+'</span>'+
    '</div>'+
    (!isDirektur ?
      '<div class="user-actions">'+
        '<button class="btn-nonaktif" onclick="bukaNonaktif(\''+esc(u.EMAIL)+'\',\''+esc(u.NAMA)+'\')">Nonaktifkan</button>'+
      '</div>' : '')+
  '</div>';
}

function kartuNonaktif(u) {
  var roleCls = 'role-'+(u.ROLE||'').toLowerCase();
  return '<div class="user-card" style="opacity:0.7">'+
    '<div class="user-nama">'+esc(u.NAMA||'—')+'</div>'+
    '<div class="user-email">'+esc(u.EMAIL)+'</div>'+
    '<div class="badge-wrap">'+
      '<span class="badge-status st-nonaktif">NONAKTIF</span>'+
      (u.ROLE ? '<span class="badge-role '+roleCls+'">'+esc(u.ROLE)+'</span>' : '')+
    '</div>'+
    '<div class="user-actions">'+
      '<button class="btn-aktifkan" onclick="bukaAktifkan(\''+esc(u.EMAIL)+'\',\''+esc(u.NAMA)+'\',\''+esc(u.ROLE||'ADMIN')+'\')">Aktifkan Kembali</button>'+
    '</div>'+
  '</div>';
}

// ════════════════════════════════════════════════════════════
// APPROVE
// ════════════════════════════════════════════════════════════
function bukaApprove(email, nama, tgl) {
  emailTarget = email;
  document.getElementById('approveNama').textContent  = nama;
  document.getElementById('approveEmail').textContent = email;
  document.getElementById('approveTgl').textContent   = 'Daftar: ' + tgl;
  document.getElementById('approveRole').value = '';
  document.getElementById('alertApprove').innerHTML = '';
  new bootstrap.Modal(document.getElementById('modalApprove')).show();
}

function konfirmasiApprove() {
  var role = document.getElementById('approveRole').value;
  if (!role) {
    document.getElementById('alertApprove').innerHTML = '<div class="alert-box alert-err">Pilih role terlebih dahulu.</div>';
    return;
  }
  var btn = document.getElementById('btnKonfirmasiApprove');
  btn.disabled = true; btn.textContent = 'Memproses…';
  var idToken = localStorage.getItem('sieo_idtoken') || '';
  apiPost('approveUser', {idToken: idToken, email: emailTarget, role: role}).then(function(res){
    if (res && res.status === 'ok') {
      bootstrap.Modal.getInstance(document.getElementById('modalApprove')).hide();
      document.getElementById('alertGlobal').innerHTML = '<div class="alert-box alert-ok">'+esc(res.message)+'</div>';
      muatUser();
    } else {
      document.getElementById('alertApprove').innerHTML = '<div class="alert-box alert-err">'+esc(res&&res.message||'Gagal.')+'</div>';
    }
    btn.disabled = false; btn.textContent = '✓ Approve';
  }).catch(function(){
    document.getElementById('alertApprove').innerHTML = '<div class="alert-box alert-err">Gagal koneksi GAS.</div>';
    btn.disabled = false; btn.textContent = '✓ Approve';
  });
}

// ════════════════════════════════════════════════════════════
// NONAKTIFKAN
// ════════════════════════════════════════════════════════════
function bukaNonaktif(email, nama) {
  emailTarget = email;
  document.getElementById('nonaktifNama').textContent  = nama;
  document.getElementById('nonaktifEmail').textContent = email;
  document.getElementById('alertNonaktif').innerHTML = '';
  new bootstrap.Modal(document.getElementById('modalNonaktif')).show();
}

function konfirmasiNonaktif() {
  var btn = document.getElementById('btnKonfirmasiNonaktif');
  btn.disabled = true; btn.textContent = 'Memproses…';
  var idToken = localStorage.getItem('sieo_idtoken') || '';
  apiPost('nonaktifUser', {idToken: idToken, email: emailTarget}).then(function(res){
    if (res && res.status === 'ok') {
      bootstrap.Modal.getInstance(document.getElementById('modalNonaktif')).hide();
      document.getElementById('alertGlobal').innerHTML = '<div class="alert-box alert-ok">User berhasil dinonaktifkan.</div>';
      muatUser();
    } else {
      document.getElementById('alertNonaktif').innerHTML = '<div class="alert-box alert-err">'+esc(res&&res.message||'Gagal.')+'</div>';
    }
    btn.disabled = false; btn.textContent = 'Nonaktifkan';
  }).catch(function(){
    document.getElementById('alertNonaktif').innerHTML = '<div class="alert-box alert-err">Gagal koneksi GAS.</div>';
    btn.disabled = false; btn.textContent = 'Nonaktifkan';
  });
}

// ════════════════════════════════════════════════════════════
// AKTIFKAN KEMBALI
// ════════════════════════════════════════════════════════════
function bukaAktifkan(email, nama, role) {
  emailTarget = email;
  document.getElementById('aktifkanNama').textContent  = nama;
  document.getElementById('aktifkanEmail').textContent = email;
  document.getElementById('aktifkanRole').value = role || 'ADMIN';
  document.getElementById('alertAktifkan').innerHTML = '';
  new bootstrap.Modal(document.getElementById('modalAktifkan')).show();
}

function konfirmasiAktifkan() {
  var role = document.getElementById('aktifkanRole').value;
  var btn  = document.getElementById('btnKonfirmasiAktifkan');
  btn.disabled = true; btn.textContent = 'Memproses…';
  var idToken = localStorage.getItem('sieo_idtoken') || '';
  apiPost('approveUser', {idToken: idToken, email: emailTarget, role: role}).then(function(res){
    if (res && res.status === 'ok') {
      bootstrap.Modal.getInstance(document.getElementById('modalAktifkan')).hide();
      document.getElementById('alertGlobal').innerHTML = '<div class="alert-box alert-ok">User berhasil diaktifkan kembali.</div>';
      muatUser();
    } else {
      document.getElementById('alertAktifkan').innerHTML = '<div class="alert-box alert-err">'+esc(res&&res.message||'Gagal.')+'</div>';
    }
    btn.disabled = false; btn.textContent = 'Aktifkan';
  }).catch(function(){
    document.getElementById('alertAktifkan').innerHTML = '<div class="alert-box alert-err">Gagal koneksi GAS.</div>';
    btn.disabled = false; btn.textContent = 'Aktifkan';
  });
}

// ════════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════════
function esc(s){if(s===null||s===undefined)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtTgl(v){if(!v)return '—';var d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'});}
function getSesi(){try{var s=localStorage.getItem('sieo_sesi');return s?JSON.parse(s):null;}catch(e){return null;}}
</script>
</body>
</html>
