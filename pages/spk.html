<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SPK — SIEO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:     #1a2744;
      --navy-dk:  #131e36;
      --navy-mid: #243257;
      --orange:   #e8521a;
      --bg:       #eef1f7;
      --surface:  #ffffff;
      --border:   #d0d8e8;
      --text:     #1a2744;
      --muted:    #6b7a99;
      --green:    #1a9e5c;
      --green-bg: #e6f7ef;
      --green-bd: #a3d9be;
      --red:      #dc3545;
      --yellow:   #f59e0b;
      --mono:     'IBM Plex Mono', monospace;
      --sans:     'IBM Plex Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding-bottom: 2rem; }

    .topbar {
      background: var(--navy); border-bottom: 3px solid var(--orange);
      padding: 0.7rem 1.1rem; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 200;
    }
    .topbar-left { display: flex; align-items: center; gap: 0.75rem; }
    .topbar-back { color: rgba(255,255,255,0.7); font-size: 0.75rem; font-family: var(--mono); text-decoration: none; }
    .topbar-back:hover { color: #fff; }
    .topbar-divider { color: rgba(255,255,255,0.2); }
    .topbar-title { font-family: var(--mono); font-weight: 600; font-size: 0.88rem; letter-spacing: 0.05em; color: #fff; text-transform: uppercase; }

    .main { padding: 1.1rem; }

    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; gap: 0.5rem; flex-wrap: wrap; }
    .toolbar-left { display: flex; align-items: center; gap: 0.5rem; }

    .btn-buat { background: var(--orange); color: #fff; border: none; font-family: var(--mono); font-size: 0.75rem; font-weight: 600; padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; }
    .btn-buat:hover { background: #d04515; }
    .btn-simpan { background: var(--navy); color: #fff; border: none; font-family: var(--mono); font-size: 0.75rem; font-weight: 600; padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; }
    .btn-simpan:hover { background: var(--navy-dk); }
    .btn-simpan:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-batal { background: transparent; color: var(--muted); border: 1px solid var(--border); font-family: var(--mono); font-size: 0.75rem; padding: 0.5rem 0.9rem; border-radius: 6px; cursor: pointer; }
    .btn-hapus-item { background: #fff0f0; color: var(--red); border: 1px solid #ffc9c9; font-family: var(--mono); font-size: 0.68rem; padding: 0.2rem 0.55rem; border-radius: 4px; cursor: pointer; white-space: nowrap; }
    .btn-print { background: #fff; color: var(--navy); border: 1px solid var(--border); font-family: var(--mono); font-size: 0.72rem; padding: 0.3rem 0.65rem; border-radius: 5px; cursor: pointer; }

    .filter-btn { font-family: var(--mono); font-size: 0.72rem; padding: 0.35rem 0.75rem; border-radius: 5px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; }
    .filter-btn.aktif { background: var(--navy); color: #fff; border-color: var(--navy); }

    .tbl-wrap { background: var(--surface); border-radius: 10px; border: 1px solid var(--border); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    thead th { background: var(--navy); color: #fff; font-family: var(--mono); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.05em; padding: 0.6rem 0.75rem; text-align: left; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f5f7fb; }
    tbody td { padding: 0.55rem 0.75rem; vertical-align: middle; }
    .td-mono { font-family: var(--mono); font-size: 0.72rem; }
    .td-muted { color: var(--muted); font-size: 0.75rem; }

    .badge-status { font-family: var(--mono); font-size: 0.63rem; font-weight: 600; padding: 0.2rem 0.5rem; border-radius: 4px; letter-spacing: 0.04em; }
    .bs-open    { background: #e8f0fe; color: #1a56b0; }
    .bs-selesai { background: var(--green-bg); color: var(--green); }

    .loading { text-align: center; padding: 2rem; font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }

    .modal-content { border-radius: 12px; border: 1px solid var(--border); }
    .modal-header { background: var(--navy); color: #fff; border-radius: 12px 12px 0 0; padding: 0.8rem 1.1rem; border-bottom: none; }
    .modal-title { font-family: var(--mono); font-size: 0.85rem; font-weight: 600; letter-spacing: 0.04em; }
    .modal-header .btn-close { filter: invert(1); opacity: 0.7; }
    .modal-body { padding: 1.1rem; }
    .modal-footer { padding: 0.75rem 1.1rem; border-top: 1px solid var(--border); gap: 0.5rem; }

    .form-label { font-family: var(--mono); font-size: 0.7rem; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 0.3rem; display: block; }
    .form-control, .form-select { font-family: var(--mono); font-size: 0.8rem; border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.7rem; width: 100%; color: var(--text); background: var(--surface); }
    .form-control:focus, .form-select:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 2px rgba(26,39,68,0.1); }
    .form-control[readonly] { background: #f5f7fb; color: var(--muted); }
    .form-row { display: grid; gap: 0.75rem; margin-bottom: 0.75rem; }
    .form-row-2 { grid-template-columns: 1fr 1fr; }
    .form-row-3 { grid-template-columns: 1fr 1fr 1fr; }

    .section-divider { font-family: var(--mono); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-bottom: 0.35rem; border-bottom: 1px solid var(--border); margin: 0.9rem 0 0.65rem; }

    /* PPS BAR */
    .pps-bar-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.85rem; margin-bottom: 0.75rem; }
    .pps-bar-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem; font-family: var(--mono); font-size: 0.68rem; }
    .pps-bar-row span:first-child { color: var(--muted); }
    .pps-bar-row span:last-child { font-weight: 600; color: var(--text); }
    .pps-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .pps-fill { height: 100%; border-radius: 3px; background: var(--orange); transition: width 0.25s; }
    .pps-fill.genap { background: var(--green); }
    .pps-fill.lebih { background: var(--red); }

    /* ITEM LIST di modal buat */
    .item-list { margin-bottom: 0.75rem; }
    .item-row {
      display: grid; grid-template-columns: 1fr auto auto; gap: 0.5rem; align-items: center;
      background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
      padding: 0.5rem 0.65rem; margin-bottom: 0.4rem;
    }
    .item-row-info { min-width: 0; }
    .item-row-id   { font-family: var(--mono); font-size: 0.63rem; color: var(--muted); }
    .item-row-nama { font-size: 0.78rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-row-sub  { font-family: var(--mono); font-size: 0.65rem; color: var(--orange); }
    .item-row-pps  { font-family: var(--mono); font-size: 0.72rem; font-weight: 600; white-space: nowrap; text-align: right; }
    .item-row-qty  { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); white-space: nowrap; }

    /* FORM TAMBAH ITEM */
    .tambah-form-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem; }
    .tambah-form-title { font-family: var(--mono); font-size: 0.68rem; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.55rem; }

    /* AUTOCOMPLETE */
    .ac-wrap { position: relative; }
    .ac-dropdown {
      position: fixed; background: var(--surface); border: 1px solid var(--border);
      border-radius: 7px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      max-height: 200px; overflow-y: auto; z-index: 9999; display: none; min-width: 260px;
    }
    .ac-item { padding: 0.5rem 0.75rem; cursor: pointer; border-bottom: 1px solid var(--border); }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover { background: var(--bg); }
    .ac-item-id   { font-family: var(--mono); font-size: 0.63rem; color: var(--muted); display: block; }
    .ac-item-nama { font-size: 0.78rem; color: var(--text); display: block; }
    .ac-item-sub  { font-family: var(--mono); font-size: 0.63rem; color: var(--orange); }
    .ac-item-pps  { font-family: var(--mono); font-size: 0.63rem; color: var(--green); }
    .ac-empty { padding: 0.6rem 0.75rem; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }

    .alert-box { font-family: var(--mono); font-size: 0.75rem; padding: 0.5rem 0.75rem; border-radius: 6px; margin-bottom: 0.6rem; }
    .alert-err  { background: #fff0f0; color: var(--red); border: 1px solid #ffc9c9; }
    .alert-ok   { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
    .alert-warn { background: #fff8e1; color: #9a6500; border: 1px solid #ffe082; }

    .kv-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 1rem; margin-bottom: 0.9rem; }
    .kv-item label { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; display: block; }
    .kv-item span  { font-size: 0.82rem; font-weight: 500; }

    .sdet-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; margin-bottom: 0.75rem; }
    .sdet-table thead th { background: var(--navy-mid); color: #fff; font-family: var(--mono); font-size: 0.63rem; padding: 0.4rem 0.5rem; text-align: left; }
    .sdet-table tbody td { padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .sdet-table tbody tr:last-child td { border-bottom: none; }
    .sdet-empty { text-align: center; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); padding: 0.75rem 0; }

    #printArea { display: none; }
    @media print {
      body > *:not(#printArea) { display: none !important; }
      .modal, .modal-backdrop, nav, header, #topbar { display: none !important; }
      #printArea {
        display: block !important;
        position: absolute; left: 0; top: 0;
        font-family: 'Courier New', Courier, monospace;
        font-size: 11pt; color: #000; background: #fff;
      }
      .spk-page {
        width: 14.8cm;
        padding: 0.8cm 0.9cm;
        box-sizing: border-box;
        page-break-after: always;
      }
      .spk-page:last-child { page-break-after: auto; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="../index.html" class="topbar-back">&#8592; Menu</a>
    <span class="topbar-divider">|</span>
    <span class="topbar-title">SPK</span>
  </div>
  <div>
    <button class="btn-buat" onclick="bukaBuatSPK()">+ Buat SPK</button>
  </div>
</div>

<div class="main">
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="filter-btn aktif" onclick="setFilter('',this)">Semua</button>
      <button class="filter-btn" onclick="setFilter('OPEN',this)">Open</button>
      <button class="filter-btn" onclick="setFilter('SELESAI',this)">Selesai</button>
    </div>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>ID SPK</th>
          <th>Tanggal</th>
          <th>Oplah</th>
          <th>Max PPS</th>
          <th>Status</th>
          <th>Keterangan</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tblBody">
        <tr><td colspan="7" class="loading">Memuat data…</td></tr>
      </tbody>
    </table>
  </div>
</div>


<!-- ======================================================
     MODAL: BUAT SPK (header + input item sekaligus)
     ====================================================== -->
<div class="modal fade" id="modalBuat" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="judul-modal-buat">Buat SPK Baru</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alertBuat"></div>

        <!-- Header SPK -->
        <div class="form-row form-row-2">
          <div>
            <label class="form-label">Total Oplah *</label>
            <input type="number" class="form-control" id="inOplah" placeholder="cth: 1000" min="1" oninput="updatePreviewQty()"/>
          </div>
          <div>
            <label class="form-label">Keterangan</label>
            <input type="text" class="form-control" id="inKet" placeholder="Opsional"/>
          </div>
        </div>

        <!-- PPS bar -->
        <div class="pps-bar-wrap" id="ppsBarWrap" style="display:none">
          <div class="pps-bar-row">
            <span>PPS Terpakai</span>
            <span id="ppsLabel">0 / 0</span>
          </div>
          <div class="pps-track"><div class="pps-fill" id="ppsFill" style="width:0%"></div></div>
        </div>

        <!-- List item yang sudah ditambahkan -->
        <div class="section-divider">Item dalam SPK ini <span id="jumlahItem" style="color:var(--text)">(0)</span></div>
        <div class="item-list" id="itemList">
          <div class="sdet-empty" id="itemEmpty">Belum ada item. Tambahkan di bawah.</div>
        </div>

        <!-- Form tambah item -->
        <div class="tambah-form-wrap">
          <div class="tambah-form-title">Tambah Item</div>
          <div id="alertTambah"></div>
          <div class="form-row">
            <div>
              <label class="form-label">Cari Order Detail *</label>
              <div class="ac-wrap">
                <input type="text" class="form-control" id="inAcItem" placeholder="Isi Total Oplah dulu" autocomplete="off" disabled/>
                <div class="ac-dropdown" id="dropItem"></div>
              </div>
            </div>
          </div>
          <div class="form-row form-row-3">
            <div>
              <label class="form-label">PPS *</label>
              <input type="number" class="form-control" id="inPps" placeholder="cth: 25" min="1" oninput="updatePreviewQty()"/>
            </div>
            <div>
              <label class="form-label">Preview QTY</label>
              <input type="text" class="form-control" id="previewQty" readonly/>
            </div>
            <div style="display:flex;align-items:flex-end">
              <button class="btn-simpan" id="btnTambahItem" onclick="tambahItem()" style="width:100%">+ Tambah</button>
            </div>
          </div>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
        <button class="btn-simpan" id="btnSimpanSPK" onclick="simpanSPK()">Simpan SPK</button>
      </div>
    </div>
  </div>
</div>


<!-- ======================================================
     MODAL: DETAIL SPK (lihat isi SPK yang sudah tersimpan)
     ====================================================== -->
<div class="modal fade" id="modalDetail" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="detailTitle">Detail SPK</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detailBody">
        <div class="loading">Memuat…</div>
      </div>
      <div class="modal-footer">
        <button class="btn-print" onclick="printSPK()">&#128438; Print SPK</button>
        <button class="btn-batal" data-bs-dismiss="modal">Tutup</button>
        <button class="btn-simpan" id="btnCloseSPK" onclick="closeSPKModal()" style="background:#6c757d">&#10003; Close SPK</button>
      </div>
    </div>
  </div>
</div>

<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
// ── STATE ────────────────────────────────────────────────
var semuaSPK      = [];
var filterAktif   = '';
var idSpkAktif    = null;

// State form buat SPK
var daftarItem    = [];   // [{idDetail, idOrder, idItem, namaItem, subitem, qtyOrder, satuan, pps, ppsInput, qty}]
var maxPpsForm    = 0;    // terkunci dari item pertama
var semuaOrdDtl   = [];   // cache order detail belum ter-SPK
var itemDipilih   = null; // item yang sedang dipilih di autocomplete
var acDropAktif   = null;

// ── INIT ────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  muatSPK();
  muatOrderDetail();
  initAcItem();
  document.addEventListener('touchstart', tutupAC);
  document.addEventListener('mousedown', function(e) {
    if (acDropAktif && !acDropAktif.contains(e.target)) tutupAC();
  });
});

// ── MUAT DATA ───────────────────────────────────────────
function muatSPK() {
  document.getElementById('tblBody').innerHTML = '<tr><td colspan="7" class="loading">Memuat…</td></tr>';
  apiGet('getSPK', {}).then(function(res) {
    semuaSPK = (res && res.data) ? res.data : [];
    renderTabel();
  }).catch(function() {
    document.getElementById('tblBody').innerHTML = '<tr><td colspan="7" class="loading" style="color:var(--red)">Gagal memuat data.</td></tr>';
  });
}

function muatOrderDetail() {
  apiGet('getOrderDetailBelumSPK', {}).then(function(res) {
    semuaOrdDtl = (res && res.data) ? res.data : [];
  });
}

// ── TABEL SPK ───────────────────────────────────────────
function renderTabel() {
  var data = filterAktif ? semuaSPK.filter(function(s){return s.STATUS===filterAktif;}) : semuaSPK;
  if (!data.length) {
    document.getElementById('tblBody').innerHTML = '<tr><td colspan="7" class="loading">Belum ada data SPK.</td></tr>';
    return;
  }
  var html = '';
  data.forEach(function(s) {
    html += '<tr>' +
      '<td class="td-mono">' + esc(s.ID_SPK) + '</td>' +
      '<td class="td-mono td-muted">' + fmtTgl(s.TGL_SPK) + '</td>' +
      '<td class="td-mono">' + fmtAngka(s.TOTAL_OPLAH) + '</td>' +
      '<td class="td-mono">' + (s.MAX_PPS || '—') + '</td>' +
      '<td><span class="badge-status ' + kelasBadge(s.STATUS) + '">' + esc(s.STATUS) + '</span></td>' +
      '<td class="td-muted">' + esc(s.KETERANGAN || '—') + '</td>' +
      '<td><button class="btn-print" onclick="bukaDetail(\'' + esc(s.ID_SPK) + '\')">Detail</button></td>' +
    '</tr>';
  });
  document.getElementById('tblBody').innerHTML = html;
}

function setFilter(val, el) {
  filterAktif = val;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('aktif');});
  el.classList.add('aktif');
  renderTabel();
}

// ── BUAT SPK ─────────────────────────────────────────────
function bukaBuatSPK() {
  // Reset state form
  daftarItem  = [];
  maxPpsForm  = 0;
  itemDipilih = null;
  document.getElementById('inOplah').value   = '';
  document.getElementById('inKet').value     = '';
  document.getElementById('inAcItem').value  = '';
  document.getElementById('inPps').value     = '';
  document.getElementById('previewQty').value = '';
  document.getElementById('alertBuat').innerHTML   = '';
  document.getElementById('alertTambah').innerHTML = '';
  renderItemList();
  updatePPSBar();
  new bootstrap.Modal(document.getElementById('modalBuat')).show();
  // Refresh order detail
  muatOrderDetail();
}

// ── AUTOCOMPLETE ITEM ────────────────────────────────────
function initAcItem() {
  var inputEl = document.getElementById('inAcItem');
  var dropEl  = document.getElementById('dropItem');
  if (!inputEl || !dropEl) return;
  acDropAktif = dropEl;

  inputEl.addEventListener('input', function() {
    var q = this.value.toLowerCase().trim();
    if (!q) { tutupAC(); return; }
    var data = semuaOrdDtl.filter(function(d) {
      // Setelah item pertama: filter by PPS sama
      if (maxPpsForm > 0 && parseInt(d.PPS,10) !== maxPpsForm) return false;
      // Exclude yang sudah ada di daftar
      for (var i=0; i<daftarItem.length; i++) {
        if (daftarItem[i].idDetail === d.ID_DETAIL) return false;
      }
      return (
        (d.ID_DETAIL  ||'').toLowerCase().includes(q) ||
        (d.ID_ORDER   ||'').toLowerCase().includes(q) ||
        (d.NAMA_ITEM  ||'').toLowerCase().includes(q) ||
        (d.SUBITEM    ||'').toLowerCase().includes(q)
      );
    }).slice(0, 30);
    renderAC(dropEl, data, inputEl);
  });

  inputEl.addEventListener('focus', function() {
    if (this.value.trim()) inputEl.dispatchEvent(new Event('input'));
  });
  inputEl.addEventListener('blur', function() { setTimeout(tutupAC, 200); });
}

function renderAC(dropEl, data, inputEl) {
  var oplah = parseInt(document.getElementById('inOplah').value, 10) || 0;
  dropEl.innerHTML = '';
  if (!data.length) {
    dropEl.innerHTML = '<div class="ac-empty">' +
      (maxPpsForm > 0 ? 'Tidak ada item dengan PPS ' + maxPpsForm : 'Tidak ditemukan') +
    '</div>';
  } else {
    data.forEach(function(d) {
      var qtySisa    = parseInt(d.QTY_SISA !== undefined ? d.QTY_SISA : d.QTY_ORDER, 10) || 0;
      var saranPps   = oplah > 0 ? Math.floor(qtySisa / oplah) : 0;
      var div = document.createElement('div');
      div.className = 'ac-item';
      div.innerHTML =
        '<span class="ac-item-id">' + esc(d.ID_ORDER) + ' · ' + esc(d.ID_DETAIL) + '</span>' +
        '<span class="ac-item-nama">' + esc(d.NAMA_ITEM) +
          (d.SUBITEM ? ' <span class="ac-item-sub">' + esc(d.SUBITEM) + '</span>' : '') +
        '</span>' +
        '<span class="ac-item-pps">' +
          'QTY Sisa: ' + fmtAngka(qtySisa) + ' ' + esc(d.SATUAN) +
          (saranPps > 0 ? ' &nbsp;|&nbsp; Saran PPS: <strong>' + saranPps + '</strong>' : '') +
        '</span>';
      div.addEventListener('mousedown', function(e){e.preventDefault(); pilihItem(d, inputEl, dropEl);});
      div.addEventListener('touchend',  function(e){e.preventDefault(); pilihItem(d, inputEl, dropEl);});
      dropEl.appendChild(div);
    });
  }
  var rect = inputEl.getBoundingClientRect();
  dropEl.style.top     = (rect.bottom + window.scrollY + 2) + 'px';
  dropEl.style.left    = (rect.left   + window.scrollX) + 'px';
  dropEl.style.width   = rect.width + 'px';
  dropEl.style.display = 'block';
}

function pilihItem(d, inputEl, dropEl) {
  itemDipilih = d;
  inputEl.value = d.ID_ORDER + ' — ' + d.NAMA_ITEM + (d.SUBITEM ? ' (' + d.SUBITEM + ')' : '');
  dropEl.style.display = 'none';

  // Isi PPS otomatis: floor(QTY_SISA / oplah) sebagai saran
  var inPps = document.getElementById('inPps');
  if (inPps) {
    var oplah    = parseInt(document.getElementById('inOplah').value, 10) || 0;
    var qtySisa  = parseInt(d.QTY_SISA !== undefined ? d.QTY_SISA : d.QTY_ORDER, 10) || 0;
    var saranPps = oplah > 0 && qtySisa > 0 ? Math.floor(qtySisa / oplah) : (parseInt(d.PPS, 10) || 0);
    inPps.value  = saranPps;
    updatePreviewQty();
  }
}

function tutupAC() {
  if (acDropAktif) acDropAktif.style.display = 'none';
}

// ── PREVIEW QTY ─────────────────────────────────────────
function updatePreviewQty() {
  var oplah = parseInt(document.getElementById('inOplah').value, 10) || 0;
  var pps   = parseInt(document.getElementById('inPps').value, 10)   || 0;
  document.getElementById('previewQty').value = (oplah > 0 && pps > 0) ? fmtAngka(oplah * pps) : '';

  // Enable/disable input autocomplete berdasarkan oplah
  var inAc = document.getElementById('inAcItem');
  if (inAc) {
    if (oplah > 0) {
      inAc.disabled     = false;
      inAc.placeholder  = 'Ketik ID order / nama item / subitem';
    } else {
      inAc.disabled     = true;
      inAc.placeholder  = 'Isi Total Oplah dulu';
      inAc.value        = '';
      itemDipilih       = null;
      tutupAC();
    }
  }
}

// ── TAMBAH ITEM KE LIST ──────────────────────────────────
function tambahItem() {
  var alertEl = document.getElementById('alertTambah');
  alertEl.innerHTML = '';

  if (!itemDipilih) {
    alertEl.innerHTML = '<div class="alert-box alert-err">Pilih item dari daftar terlebih dahulu.</div>';
    return;
  }
  var oplah    = parseInt(document.getElementById('inOplah').value, 10);
  var ppsInput = parseInt(document.getElementById('inPps').value, 10);

  if (!oplah || oplah <= 0) {
    alertEl.innerHTML = '<div class="alert-box alert-err">Isi Total Oplah terlebih dahulu.</div>';
    return;
  }
  if (!ppsInput || ppsInput <= 0) {
    alertEl.innerHTML = '<div class="alert-box alert-err">PPS wajib diisi.</div>';
    return;
  }

  // Cek duplikat
  for (var i=0; i<daftarItem.length; i++) {
    if (daftarItem[i].idDetail === itemDipilih.ID_DETAIL) {
      alertEl.innerHTML = '<div class="alert-box alert-err">Item ini sudah ada dalam daftar.</div>';
      return;
    }
  }

  // Validasi PPS konsisten
  var ppsItem = parseInt(itemDipilih.PPS, 10);
  if (maxPpsForm === 0) {
    maxPpsForm = ppsItem; // terkunci dari item pertama
  } else if (ppsItem !== maxPpsForm) {
    alertEl.innerHTML = '<div class="alert-box alert-err">PPS item ini (' + ppsItem + ') berbeda dengan Max PPS SPK (' + maxPpsForm + '). Tidak bisa digabung.</div>';
    return;
  }

  // Hitung total PPS jika item ini ditambahkan
  var totalPpsSekarang = daftarItem.reduce(function(s,it){return s+it.ppsInput;}, 0);
  if (totalPpsSekarang + ppsInput > maxPpsForm) {
    alertEl.innerHTML = '<div class="alert-box alert-err">Total PPS akan melebihi Max PPS (' + maxPpsForm + '). Sisa: ' + (maxPpsForm - totalPpsSekarang) + '.</div>';
    return;
  }

  daftarItem.push({
    idDetail:  itemDipilih.ID_DETAIL,
    idOrder:   itemDipilih.ID_ORDER,
    idItem:    itemDipilih.ID_ITEM,
    namaItem:  itemDipilih.NAMA_ITEM,
    subitem:   itemDipilih.SUBITEM || '',
    qtyOrder:  itemDipilih.QTY_ORDER,
    satuan:    itemDipilih.SATUAN,
    pps:       ppsItem,
    ppsInput:  ppsInput,
    qty:       oplah * ppsInput
  });

  // Reset form tambah
  itemDipilih = null;
  document.getElementById('inAcItem').value  = '';
  document.getElementById('inPps').value     = '';
  document.getElementById('previewQty').value = '';
  alertEl.innerHTML = '';

  renderItemList();
  updatePPSBar();
}

// ── HAPUS ITEM DARI LIST ─────────────────────────────────
function hapusItemList(idx) {
  daftarItem.splice(idx, 1);
  if (daftarItem.length === 0) maxPpsForm = 0;
  renderItemList();
  updatePPSBar();
}

  var wrap  = document.getElementById('itemList');

// ── UPDATE PPS BAR ───────────────────────────────────────
function updatePPSBar() {
  var wrap = document.getElementById('ppsBarWrap');
  if (!maxPpsForm || daftarItem.length === 0) {
    wrap.style.display = 'none';
    return;
  }
  var terpakai = daftarItem.reduce(function(s,it){return s+it.ppsInput;},0);
  var pct      = Math.min(Math.round((terpakai / maxPpsForm) * 100), 100);
  var genap    = terpakai === maxPpsForm;
  var lebih    = terpakai > maxPpsForm;

  wrap.style.display = '';
  document.getElementById('ppsLabel').textContent =
    terpakai + ' / ' + maxPpsForm + (genap ? ' ✓ Genap' : ' — Sisa ' + (maxPpsForm - terpakai));
  var fill = document.getElementById('ppsFill');
  fill.style.width = pct + '%';
  fill.className   = 'pps-fill' + (genap ? ' genap' : lebih ? ' lebih' : '');
}

// ── SIMPAN SPK (kirim ke GAS) ────────────────────────────
function simpanSPK() {
  var alertEl = document.getElementById('alertBuat');
  alertEl.innerHTML = '';

  var oplah = parseInt(document.getElementById('inOplah').value, 10);
  var ket   = document.getElementById('inKet').value.trim();

  if (!oplah || oplah <= 0) {
    alertEl.innerHTML = '<div class="alert-box alert-err">Total oplah wajib diisi.</div>';
    return;
  }
  if (daftarItem.length === 0) {
    alertEl.innerHTML = '<div class="alert-box alert-err">Minimal 1 item harus ditambahkan.</div>';
    return;
  }

  // Validasi PPS genap
  var totalPps = daftarItem.reduce(function(s,it){return s+it.ppsInput;},0);
  if (totalPps !== maxPpsForm) {
    alertEl.innerHTML = '<div class="alert-box alert-err">Total PPS belum genap. Terpakai: ' + totalPps + ' dari ' + maxPpsForm + '. Sisa: ' + (maxPpsForm - totalPps) + '.</div>';
    return;
  }

  var btn = document.getElementById('btnSimpanSPK');
  btn.disabled = true; btn.textContent = 'Menyimpan…';

  apiPost('simpanSPKLengkap', {
    totalOplah: oplah,
    keterangan: ket,
    items:      daftarItem.map(function(it){ return {idDetail: it.idDetail, pps: it.ppsInput}; })
  }).then(function(res) {
    if (res && res.status === 'ok') {
      bootstrap.Modal.getInstance(document.getElementById('modalBuat')).hide();
      muatSPK();
      muatOrderDetail();
    } else {
      alertEl.innerHTML = '<div class="alert-box alert-err">' + esc(res && res.message || 'Error tidak diketahui.') + '</div>';
    }
    btn.disabled = false; btn.textContent = 'Simpan SPK';
  }).catch(function() {
    alertEl.innerHTML = '<div class="alert-box alert-err">Gagal koneksi GAS.</div>';
    btn.disabled = false; btn.textContent = 'Simpan SPK';
  });
}

      kv('Status', '<span class="badge-status ' + kelasBadge(spk.STATUS) + '">' + esc(spk.STATUS) + '</span>') +
      kv('Keterangan', esc(spk.KETERANGAN||'—')) +

        '<td style="font-family:var(--mono)">' + esc(r.SATUAN) + '</td>' +
      '</tr>';
    });
    html += '</tbody></table></div>';
  }

  document.getElementById('detailBody').innerHTML = html;
}

function closeSPKModal() {

function eksekusiPrint(alasanOverride, bomOverride) {
  var alasan = (alasanOverride !== undefined) ? alasanOverride
    : (document.getElementById('inAlasanPrint').value || '').trim();

  if (alasanOverride === undefined && !alasan) {
    document.getElementById('alertAlasan').innerHTML =
      '<div class="alert-box alert-err">Alasan wajib diisi.</div>';
    return;
  }

  var btnK = document.getElementById('btnKonfirmasiPrint');
  if (btnK) { btnK.disabled = true; btnK.textContent = 'Memproses…'; }

  apiPost('catatPrintSPK', {
    idSpk:    _printSpk.ID_SPK,
    namaUser: getNamaUserSesi(),
    alasan:   alasan
  }).then(function(res) {
    if (btnK) { btnK.disabled = false; btnK.innerHTML = '&#128438; Cetak'; }
    if (!res || res.status !== 'ok') {
      var msg = (res && res.message) ? res.message : 'Gagal mencatat log print.';
      if (alasanOverride !== undefined) { alert(msg); }
      else {
        document.getElementById('alertAlasan').innerHTML =
          '<div class="alert-box alert-err">' + esc(msg) + '</div>';
      }
      return;
    }
    var cache = semuaSPK.find(function(s){ return s.ID_SPK === _printSpk.ID_SPK; });
    if (cache) { cache.PRINT_COUNT = res.printKe; cache.STATUS_PRINT = 'SUDAH'; }
    _printSpk.PRINT_COUNT = res.printKe;

    var mA = bootstrap.Modal.getInstance(document.getElementById('modalAlasanPrint'));
    if (mA) mA.hide();

    var bom = bomOverride || _printSpk._bom || {bahan:[], tinta:[]};
    renderPrintArea(_printSpk, _printSdet, _printFinish, bom);
  }).catch(function() {
    if (btnK) { btnK.disabled = false; btnK.innerHTML = '&#128438; Cetak'; }
    alert('Gagal koneksi GAS.');
  });
}

      '<td colspan="4" style="padding:3px 4px;text-align:right;font-size:10pt">Total</td>' +
      '<td style="padding:3px 4px;text-align:right;font-size:10pt">'+totPps+'</td>' +
      '<td style="padding:3px 4px;text-align:right;font-size:10pt">'+fmtAngka(totQty)+'</td>' +
      '<td colspan="2"></td>' +
    '</tr></tfoot></table>';
  }

  function footerLine(hal, total) {
    return '<div style="'+footCss+'">'+
      'Dicetak: '+tglCetak+' &nbsp;|&nbsp; Print ke-'+printKe+
      ' &nbsp;|&nbsp; '+esc(namaUser)+
      ' &nbsp;|&nbsp; Hal '+hal+'/'+total+
    '</div>';
  }

  // ── HALAMAN 1 ──
  var hdr =
    '<div style="border-bottom:1.5px solid #000;padding-bottom:8px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">' +
      // Kiri: checklist + operator
      '<div style="flex:1;">' +
        '<div style="font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:5px;">Kesiapan</div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;">' +
          '<div style="display:flex;align-items:center;gap:5px;font-size:10.5pt;"><span style="width:13px;height:13px;border:1.5px solid #000;display:inline-block;flex-shrink:0;"></span>Kertas / Bahan</div>' +
          '<div style="display:flex;align-items:center;gap:5px;font-size:10.5pt;"><span style="width:13px;height:13px;border:1.5px solid #000;display:inline-block;flex-shrink:0;"></span>Plat</div>' +
          '<div style="display:flex;align-items:center;gap:5px;font-size:10.5pt;"><span style="width:13px;height:13px;border:1.5px solid #000;display:inline-block;flex-shrink:0;"></span>Tinta</div>' +
          '<div style="display:flex;align-items:center;gap:5px;font-size:10.5pt;"><span style="width:13px;height:13px;border:1.5px solid #000;display:inline-block;flex-shrink:0;"></span>Finishing</div>' +
        '</div>' +
        '<div style="margin-top:8px;font-size:9pt;color:#555;">Operator Cetak</div>' +
        '<div style="border-bottom:1px solid #000;height:16px;min-width:140px;"></div>' +
        '<div style="margin-top:6px;font-size:9pt;color:#555;">Insheet</div>' +
        '<div style="border-bottom:1px solid #000;height:16px;min-width:140px;"></div>' +
      '</div>' +
      // Kanan: no SPK + info
      '<div style="text-align:right;flex-shrink:0;">' +
        '<div style="font-size:20pt;font-weight:700;letter-spacing:0.03em;line-height:1;">'+esc(spk.ID_SPK)+'</div>' +
        '<div style="font-size:9pt;color:#444;margin-top:2px;">'+fmtTgl(spk.TGL_SPK)+'</div>' +
        '<div style="margin-top:10px;"><div style="font-size:9pt;color:#555;">Oplah</div><div style="font-size:13pt;font-weight:700;">'+fmtAngka(spk.TOTAL_OPLAH)+' lembar</div></div>' +
        '<div style="margin-top:4px;"><div style="font-size:9pt;color:#555;">Max PPS</div><div style="font-size:11pt;font-weight:700;">'+(spk.MAX_PPS||'—')+' pcs</div></div>' +
        (deadline ? '<div style="margin-top:4px;"><div style="font-size:9pt;color:#555;">Deadline</div><div style="font-size:11pt;font-weight:700;">'+deadline+'</div></div>' : '') +
      '</div>' +
    '</div>';

  var meta =
    '<div style="'+secCss+'">Bahan Baku</div>' +
    '<div style="font-size:10.5pt;margin-bottom:4px;">'+bahanLine+'</div>' +
    '<div style="'+secCss+'">Tinta</div>' +
    '<div style="font-size:10.5pt;margin-bottom:4px;">'+tintaLine+'</div>' +
    '<div style="'+secCss+'">Finishing</div>' +
    '<div style="font-size:10.5pt;margin-bottom:6px;">'+finLine+'</div>' +
    '<div style="'+secCss+'">Daftar Item</div>';

  // Batas item halaman 1 — 12 baris
  var batas = 12;
  var hal1Items = sdetData.slice(0, batas);
  var hal2Items = sdetData.slice(batas);
  var totalHal  = hal2Items.length > 0 ? 2 : 1;

  // Baris hal 1
  var rowsHal1 = '';
  hal1Items.forEach(function(r,i){ rowsHal1 += tblRow(r,i); });
  // Baris kosong sampai 12
  for (var e1 = hal1Items.length; e1 < batas; e1++) { rowsHal1 += emptyRow(e1); }

  var hal1 =
    '<div class="spk-page" style="'+S+'">' +
      hdr + meta +
      tblHeader() + rowsHal1 +
      (totalHal === 1 ? tblFooter() : '</tbody></table>') +
      (totalHal === 2 ? '<div style="font-size:8.5pt;color:#888;text-align:right;margin-top:3px;">bersambung ke halaman 2 \u2192</div>' : '') +
      footerLine(1, totalHal) +
    '</div>';

  // ── HALAMAN 2 (jika perlu) ──
  var hal2 = '';
  if (totalHal === 2) {
    var rowsHal2 = '';
    hal2Items.forEach(function(r,i){ rowsHal2 += tblRow(r, batas+i); });
    // Baris kosong sampai 13 baris (sisa ruang hal 2)
    var batas2 = 13;
    for (var e2 = hal2Items.length; e2 < batas2; e2++) { rowsHal2 += emptyRow(batas+e2); }

    hal2 =
      '<div class="spk-page" style="'+S+'">' +
        '<div style="border-bottom:1px solid #000;padding-bottom:6px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:baseline;">' +
          '<div style="font-size:14pt;font-weight:700;">'+esc(spk.ID_SPK)+'</div>' +
          '<div style="font-size:9pt;color:#555;border:1px solid #888;padding:1px 7px;">Lanjutan — Hal 2/2</div>' +
        '</div>' +
        '<div style="'+secCss+'">Daftar Item (lanjutan)</div>' +
        tblHeader() + rowsHal2 + tblFooter() +
        footerLine(2, 2) +
      '</div>';
  }

  var pa = document.getElementById('printArea');
  pa.innerHTML = hal1 + hal2;
  pa.style.display = 'block';
  window.print();
  pa.style.display = 'none';
}

// ── UTILS ───────────────────────────────────────────────
function esc(s) {
  if (s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTgl(v) {
  if (!v) return '—';
  var d = new Date(v);
  return isNaN(d) ? String(v) : d.toLocaleDateString('id-ID',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtAngka(v) {
  var n = parseInt(v,10);
  return isNaN(n) ? '—' : n.toLocaleString('id-ID');
}
function kelasBadge(s) {
  if (s==='OPEN')    return 'bs-open';
  if (s==='SELESAI') return 'bs-selesai';
  return '';
}
function kv(l,v) {
  return '<div class="kv-item"><label>'+l+'</label><span>'+v+'</span></div>';
}
</script>
</body>
</html>
