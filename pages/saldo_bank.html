<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saldo Bank — SIEO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="../css/sieo.css" rel="stylesheet"/>
  <style>
    .saldo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem;margin-bottom:.85rem;}
    .saldo-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.8rem .9rem;}
    .saldo-card .lbl{font-family:var(--mono);font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
    .saldo-card .val{font-family:var(--mono);font-size:1.25rem;font-weight:600;color:var(--navy);margin:.25rem 0 .1rem;}
    .saldo-card .sub{font-family:var(--mono);font-size:.65rem;color:var(--muted);}
    .chip-dk,.chip-pt{font-family:var(--mono);font-size:.6rem;font-weight:600;padding:.12rem .4rem;border-radius:3px;}
    .chip-dk{background:#e8f0fe;color:#1a56db;}
    .chip-pt{background:#fff3cd;color:#856404;}
    .kat{font-family:var(--mono);font-size:.6rem;padding:.12rem .4rem;border-radius:3px;background:#f0f2f6;color:var(--muted);white-space:nowrap;}
    .td-mono{font-family:var(--mono);font-size:.75rem;}
    .td-right{text-align:right;}
    .masuk-val{color:var(--green);font-weight:600;}
    .keluar-val{color:var(--red);font-weight:600;}
    .ket{font-size:.75rem;max-width:260px;word-break:break-word;}
  </style>
</head>
<body>
<div id="navRoot"></div>

<div id="kontenSaldo" style="display:none">
  <div class="saldo-grid" id="saldoCards"><div class="saldo-card"><div class="lbl">Memuat saldo…</div></div></div>

  <div class="toolbar">
    <select id="fRek" onchange="muatMutasi()">
      <option value="">Semua Rekening</option>
      <option value="BCA_DK">BCA DK</option>
      <option value="BCA_PT">BCA PT</option>
    </select>
    <input type="date" id="fMulai" onchange="muatMutasi()" style="max-width:150px"/>
    <span style="align-self:center;font-family:var(--mono);font-size:.7rem;color:var(--muted)">s/d</span>
    <input type="date" id="fAkhir" onchange="muatMutasi()" style="max-width:150px"/>
  </div>
  <div class="toolbar" style="margin-top:.4rem">
    <select id="fJenis" onchange="renderMutasi()">
      <option value="">Masuk &amp; Keluar</option>
      <option value="CR">Masuk</option>
      <option value="DB">Keluar</option>
    </select>
    <input type="text" id="fCari" placeholder="🔍 Cari keterangan / kategori…" oninput="renderMutasi()" style="flex:1;min-width:160px"/>
  </div>

  <div class="info-bar" id="infoBar">Memuat…</div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Tgl</th><th>Rek</th><th>Keterangan</th><th>Kategori</th>
        <th class="td-right">Masuk</th><th class="td-right">Keluar</th>
      </tr></thead>
      <tbody id="tbMutasi"><tr><td colspan="6" class="loading">Memuat…</td></tr></tbody>
    </table>
  </div>
  <div style="font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-top:.5rem">
    Mutasi yang tampil hanya yang sudah diposting. Saldo diambil dari mutasi bank terakhir yang sudah diimport.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
// Halaman baca-saja utk Manager: saldo aktif + mutasi (tanpa PRIVE, tanpa saldo berjalan).
// Data diambil lewat RPC SECURITY DEFINER yang mengecek role di server.
function h(s){return escHtml(s);}
function fmtRp(n){return formatRupiah(n);}
function fmtTgl(s){return formatTanggal(s);}
function badgeRek(id){
  if(id==='BCA_DK') return '<span class="chip-dk">DK</span>';
  if(id==='BCA_PT') return '<span class="chip-pt">PT</span>';
  return h(id||'—');
}
function isoTgl(offsetHari){return new Date(Date.now()+7*3600e3-(offsetHari||0)*864e5).toISOString().slice(0,10);}

var mutasiCache=[];

window.addEventListener('load',function(){
  if(!guardHalaman()) return;
  var role=getRoleUser();
  if(role!=='MANAGER' && role!=='DIREKTUR'){ window.location.replace('../index.html'); return; }
  initNav('saldo_bank');
  document.getElementById('kontenSaldo').style.display='';
  document.getElementById('fMulai').value=isoTgl(30);
  document.getElementById('fAkhir').value=isoTgl(0);
  muatSaldo();
  muatMutasi();
});

async function muatSaldo(){
  var el=document.getElementById('saldoCards');
  try{
    var rows=await dbRpc('get_saldo_bank_ringkas',{});
    if(!Array.isArray(rows)) throw new Error((rows&&rows.message)||'Gagal memuat saldo');
    el.innerHTML=rows.map(function(r){
      return '<div class="saldo-card"><div class="lbl">'+badgeRek(r.id_rekening)+' '+h(r.nama||r.id_rekening)+'</div>'+
        '<div class="val">'+(r.saldo_akhir==null?'—':fmtRp(r.saldo_akhir))+'</div>'+
        '<div class="sub">per mutasi '+(r.tgl_terakhir?fmtTgl(r.tgl_terakhir):'—')+'</div></div>';
    }).join('')||'<div class="saldo-card"><div class="lbl">Tidak ada rekening aktif</div></div>';
  }catch(e){ el.innerHTML='<div class="saldo-card"><div class="lbl" style="color:var(--red)">'+h(e.message)+'</div></div>'; }
}

async function muatMutasi(){
  document.getElementById('infoBar').textContent='Memuat…';
  try{
    var rows=await dbRpc('get_mutasi_bank_ringkas',{
      p_id_rekening:document.getElementById('fRek').value||null,
      p_tgl_mulai:document.getElementById('fMulai').value||null,
      p_tgl_akhir:document.getElementById('fAkhir').value||null
    });
    if(!Array.isArray(rows)) throw new Error((rows&&rows.message)||'Gagal memuat mutasi');
    mutasiCache=rows;
    renderMutasi();
  }catch(e){
    document.getElementById('infoBar').textContent='Gagal: '+e.message;
    document.getElementById('tbMutasi').innerHTML='<tr><td colspan="6" class="loading">—</td></tr>';
  }
}

function renderMutasi(){
  var jenis=document.getElementById('fJenis').value;
  var q=(document.getElementById('fCari').value||'').trim().toLowerCase();
  var rows=mutasiCache.filter(function(r){
    if(jenis && r.jenis!==jenis) return false;
    if(q && ((r.keterangan_bank||'')+' '+(r.kategori||'')).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  document.getElementById('infoBar').textContent=rows.length+' mutasi'+(mutasiCache.length>=2000?' (dibatasi 2000 terbaru — persempit tanggal)':'');
  document.getElementById('tbMutasi').innerHTML=rows.length?rows.map(function(r){
    var cr=r.jenis==='CR';
    return '<tr>'+
      '<td class="td-mono" style="white-space:nowrap">'+fmtTgl(r.tgl_transaksi)+'</td>'+
      '<td>'+badgeRek(r.id_rekening)+'</td>'+
      '<td class="ket">'+h(r.keterangan_bank)+'</td>'+
      '<td><span class="kat">'+h(r.kategori)+'</span></td>'+
      '<td class="td-mono td-right">'+(cr?'<span class="masuk-val">'+fmtRp(r.nominal)+'</span>':'—')+'</td>'+
      '<td class="td-mono td-right">'+(!cr?'<span class="keluar-val">'+fmtRp(r.nominal)+'</span>':'—')+'</td>'+
    '</tr>';
  }).join(''):'<tr><td colspan="6" class="loading">Tidak ada mutasi.</td></tr>';
}
</script>
</body>
</html>
