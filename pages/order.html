<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Masuk — SIEO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:#1a2744; --navy-dark:#131e36; --navy-mid:#243257; --orange:#e8521a;
      --bg:#eef1f7; --surface:#ffffff; --border:#d0d8e8; --text:#1a2744; --muted:#6b7a99;
      --green:#1a9e5c; --green-bg:#e6f7ef; --green-bd:#a3d9be; --red:#dc3545;
      --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding-bottom:2rem;}

    .topbar{background:var(--navy);border-bottom:3px solid var(--orange);padding:.7rem 1.1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
    .topbar-left{display:flex;align-items:center;gap:.75rem;}
    .topbar-back{color:rgba(255,255,255,.7);font-size:.75rem;font-family:var(--mono);text-decoration:none;}
    .topbar-back:hover{color:#fff;}
    .topbar-title{font-family:var(--mono);font-weight:600;font-size:.88rem;letter-spacing:.05em;color:#fff;text-transform:uppercase;}
    .topbar-sub{font-family:var(--mono);font-size:.65rem;color:rgba(255,255,255,.45);}

    .toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:.6rem 1.1rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
    .toolbar input[type=text]{flex:1;min-width:160px;font-size:.82rem;font-family:var(--sans);border:1px solid var(--border);border-radius:6px;padding:.42rem .75rem;color:var(--text);background:var(--bg);outline:none;}
    .toolbar input[type=text]:focus{border-color:var(--navy);background:#fff;}
    .toolbar select{font-size:.8rem;font-family:var(--sans);border:1px solid var(--border);border-radius:6px;padding:.42rem .6rem;color:var(--text);background:var(--bg);outline:none;}
    .btn-tambah{background:var(--orange);color:#fff;border:none;border-radius:6px;font-weight:600;font-size:.82rem;padding:.42rem 1rem;cursor:pointer;white-space:nowrap;margin-left:auto;}
    .btn-tambah:hover{background:#c94416;}
    .info-bar{padding:.4rem 1.1rem;font-family:var(--mono);font-size:.7rem;color:var(--muted);border-bottom:1px solid var(--border);}

    .tbl-wrap{padding:.75rem 1.1rem;overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:.8rem;background:var(--surface);border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(26,39,68,.07);}
    thead tr{background:var(--navy);color:#fff;}
    thead th{font-family:var(--mono);font-weight:600;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:.65rem .75rem;white-space:nowrap;}
    tbody tr{border-bottom:1px solid var(--border);}
    tbody tr:last-child{border-bottom:none;}
    tbody tr:hover{background:#f4f7fc;}
    tbody td{padding:.6rem .75rem;vertical-align:middle;}
    .td-id{font-family:var(--mono);font-size:.7rem;color:var(--muted);white-space:nowrap;}
    .td-tgl{font-family:var(--mono);font-size:.72rem;white-space:nowrap;}
    .badge-status{font-family:var(--mono);font-size:.6rem;font-weight:600;letter-spacing:.05em;padding:.18rem .5rem;border-radius:3px;white-space:nowrap;}
    .s-baru{background:#e8f0fe;color:#1a56db;border:1px solid #a4c0f9;}
    .s-diproses{background:#fff3cd;color:#856404;border:1px solid #ffe083;}
    .s-selesai{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd);}
    .s-batal{background:#fdecea;color:var(--red);border:1px solid #f5a9a0;}
    .btn-detail{font-size:.72rem;padding:.25rem .65rem;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);cursor:pointer;}
    .btn-detail:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
    .empty-row td{text-align:center;padding:2rem;color:var(--muted);font-family:var(--mono);font-size:.78rem;}
    .loading{text-align:center;padding:2.5rem;font-family:var(--mono);font-size:.78rem;color:var(--muted);}

    /* MODAL */
    .modal-content{border:none;border-radius:10px;box-shadow:0 8px 32px rgba(26,39,68,.18);}
    .modal-header{background:var(--navy);color:#fff;border-radius:10px 10px 0 0;padding:.85rem 1.1rem;border-bottom:3px solid var(--orange);}
    .modal-title{font-family:var(--mono);font-weight:600;font-size:.88rem;letter-spacing:.04em;text-transform:uppercase;}
    .modal-header .btn-close{filter:invert(1);opacity:.7;}
    .modal-body{padding:1.1rem;background:#f8fafc;}
    .modal-footer{background:var(--bg);border-top:1px solid var(--border);padding:.75rem 1.1rem;border-radius:0 0 10px 10px;}

    .form-label{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem;display:block;}
    .form-control,.form-select{font-family:var(--sans);font-size:.82rem;border:1px solid var(--border);border-radius:6px;padding:.45rem .75rem;color:var(--text);background:var(--surface);width:100%;outline:none;}
    .form-control:focus,.form-select:focus{border-color:var(--navy);box-shadow:0 0 0 2px rgba(26,39,68,.1);}
    .form-group{margin-bottom:.85rem;}
    .modal-section{font-family:var(--mono);font-size:.65rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--navy-mid);padding:.35rem .75rem;border-radius:4px;margin:1rem 0 .75rem;}

    /* AUTOCOMPLETE — persis pola bom_v2.html */
    .ac-wrap{position:relative;}
    .ac-dropdown{
      position:absolute;top:100%;left:0;right:0;
      background:var(--surface);
      border:1.5px solid var(--navy);
      border-top:none;
      border-radius:0 0 4px 4px;
      max-height:200px;overflow-y:auto;
      z-index:9999;display:none;
      box-shadow:0 4px 12px rgba(0,0,0,.15);
    }
    .ac-dropdown.open{display:block;}
    .ac-item{padding:.5rem .75rem;font-size:.8rem;cursor:pointer;border-bottom:1px solid var(--border);}
    .ac-item:last-child{border-bottom:none;}
    .ac-item:hover{background:#e8edf7;}
    .ac-item-id{font-family:var(--mono);font-size:.68rem;color:var(--muted);display:block;}
    .ac-item-nama{display:block;font-weight:500;}
    .ac-item-sub{font-family:var(--mono);font-size:.68rem;color:var(--muted);}
    .ac-empty{padding:.5rem .75rem;font-size:.78rem;color:var(--muted);font-family:var(--mono);}
    input.ac-selected{border-color:var(--green) !important;background:#f0faf5 !important;}

    .item-row{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.75rem;margin-bottom:.6rem;}
    .item-row-header{font-family:var(--mono);font-size:.65rem;color:var(--muted);margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center;}
    .btn-hapus-item{background:none;border:none;color:var(--red);font-size:1rem;cursor:pointer;padding:0;line-height:1;}
    .btn-tambah-item{width:100%;background:var(--bg);border:1px dashed var(--border);border-radius:6px;padding:.5rem;font-family:var(--mono);font-size:.72rem;color:var(--muted);cursor:pointer;margin-top:.25rem;}
    .btn-tambah-item:hover{border-color:var(--navy);color:var(--navy);}
    .komisi-row{display:none;}

    .btn-batal{font-size:.82rem;padding:.45rem 1.1rem;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;font-family:var(--sans);}
    .btn-simpan{font-weight:600;font-size:.82rem;padding:.45rem 1.4rem;border:none;border-radius:6px;background:var(--navy);color:#fff;cursor:pointer;font-family:var(--sans);}
    .btn-simpan:hover{background:var(--navy-mid);}
    .btn-simpan:disabled{opacity:.6;cursor:not-allowed;}

    .detail-table{width:100%;border-collapse:collapse;font-size:.78rem;}
    .detail-table th{font-family:var(--mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:.4rem .6rem;border-bottom:2px solid var(--border);}
    .detail-table td{padding:.5rem .6rem;border-bottom:1px solid var(--border);}
    .detail-table tr:last-child td{border-bottom:none;}
    .kv-list{display:grid;grid-template-columns:1fr 1fr;gap:.5rem 1rem;margin-bottom:.75rem;}
    .kv-item label{font-family:var(--mono);font-size:.65rem;text-transform:uppercase;color:var(--muted);display:block;}
    .kv-item span{font-size:.82rem;font-weight:500;}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="../index.html" class="topbar-back">← Kembali</a>
    <span style="color:rgba(255,255,255,.2)"> | </span>
    <div>
      <div class="topbar-title">Order Masuk</div>
      <div class="topbar-sub">SIEO — PT. Elim Citra Offset</div>
    </div>
  </div>
</div>

<div class="toolbar">
  <input type="text" id="cariInput" placeholder="Cari pelanggan atau No. PO…" oninput="filterTabel()"/>
  <select id="filterStatus" onchange="filterTabel()">
    <option value="">Semua Status</option>
    <option value="BARU">Baru</option>
    <option value="DIPROSES">Diproses</option>
    <option value="SELESAI">Selesai</option>
    <option value="BATAL">Batal</option>
  </select>
  <button class="btn-tambah" onclick="bukaModalTambah()">+ Tambah Order</button>
</div>
<div class="info-bar" id="infoBar">Memuat data…</div>

<div class="tbl-wrap">
  <table>
    <thead><tr>
      <th>ID Order</th><th>Pelanggan</th><th>No. PO</th>
      <th>Tgl Order</th><th>Deadline</th><th>Status</th><th>Aksi</th>
    </tr></thead>
    <tbody id="bodyOrder">
      <tr><td colspan="7" class="loading">Memuat data order…</td></tr>
    </tbody>
  </table>
</div>

<!-- MODAL TAMBAH — tanpa modal-dialog-scrollable -->
<div class="modal fade" id="modalTambah" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Tambah Order Masuk</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alertForm"></div>
        <div class="modal-section">Data Order</div>

        <div class="form-group">
          <label class="form-label">Pelanggan *</label>
          <div class="ac-wrap" id="acWrapPel">
            <input type="text" class="form-control" id="inputPelanggan"
              placeholder="Ketik nama pelanggan…" autocomplete="off"/>
            <div class="ac-dropdown" id="acDropPelanggan"></div>
          </div>
          <input type="hidden" id="hidIdPelanggan"/>
          <input type="hidden" id="hidIdAgen"/>
        </div>

        <div class="form-group">
          <label class="form-label">No. PO <span style="font-weight:400;text-transform:none;font-size:.65rem">(opsional)</span></label>
          <input type="text" class="form-control" id="inputNoPo" placeholder="Contoh: PO-2026-001"/>
        </div>

        <div class="row g-2">
          <div class="col-6">
            <div class="form-group">
              <label class="form-label">Tgl. Order *</label>
              <input type="date" class="form-control" id="inputTglOrder" onchange="setDefaultDeadline()"/>
            </div>
          </div>
          <div class="col-6">
            <div class="form-group">
              <label class="form-label">Deadline *</label>
              <input type="date" class="form-control" id="inputDeadline"/>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Keterangan <span style="font-weight:400;text-transform:none;font-size:.65rem">(opsional)</span></label>
          <input type="text" class="form-control" id="inputKeterangan" placeholder="Catatan order…"/>
        </div>

        <div class="form-group komisi-row" id="rowKomisi">
          <label class="form-label">Komisi Agen (Rp) *</label>
          <input type="number" class="form-control" id="inputKomisi" placeholder="Nominal potongan rupiah" min="0"/>
          <div style="font-size:.68rem;color:var(--muted);font-family:var(--mono);margin-top:.3rem" id="labelAgen"></div>
        </div>

        <div class="modal-section">Item Order</div>
        <div id="containerItems"></div>
        <button class="btn-tambah-item" onclick="tambahBariItem()">+ Tambah Item</button>
      </div>
      <div class="modal-footer">
        <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
        <button class="btn-simpan" id="btnSimpan" onclick="simpanOrder()">Simpan Order</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DETAIL -->
<div class="modal fade" id="modalDetail" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="detailTitle">Detail Order</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detailBody">
        <div class="loading">Memuat detail…</div>
      </div>
      <div class="modal-footer">
        <button class="btn-batal" data-bs-dismiss="modal">Tutup</button>
        <button class="btn-simpan" id="btnClose" onclick="closeOrderModal()" style="background:var(--green)">✓ Close Order</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
var semuaOrder=[], semuaPelanggan=[], semuaItem=[];
var itemCounter=0, idOrderDetail=null;

// ── FUNGSI AC GENERIK (persis pola bom_v2.html) ────────────
function buatAC(inputEl, dropEl, data, idKey, namaKey, onPilih) {
  function filter(q) {
    q = q.toLowerCase();
    return data.filter(function(d) {
      return (d[idKey]||'').toLowerCase().includes(q) ||
             (d[namaKey]||'').toLowerCase().includes(q);
    }).slice(0, 30);
  }

  function render(items) {
    dropEl.innerHTML = '';
    if (!items.length) {
      dropEl.innerHTML = '<div class="ac-empty">Tidak ditemukan</div>';
    } else {
      items.forEach(function(d) {
        var div = document.createElement('div');
        div.className = 'ac-item';
        div.innerHTML = '<span class="ac-item-id">' + esc(d[idKey]) + '</span>' +
                        '<span class="ac-item-nama">' + esc(d[namaKey]) + '</span>';
        // mousedown + touchend dengan preventDefault — persis bom_v2.html
        div.addEventListener('mousedown', function(e) { e.preventDefault(); pilih(d); });
        div.addEventListener('touchend',  function(e) { e.preventDefault(); pilih(d); });
        dropEl.appendChild(div);
      });
    }
    dropEl.classList.add('open');
  }

  function pilih(d) {
    inputEl.value = d[idKey] + ' | ' + d[namaKey];
    inputEl.classList.add('ac-selected');
    dropEl.classList.remove('open');
    if (onPilih) onPilih(d);
  }

  function tutup() { dropEl.classList.remove('open'); }

  inputEl.addEventListener('input', function() {
    inputEl.classList.remove('ac-selected');
    var q = inputEl.value.trim();
    if (!q) { tutup(); return; }
    render(filter(q));
  });

  inputEl.addEventListener('focus', function() {
    var q = inputEl.value.trim();
    if (q && !inputEl.classList.contains('ac-selected')) render(filter(q));
  });

  inputEl.addEventListener('blur', function() {
    setTimeout(tutup, 200);
  });

  // expose
  inputEl._getSelectedId = function() {
    if (!inputEl.classList.contains('ac-selected')) return '';
    return inputEl.value.split(' | ')[0].trim();
  };
  inputEl._clear = function() {
    inputEl.value=''; inputEl.classList.remove('ac-selected'); tutup();
  };
}

// ── INIT ───────────────────────────────────────────────────
window.onload = function() {
  setTglHariIni();
  Promise.all([
    apiGet('getOrder'),
    apiGet('getPelanggan'),
    apiGet('getItem')
  ]).then(function(results) {
    var ro=results[0], rp=results[1], ri=results[2];
    semuaOrder     = (ro && ro.data) ? ro.data : [];
    semuaPelanggan = (rp && rp.data) ? rp.data : [];
    semuaItem      = (ri && ri.data) ? ri.data : [];
    renderTabel(semuaOrder);
  }).catch(function() {
    document.getElementById('infoBar').textContent = 'Gagal memuat data.';
  });
};

function setTglHariIni() {
  var today = new Date().toISOString().slice(0,10);
  document.getElementById('inputTglOrder').value = today;
  setDefaultDeadline();
}
function setDefaultDeadline() {
  var tgl = document.getElementById('inputTglOrder').value;
  if (!tgl) return;
  var d = new Date(tgl); d.setDate(d.getDate()+10);
  document.getElementById('inputDeadline').value = d.toISOString().slice(0,10);
}

// ── TABEL ──────────────────────────────────────────────────
function renderTabel(data) {
  document.getElementById('infoBar').textContent = data.length+' dari '+semuaOrder.length+' order';
  var tbody = document.getElementById('bodyOrder');
  if (!data.length) { tbody.innerHTML='<tr class="empty-row"><td colspan="7">Tidak ada data order.</td></tr>'; return; }
  tbody.innerHTML = data.map(function(o) {
    return '<tr>'+
      '<td class="td-id">'+esc(o.ID_ORDER)+'</td>'+
      '<td style="font-weight:500">'+esc(o.NAMA_PELANGGAN)+'</td>'+
      '<td style="font-family:var(--mono);font-size:.72rem">'+(o.NO_PO||'<span style="color:var(--muted)">—</span>')+'</td>'+
      '<td class="td-tgl">'+fmtTgl(o.TGL_ORDER)+'</td>'+
      '<td class="td-tgl">'+fmtTgl(o.DEADLINE)+'</td>'+
      '<td><span class="badge-status '+kelasBadge(o.STATUS)+'">'+esc(o.STATUS)+'</span></td>'+
      '<td><button class="btn-detail" onclick="bukaDetail(\''+esc(o.ID_ORDER)+'\')">Detail</button></td>'+
    '</tr>';
  }).join('');
}
function kelasBadge(s) {
  return s==='BARU'?'s-baru':s==='DIPROSES'?'s-diproses':s==='SELESAI'?'s-selesai':s==='BATAL'?'s-batal':'s-baru';
}
function filterTabel() {
  var q=document.getElementById('cariInput').value.toLowerCase();
  var st=document.getElementById('filterStatus').value;
  renderTabel(semuaOrder.filter(function(o) {
    return (!q||(o.NAMA_PELANGGAN||'').toLowerCase().includes(q)||(o.NO_PO||'').toLowerCase().includes(q)||(o.ID_ORDER||'').toLowerCase().includes(q))
      && (!st||o.STATUS===st);
  }));
}

// ── MODAL TAMBAH ───────────────────────────────────────────
function bukaModalTambah() {
  resetForm();
  var m = new bootstrap.Modal(document.getElementById('modalTambah'));
  m.show();
  // Setup AC setelah modal terbuka dan data sudah ada
  document.getElementById('modalTambah').addEventListener('shown.bs.modal', function onShown() {
    setupAcPelanggan();
    document.getElementById('modalTambah').removeEventListener('shown.bs.modal', onShown);
  }, {once: true});
}

function setupAcPelanggan() {
  var inp  = document.getElementById('inputPelanggan');
  var drop = document.getElementById('acDropPelanggan');
  inp._clear && inp._clear();
  buatAC(inp, drop, semuaPelanggan, 'ID_PELANGGAN', 'NAMA', function(d) {
    document.getElementById('hidIdPelanggan').value = d.ID_PELANGGAN;
    document.getElementById('hidIdAgen').value      = d.ID_AGEN || '';
    if (d.ID_AGEN) {
      document.getElementById('rowKomisi').style.display = 'block';
      document.getElementById('labelAgen').textContent   = 'Agen: '+d.ID_AGEN;
    } else {
      document.getElementById('rowKomisi').style.display = 'none';
      document.getElementById('inputKomisi').value = '';
    }
  });
}

function resetForm() {
  document.getElementById('alertForm').innerHTML='';
  document.getElementById('inputPelanggan').value='';
  document.getElementById('inputPelanggan').classList.remove('ac-selected');
  document.getElementById('hidIdPelanggan').value='';
  document.getElementById('hidIdAgen').value='';
  document.getElementById('inputNoPo').value='';
  document.getElementById('inputKeterangan').value='';
  document.getElementById('rowKomisi').style.display='none';
  document.getElementById('inputKomisi').value='';
  document.getElementById('labelAgen').textContent='';
  document.getElementById('containerItems').innerHTML='';
  itemCounter=0;
  setTglHariIni();
  tambahBariItem();
  document.getElementById('btnSimpan').disabled=false;
  document.getElementById('btnSimpan').textContent='Simpan Order';
}

// ── ITEM ROWS ──────────────────────────────────────────────
function tambahBariItem() {
  itemCounter++;
  var n=itemCounter;
  var div=document.createElement('div');
  div.className='item-row'; div.id='item-row-'+n;
  div.innerHTML=
    '<div class="item-row-header"><span>Item #'+n+'</span>'+
    '<button class="btn-hapus-item" onclick="hapusItem('+n+')">✕</button></div>'+
    '<div class="row g-2">'+
      '<div class="col-12"><label class="form-label">Item *</label>'+
        '<div class="ac-wrap">'+
          '<input type="text" class="form-control" id="inputItem'+n+'" placeholder="Ketik nama item…" autocomplete="off"/>'+
          '<div class="ac-dropdown" id="acDropItem'+n+'"></div>'+
        '</div>'+
        '<input type="hidden" id="hidIdItem'+n+'"/></div>'+
      '<div class="col-12"><label class="form-label">Subitem *</label>'+
        '<input type="text" class="form-control" id="inputSubitem'+n+'" placeholder="Contoh: 2PLY, 3PLY, A4…"/></div>'+
      '<div class="col-4"><label class="form-label">QTY *</label>'+
        '<input type="number" class="form-control" id="inputQty'+n+'" placeholder="0" min="1"/></div>'+
      '<div class="col-4"><label class="form-label">Satuan *</label>'+
        '<select class="form-select" id="inputSatuan'+n+'">'+
          '<option value="">— Pilih —</option>'+
          '<option>RIM</option><option>LBR</option><option>PCS</option>'+
          '<option>BUKU</option><option>SET</option><option>BOX</option>'+
        '</select></div>'+
      '<div class="col-4"><label class="form-label">Harga *</label>'+
        '<input type="number" class="form-control" id="inputHarga'+n+'" placeholder="0" min="0"/></div>'+
    '</div>';
  document.getElementById('containerItems').appendChild(div);

  // Setup AC item langsung setelah elemen dibuat
  buatAC(
    document.getElementById('inputItem'+n),
    document.getElementById('acDropItem'+n),
    semuaItem, 'ID_ITEM', 'NAMA_ITEM',
    function(d) { document.getElementById('hidIdItem'+n).value = d.ID_ITEM; }
  );
}
function hapusItem(n) { var el=document.getElementById('item-row-'+n); if(el) el.remove(); }

// ── SIMPAN ─────────────────────────────────────────────────
function simpanOrder() {
  var idPelanggan = document.getElementById('hidIdPelanggan').value.trim();
  var tglOrder    = document.getElementById('inputTglOrder').value;
  var deadline    = document.getElementById('inputDeadline').value;
  if (!idPelanggan) { tampilAlert('Pilih pelanggan dari daftar.'); return; }
  if (!tglOrder)    { tampilAlert('Tgl. Order wajib diisi.'); return; }
  if (!deadline)    { tampilAlert('Deadline wajib diisi.'); return; }

  var items=[]; var valid=true;
  document.getElementById('containerItems').querySelectorAll('.item-row').forEach(function(row) {
    if (!valid) return;
    var id=row.id.replace('item-row-','');
    var idItem  = document.getElementById('hidIdItem'+id).value.trim();
    var subitem = document.getElementById('inputSubitem'+id).value.trim();
    var qty     = parseFloat(document.getElementById('inputQty'+id).value);
    var satuan  = document.getElementById('inputSatuan'+id).value;
    var harga   = parseFloat(document.getElementById('inputHarga'+id).value);
    if (!idItem)           { tampilAlert('Pilih item pada baris #'+id); valid=false; return; }
    if (!subitem)          { tampilAlert('Subitem baris #'+id+' wajib diisi.'); valid=false; return; }
    if (!qty||qty<1)       { tampilAlert('QTY baris #'+id+' tidak valid.'); valid=false; return; }
    if (!satuan)           { tampilAlert('Pilih satuan baris #'+id); valid=false; return; }
    if (isNaN(harga)||harga<0) { tampilAlert('Harga baris #'+id+' tidak valid.'); valid=false; return; }
    var idAgen=document.getElementById('hidIdAgen').value;
    var komisi=idAgen?(parseFloat(document.getElementById('inputKomisi').value)||0):0;
    items.push({idItem:idItem,subitem:subitem,qty:qty,satuan:satuan,harga:harga,komisiAgen:komisi});
  });
  if (!valid) return;
  if (!items.length) { tampilAlert('Tambahkan minimal 1 item.'); return; }

  var btn=document.getElementById('btnSimpan');
  btn.disabled=true; btn.textContent='Menyimpan…';
  apiPost('tambahOrder', {
    idPelanggan:idPelanggan,
    noPo:document.getElementById('inputNoPo').value.trim(),
    tglOrder:tglOrder, deadline:deadline,
    keterangan:document.getElementById('inputKeterangan').value.trim(),
    items:items
  }).then(function(res) {
    if (res&&res.status==='ok') {
      bootstrap.Modal.getInstance(document.getElementById('modalTambah')).hide();
      apiGet('getOrder').then(function(r){ semuaOrder=(r&&r.data)?r.data:[]; renderTabel(semuaOrder); });
    } else {
      tampilAlert('Gagal: '+(res&&res.message?res.message:'Error'));
      btn.disabled=false; btn.textContent='Simpan Order';
    }
  }).catch(function(){ tampilAlert('Gagal koneksi GAS.'); btn.disabled=false; btn.textContent='Simpan Order'; });
}
function tampilAlert(msg) {
  document.getElementById('alertForm').innerHTML=
    '<div style="background:#fdecea;border:1px solid #f5a9a0;border-radius:6px;padding:.5rem .75rem;font-size:.78rem;color:#a00;margin-bottom:.75rem;font-family:var(--mono)">'+msg+'</div>';
}

// ── DETAIL ─────────────────────────────────────────────────
function bukaDetail(idOrder) {
  idOrderDetail=idOrder;
  document.getElementById('detailTitle').textContent='Detail — '+idOrder;
  document.getElementById('detailBody').innerHTML='<div class="loading">Memuat…</div>';
  var order=semuaOrder.find(function(o){return o.ID_ORDER===idOrder;});
  document.getElementById('btnClose').style.display=(order&&(order.STATUS==='SELESAI'||order.STATUS==='BATAL'))?'none':'';
  new bootstrap.Modal(document.getElementById('modalDetail')).show();
  apiGet('getOrderDetail',{idOrder:idOrder}).then(function(res){
    renderDetail(order,(res&&res.data)?res.data:[]);
  }).catch(function(){
    document.getElementById('detailBody').innerHTML='<div style="color:var(--red);font-family:var(--mono);font-size:.78rem;padding:1rem">Gagal memuat detail.</div>';
  });
}
function renderDetail(order,details) {
  if (!order) return;
  var html='<div class="kv-list">'+
    kv('Pelanggan',order.NAMA_PELANGGAN)+kv('No. PO',order.NO_PO||'—')+
    kv('Tgl. Order',fmtTgl(order.TGL_ORDER))+kv('Deadline',fmtTgl(order.DEADLINE))+
    kv('Status','<span class="badge-status '+kelasBadge(order.STATUS)+'">'+esc(order.STATUS)+'</span>')+
    kv('Keterangan',order.KETERANGAN||'—')+
  '</div><div style="font-family:var(--mono);font-size:.65rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)">Item Order</div>';
  if (!details.length) {
    html+='<div style="font-family:var(--mono);font-size:.75rem;color:var(--muted);padding:.5rem 0">Belum ada item.</div>';
  } else {
    html+='<table class="detail-table"><thead><tr><th>#</th><th>Item</th><th>Subitem</th><th>QTY</th><th>Sat</th><th>Harga</th></tr></thead><tbody>';
    details.forEach(function(d,i){
      html+='<tr><td style="color:var(--muted);font-family:var(--mono);font-size:.68rem">'+(i+1)+'</td>'+
        '<td>'+esc(d.NAMA_ITEM)+'</td><td style="font-family:var(--mono);font-size:.72rem">'+esc(d.SUBITEM)+'</td>'+
        '<td style="font-family:var(--mono)">'+fmtAngka(d.QTY)+'</td>'+
        '<td style="font-family:var(--mono)">'+esc(d.SATUAN)+'</td>'+
        '<td style="font-family:var(--mono)">'+fmtRupiah(d.HARGA)+'</td></tr>';
    });
    html+='</tbody></table>';
  }
  document.getElementById('detailBody').innerHTML=html;
}
function kv(l,v){return '<div class="kv-item"><label>'+l+'</label><span>'+v+'</span></div>';}

function closeOrderModal() {
  if (!idOrderDetail) return;
  if (!confirm('Close order '+idOrderDetail+'?')) return;
  var btn=document.getElementById('btnClose');
  btn.disabled=true; btn.textContent='Memproses…';
  apiPost('closeOrder',{idOrder:idOrderDetail}).then(function(res){
    if (res&&res.status==='ok') { bootstrap.Modal.getInstance(document.getElementById('modalDetail')).hide(); apiGet('getOrder').then(function(r){semuaOrder=(r&&r.data)?r.data:[];renderTabel(semuaOrder);}); }
    else alert('Gagal: '+(res&&res.message||'Error'));
    btn.disabled=false; btn.textContent='✓ Close Order';
  }).catch(function(){alert('Gagal koneksi GAS.');btn.disabled=false;btn.textContent='✓ Close Order';});
}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtTgl(s){if(!s)return'—';var d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});}
function fmtAngka(n){return Number(n).toLocaleString('id-ID');}
function fmtRupiah(n){return 'Rp '+Number(n).toLocaleString('id-ID');}
</script>
</body>
</html>
