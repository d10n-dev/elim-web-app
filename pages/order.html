<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Masuk — SIEO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy:      #1a2744;
      --navy-dark: #131e36;
      --navy-mid:  #243257;
      --orange:    #e8521a;
      --bg:        #eef1f7;
      --surface:   #ffffff;
      --border:    #d0d8e8;
      --text:      #1a2744;
      --muted:     #6b7a99;
      --green:     #1a9e5c;
      --green-bg:  #e6f7ef;
      --green-bd:  #a3d9be;
      --red:       #dc3545;
      --yellow:    #f59e0b;
      --mono:      'IBM Plex Mono', monospace;
      --sans:      'IBM Plex Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding-bottom: 2rem; }

    /* TOPBAR */
    .topbar {
      background: var(--navy); border-bottom: 3px solid var(--orange);
      padding: 0.7rem 1.1rem; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 200;
    }
    .topbar-left { display: flex; align-items: center; gap: 0.75rem; }
    .topbar-back { color: rgba(255,255,255,0.7); font-size: 0.75rem; font-family: var(--mono); text-decoration: none; }
    .topbar-back:hover { color: #fff; }
    .topbar-divider { color: rgba(255,255,255,0.2); }
    .topbar-title { font-family: var(--mono); font-weight: 600; font-size: 0.88rem; letter-spacing: 0.05em; color: #fff; text-transform: uppercase; }
    .topbar-sub { font-family: var(--mono); font-size: 0.65rem; color: rgba(255,255,255,0.45); }

    /* TOOLBAR */
    .toolbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.1rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    }
    .toolbar input[type=text] {
      flex: 1; min-width: 160px; font-size: 0.82rem; font-family: var(--sans);
      border: 1px solid var(--border); border-radius: 6px; padding: 0.42rem 0.75rem;
      color: var(--text); background: var(--bg); outline: none;
    }
    .toolbar input[type=text]:focus { border-color: var(--navy); background: #fff; }
    .toolbar select {
      font-size: 0.8rem; font-family: var(--sans); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.42rem 0.6rem; color: var(--text); background: var(--bg); outline: none;
    }
    .btn-tambah {
      background: var(--orange); color: #fff; border: none; border-radius: 6px;
      font-weight: 600; font-size: 0.82rem; padding: 0.42rem 1rem; cursor: pointer; white-space: nowrap; margin-left: auto;
    }
    .btn-tambah:hover { background: #c94416; }
    .info-bar { padding: 0.4rem 1.1rem; font-family: var(--mono); font-size: 0.7rem; color: var(--muted); border-bottom: 1px solid var(--border); }

    /* TABLE */
    .tbl-wrap { padding: 0.75rem 1.1rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; background: var(--surface); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(26,39,68,0.07); }
    thead tr { background: var(--navy); color: #fff; }
    thead th { font-family: var(--mono); font-weight: 600; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.65rem 0.75rem; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f4f7fc; }
    tbody td { padding: 0.6rem 0.75rem; vertical-align: middle; }
    .td-id { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); white-space: nowrap; }
    .td-tgl { font-family: var(--mono); font-size: 0.72rem; white-space: nowrap; }
    .badge-status { font-family: var(--mono); font-size: 0.6rem; font-weight: 600; letter-spacing: 0.05em; padding: 0.18rem 0.5rem; border-radius: 3px; white-space: nowrap; }
    .s-baru     { background: #e8f0fe; color: #1a56db; border: 1px solid #a4c0f9; }
    .s-diproses { background: #fff3cd; color: #856404; border: 1px solid #ffe083; }
    .s-selesai  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
    .s-batal    { background: #fdecea; color: var(--red); border: 1px solid #f5a9a0; }
    .btn-detail { font-size: 0.72rem; padding: 0.25rem 0.65rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); cursor: pointer; }
    .btn-detail:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
    .empty-row td { text-align: center; padding: 2rem; color: var(--muted); font-family: var(--mono); font-size: 0.78rem; }
    .loading { text-align: center; padding: 2.5rem; font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }

    /* MODAL — TANPA scrollable, biar modal scroll natural */
    .modal-content { border: none; border-radius: 10px; box-shadow: 0 8px 32px rgba(26,39,68,0.18); }
    .modal-header { background: var(--navy); color: #fff; border-radius: 10px 10px 0 0; padding: 0.85rem 1.1rem; border-bottom: 3px solid var(--orange); }
    .modal-title { font-family: var(--mono); font-weight: 600; font-size: 0.88rem; letter-spacing: 0.04em; text-transform: uppercase; }
    .modal-header .btn-close { filter: invert(1); opacity: 0.7; }
    .modal-body { padding: 1.1rem; background: #f8fafc; overflow: visible !important; }
    .modal-footer { background: var(--bg); border-top: 1px solid var(--border); padding: 0.75rem 1.1rem; border-radius: 0 0 10px 10px; }

    /* FORM */
    .form-label { font-family: var(--mono); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; display: block; }
    .form-control, .form-select {
      font-family: var(--sans); font-size: 0.82rem; border: 1px solid var(--border);
      border-radius: 6px; padding: 0.45rem 0.75rem; color: var(--text); background: var(--surface); width: 100%; outline: none;
    }
    .form-control:focus, .form-select:focus { border-color: var(--navy); box-shadow: 0 0 0 2px rgba(26,39,68,0.1); }
    .form-group { margin-bottom: 0.85rem; }
    .modal-section { font-family: var(--mono); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; background: var(--navy-mid); padding: 0.35rem 0.75rem; border-radius: 4px; margin: 1rem 0 0.75rem; }

    /* AUTOCOMPLETE — pola sama dengan bom_v2.html */
    .ac-wrap { position: relative; }
    .ac-dropdown {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: var(--surface);
      border: 1.5px solid var(--navy);
      border-top: none;
      border-radius: 0 0 4px 4px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 9999;
      display: none;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }
    .ac-dropdown.open { display: block; }
    .ac-item { padding: 0.5rem 0.75rem; font-size: 0.8rem; cursor: pointer; border-bottom: 1px solid var(--border); font-family: var(--sans); }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover, .ac-item.active { background: #e8edf7; }
    .ac-sub { font-size: 0.68rem; color: var(--muted); font-family: var(--mono); margin-top: 1px; }

    /* ITEM ROWS */
    .item-row { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; margin-bottom: 0.6rem; }
    .item-row-header { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
    .btn-hapus-item { background: none; border: none; color: var(--red); font-size: 1rem; cursor: pointer; padding: 0; line-height: 1; }
    .btn-tambah-item { width: 100%; background: var(--bg); border: 1px dashed var(--border); border-radius: 6px; padding: 0.5rem; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); cursor: pointer; margin-top: 0.25rem; }
    .btn-tambah-item:hover { border-color: var(--navy); color: var(--navy); }
    .komisi-row { display: none; }

    .btn-batal { font-size: 0.82rem; padding: 0.45rem 1.1rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); cursor: pointer; font-family: var(--sans); }
    .btn-simpan { font-weight: 600; font-size: 0.82rem; padding: 0.45rem 1.4rem; border: none; border-radius: 6px; background: var(--navy); color: #fff; cursor: pointer; font-family: var(--sans); }
    .btn-simpan:hover { background: var(--navy-mid); }
    .btn-simpan:disabled { opacity: 0.6; cursor: not-allowed; }

    .detail-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .detail-table th { font-family: var(--mono); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 0.4rem 0.6rem; border-bottom: 2px solid var(--border); }
    .detail-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
    .detail-table tr:last-child td { border-bottom: none; }
    .kv-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem; margin-bottom: 0.75rem; }
    .kv-item label { font-family: var(--mono); font-size: 0.65rem; text-transform: uppercase; color: var(--muted); display: block; }
    .kv-item span { font-size: 0.82rem; font-weight: 500; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-left">
    <a href="../index.html" class="topbar-back">← Kembali</a>
    <span class="topbar-divider"> | </span>
    <div>
      <div class="topbar-title">Order Masuk</div>
      <div class="topbar-sub">SIEO — PT. Elim Citra Offset</div>
    </div>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <input type="text" id="cariInput" placeholder="Cari pelanggan atau No. PO…" oninput="filterTabel()"/>
  <select id="filterStatus" onchange="filterTabel()">
    <option value="">Semua Status</option>
    <option value="BARU">Baru</option>
    <option value="DIPROSES">Diproses</option>
    <option value="SELESAI">Selesai</option>
    <option value="BATAL">Batal</option>
  </select>
  <button class="btn-tambah" onclick="bukaModalTambah()">+ Tambah Order</button>
</div>
<div class="info-bar" id="infoBar">Memuat data…</div>

<div class="tbl-wrap">
  <table>
    <thead>
      <tr>
        <th>ID Order</th><th>Pelanggan</th><th>No. PO</th>
        <th>Tgl Order</th><th>Deadline</th><th>Status</th><th>Aksi</th>
      </tr>
    </thead>
    <tbody id="bodyOrder">
      <tr><td colspan="7" class="loading">Memuat data order…</td></tr>
    </tbody>
  </table>
</div>

<!-- MODAL TAMBAH — TANPA modal-dialog-scrollable -->
<div class="modal fade" id="modalTambah" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Tambah Order Masuk</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alertForm"></div>

        <div class="modal-section">Data Order</div>

        <!-- Pelanggan autocomplete -->
        <div class="form-group">
          <label class="form-label">Pelanggan *</label>
          <div class="ac-wrap">
            <input type="text" class="form-control" id="inputPelanggan"
              placeholder="Ketik nama pelanggan…" autocomplete="off"
              oninput="cariPelanggan(this.value)"
              onfocus="cariPelanggan(this.value)"/>
            <div class="ac-dropdown" id="acDropPelanggan"></div>
          </div>
          <input type="hidden" id="hidIdPelanggan"/>
          <input type="hidden" id="hidIdAgen"/>
        </div>

        <div class="form-group">
          <label class="form-label">No. PO <span style="font-weight:400;text-transform:none;font-size:0.65rem">(opsional)</span></label>
          <input type="text" class="form-control" id="inputNoPo" placeholder="Contoh: PO-2026-001"/>
        </div>

        <div class="row g-2">
          <div class="col-6">
            <div class="form-group">
              <label class="form-label">Tgl. Order *</label>
              <input type="date" class="form-control" id="inputTglOrder" onchange="setDefaultDeadline()"/>
            </div>
          </div>
          <div class="col-6">
            <div class="form-group">
              <label class="form-label">Deadline *</label>
              <input type="date" class="form-control" id="inputDeadline"/>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Keterangan <span style="font-weight:400;text-transform:none;font-size:0.65rem">(opsional)</span></label>
          <input type="text" class="form-control" id="inputKeterangan" placeholder="Catatan order…"/>
        </div>

        <div class="form-group komisi-row" id="rowKomisi">
          <label class="form-label">Komisi Agen (Rp) *</label>
          <input type="number" class="form-control" id="inputKomisi" placeholder="Nominal potongan rupiah" min="0"/>
          <div style="font-size:0.68rem;color:var(--muted);font-family:var(--mono);margin-top:0.3rem" id="labelAgen"></div>
        </div>

        <div class="modal-section">Item Order</div>
        <div id="containerItems"></div>
        <button class="btn-tambah-item" onclick="tambahBariItem()">+ Tambah Item</button>
      </div>
      <div class="modal-footer">
        <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
        <button class="btn-simpan" id="btnSimpan" onclick="simpanOrder()">Simpan Order</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DETAIL -->
<div class="modal fade" id="modalDetail" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="detailTitle">Detail Order</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detailBody">
        <div class="loading">Memuat detail…</div>
      </div>
      <div class="modal-footer">
        <button class="btn-batal" data-bs-dismiss="modal">Tutup</button>
        <button class="btn-simpan" id="btnClose" onclick="closeOrderModal()" style="background:var(--green)">✓ Close Order</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script>
var semuaOrder     = [];
var semuaPelanggan = [];
var semuaItem      = [];
var itemCounter    = 0;
var idOrderDetail  = null;

document.addEventListener('DOMContentLoaded', function() {
  setTglHariIni();
  muatOrder();
  muatPelanggan();
  muatItem();
  // Tutup dropdown saat tap/klik di luar
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.ac-wrap')) {
      document.querySelectorAll('.ac-dropdown').forEach(function(d) { d.classList.remove('open'); });
    }
  });
});

function setTglHariIni() {
  var today = new Date().toISOString().slice(0,10);
  document.getElementById('inputTglOrder').value = today;
  setDefaultDeadline();
}

function setDefaultDeadline() {
  var tgl = document.getElementById('inputTglOrder').value;
  if (!tgl) return;
  var d = new Date(tgl); d.setDate(d.getDate()+10);
  document.getElementById('inputDeadline').value = d.toISOString().slice(0,10);
}

// ── LOAD DATA ──────────────────────────────────────────────
function muatOrder() {
  apiGet('getOrder').then(function(res) {
    semuaOrder = (res && res.data) ? res.data : [];
    renderTabel(semuaOrder);
  }).catch(function() {
    document.getElementById('bodyOrder').innerHTML =
      '<tr><td colspan="7" style="text-align:center;padding:2rem;color:#dc3545;font-family:var(--mono);font-size:0.78rem">Gagal memuat data.</td></tr>';
  });
}
function muatPelanggan() {
  apiGet('getPelanggan').then(function(res) { semuaPelanggan = (res && res.data) ? res.data : []; });
}
function muatItem() {
  apiGet('getItem').then(function(res) { semuaItem = (res && res.data) ? res.data : []; });
}

// ── RENDER TABEL ───────────────────────────────────────────
function renderTabel(data) {
  document.getElementById('infoBar').textContent = data.length + ' dari ' + semuaOrder.length + ' order';
  var tbody = document.getElementById('bodyOrder');
  if (data.length === 0) { tbody.innerHTML = '<tr class="empty-row"><td colspan="7">Tidak ada data order.</td></tr>'; return; }
  tbody.innerHTML = data.map(function(o) {
    return '<tr>' +
      '<td class="td-id">' + esc(o.ID_ORDER) + '</td>' +
      '<td style="font-weight:500">' + esc(o.NAMA_PELANGGAN) + '</td>' +
      '<td style="font-family:var(--mono);font-size:0.72rem">' + (o.NO_PO || '<span style="color:var(--muted)">—</span>') + '</td>' +
      '<td class="td-tgl">' + fmtTgl(o.TGL_ORDER) + '</td>' +
      '<td class="td-tgl">' + fmtTgl(o.DEADLINE) + '</td>' +
      '<td><span class="badge-status ' + kelasBadge(o.STATUS) + '">' + esc(o.STATUS) + '</span></td>' +
      '<td><button class="btn-detail" onclick="bukaDetail(\'' + esc(o.ID_ORDER) + '\')">Detail</button></td>' +
    '</tr>';
  }).join('');
}
function kelasBadge(s) {
  if (s==='BARU') return 's-baru'; if (s==='DIPROSES') return 's-diproses';
  if (s==='SELESAI') return 's-selesai'; if (s==='BATAL') return 's-batal';
  return 's-baru';
}
function filterTabel() {
  var q  = document.getElementById('cariInput').value.toLowerCase();
  var st = document.getElementById('filterStatus').value;
  renderTabel(semuaOrder.filter(function(o) {
    var cq = !q||(o.NAMA_PELANGGAN||'').toLowerCase().includes(q)||(o.NO_PO||'').toLowerCase().includes(q)||(o.ID_ORDER||'').toLowerCase().includes(q);
    return cq && (!st || o.STATUS===st);
  }));
}

// ── MODAL TAMBAH ───────────────────────────────────────────
function bukaModalTambah() {
  resetForm();
  new bootstrap.Modal(document.getElementById('modalTambah')).show();
}
function resetForm() {
  document.getElementById('alertForm').innerHTML = '';
  document.getElementById('inputPelanggan').value = '';
  document.getElementById('hidIdPelanggan').value = '';
  document.getElementById('hidIdAgen').value = '';
  document.getElementById('inputNoPo').value = '';
  document.getElementById('inputKeterangan').value = '';
  document.getElementById('rowKomisi').style.display = 'none';
  document.getElementById('inputKomisi').value = '';
  document.getElementById('labelAgen').textContent = '';
  document.getElementById('containerItems').innerHTML = '';
  itemCounter = 0;
  setTglHariIni();
  tambahBariItem();
  document.getElementById('btnSimpan').disabled = false;
  document.getElementById('btnSimpan').textContent = 'Simpan Order';
}

// ── AUTOCOMPLETE PELANGGAN ─────────────────────────────────
function cariPelanggan(q) {
  var drop = document.getElementById('acDropPelanggan');
  var qLow = q.toLowerCase().trim();
  if (!qLow) { drop.classList.remove('open'); drop.innerHTML = ''; return; }

  var hasil = semuaPelanggan.filter(function(p) {
    return (p.NAMA||'').toLowerCase().includes(qLow) || (p.ID_PELANGGAN||'').toLowerCase().includes(qLow);
  }).slice(0,8);

  if (!hasil.length) { drop.classList.remove('open'); drop.innerHTML = ''; return; }

  drop.innerHTML = hasil.map(function(p) {
    var d = JSON.stringify(p).replace(/"/g,'&quot;');
    return '<div class="ac-item" onclick="pilihPelanggan(' + d + ')">' +
      '<div>' + esc(p.NAMA) + '</div>' +
      '<div class="ac-sub">' + esc(p.ID_PELANGGAN) + ' · ' + (p.TIPE||'') + (p.ID_AGEN ? ' · Ada Agen' : '') + '</div>' +
    '</div>';
  }).join('');
  drop.classList.add('open');
}
function pilihPelanggan(p) {
  document.getElementById('inputPelanggan').value = p.NAMA;
  document.getElementById('hidIdPelanggan').value = p.ID_PELANGGAN;
  document.getElementById('hidIdAgen').value      = p.ID_AGEN || '';
  document.getElementById('acDropPelanggan').classList.remove('open');
  if (p.ID_AGEN) {
    document.getElementById('rowKomisi').style.display = 'block';
    document.getElementById('labelAgen').textContent   = 'Agen: ' + p.ID_AGEN;
  } else {
    document.getElementById('rowKomisi').style.display = 'none';
    document.getElementById('inputKomisi').value = '';
  }
}

// ── BARIS ITEM ─────────────────────────────────────────────
function tambahBariItem() {
  itemCounter++;
  var n = itemCounter;
  var div = document.createElement('div');
  div.className = 'item-row'; div.id = 'item-row-' + n;
  div.innerHTML =
    '<div class="item-row-header"><span>Item #' + n + '</span>' +
    '<button class="btn-hapus-item" onclick="hapusItem(' + n + ')">✕</button></div>' +
    '<div class="row g-2">' +
      '<div class="col-12"><label class="form-label">Item *</label>' +
        '<div class="ac-wrap">' +
          '<input type="text" class="form-control" id="inputItem' + n + '"' +
            ' placeholder="Ketik nama item…" autocomplete="off"' +
            ' oninput="cariItem(' + n + ',this.value)"' +
            ' onfocus="cariItem(' + n + ',this.value)"/>' +
          '<div class="ac-dropdown" id="acDropItem' + n + '"></div>' +
        '</div>' +
        '<input type="hidden" id="hidIdItem' + n + '"/>' +
      '</div>' +
      '<div class="col-12"><label class="form-label">Subitem *</label>' +
        '<input type="text" class="form-control" id="inputSubitem' + n + '" placeholder="Contoh: 2PLY, 3PLY, A4…"/></div>' +
      '<div class="col-4"><label class="form-label">QTY *</label>' +
        '<input type="number" class="form-control" id="inputQty' + n + '" placeholder="0" min="1"/></div>' +
      '<div class="col-4"><label class="form-label">Satuan *</label>' +
        '<select class="form-select" id="inputSatuan' + n + '">' +
          '<option value="">— Pilih —</option>' +
          '<option>RIM</option><option>LBR</option><option>PCS</option>' +
          '<option>BUKU</option><option>SET</option><option>BOX</option>' +
        '</select></div>' +
      '<div class="col-4"><label class="form-label">Harga *</label>' +
        '<input type="number" class="form-control" id="inputHarga' + n + '" placeholder="0" min="0"/></div>' +
    '</div>';
  document.getElementById('containerItems').appendChild(div);
}
function hapusItem(n) { var el=document.getElementById('item-row-'+n); if(el) el.remove(); }

// ── AUTOCOMPLETE ITEM ──────────────────────────────────────
function cariItem(n, q) {
  var drop = document.getElementById('acDropItem' + n);
  var qLow = q.toLowerCase().trim();
  // Tutup dropdown item lain
  document.querySelectorAll('[id^="acDropItem"]').forEach(function(d) { if(d.id!=='acDropItem'+n) d.classList.remove('open'); });

  if (!qLow) { drop.classList.remove('open'); drop.innerHTML=''; return; }

  var hasil = semuaItem.filter(function(it) {
    return (it.NAMA_ITEM||'').toLowerCase().includes(qLow)||(it.ID_ITEM||'').toLowerCase().includes(qLow);
  }).slice(0,8);

  if (!hasil.length) { drop.classList.remove('open'); drop.innerHTML=''; return; }

  drop.innerHTML = hasil.map(function(it) {
    var d = JSON.stringify(it).replace(/"/g,'&quot;');
    return '<div class="ac-item" onclick="pilihItem(' + n + ',' + d + ')">' +
      '<div>' + esc(it.NAMA_ITEM) + '</div>' +
      '<div class="ac-sub">' + esc(it.ID_ITEM) + (it.NAMA_PELANGGAN?' · '+esc(it.NAMA_PELANGGAN):'') + '</div>' +
    '</div>';
  }).join('');
  drop.classList.add('open');
}
function pilihItem(n, it) {
  document.getElementById('inputItem'  + n).value = it.NAMA_ITEM;
  document.getElementById('hidIdItem'  + n).value = it.ID_ITEM;
  document.getElementById('acDropItem' + n).classList.remove('open');
}

// ── SIMPAN ORDER ───────────────────────────────────────────
function simpanOrder() {
  var idPelanggan = document.getElementById('hidIdPelanggan').value.trim();
  var tglOrder    = document.getElementById('inputTglOrder').value;
  var deadline    = document.getElementById('inputDeadline').value;
  if (!idPelanggan) { tampilAlert('Pilih pelanggan terlebih dahulu.'); return; }
  if (!tglOrder)    { tampilAlert('Tgl. Order wajib diisi.'); return; }
  if (!deadline)    { tampilAlert('Deadline wajib diisi.'); return; }

  var items=[]; var valid=true;
  document.getElementById('containerItems').querySelectorAll('.item-row').forEach(function(row) {
    if (!valid) return;
    var id = row.id.replace('item-row-','');
    var idItem  = document.getElementById('hidIdItem'   +id).value.trim();
    var subitem = document.getElementById('inputSubitem'+id).value.trim();
    var qty     = parseFloat(document.getElementById('inputQty'   +id).value);
    var satuan  = document.getElementById('inputSatuan' +id).value;
    var harga   = parseFloat(document.getElementById('inputHarga' +id).value);
    if (!idItem)        { tampilAlert('Pilih item pada baris #'+id); valid=false; return; }
    if (!subitem)       { tampilAlert('Subitem baris #'+id+' wajib diisi.'); valid=false; return; }
    if (!qty||qty<1)    { tampilAlert('QTY baris #'+id+' tidak valid.'); valid=false; return; }
    if (!satuan)        { tampilAlert('Pilih satuan baris #'+id); valid=false; return; }
    if (isNaN(harga)||harga<0) { tampilAlert('Harga baris #'+id+' tidak valid.'); valid=false; return; }
    var idAgen = document.getElementById('hidIdAgen').value;
    var komisi = idAgen ? (parseFloat(document.getElementById('inputKomisi').value)||0) : 0;
    items.push({idItem:idItem, subitem:subitem, qty:qty, satuan:satuan, harga:harga, komisiAgen:komisi});
  });
  if (!valid) return;
  if (!items.length) { tampilAlert('Tambahkan minimal 1 item.'); return; }

  var btn = document.getElementById('btnSimpan');
  btn.disabled=true; btn.textContent='Menyimpan…';
  apiPost({action:'tambahOrder', idPelanggan:idPelanggan,
    noPo:document.getElementById('inputNoPo').value.trim(),
    tglOrder:tglOrder, deadline:deadline,
    keterangan:document.getElementById('inputKeterangan').value.trim(),
    items:items
  }).then(function(res) {
    if (res && res.status==='ok') {
      bootstrap.Modal.getInstance(document.getElementById('modalTambah')).hide();
      muatOrder();
    } else {
      tampilAlert('Gagal: '+(res&&res.message?res.message:'Error'));
      btn.disabled=false; btn.textContent='Simpan Order';
    }
  }).catch(function() {
    tampilAlert('Gagal koneksi GAS.'); btn.disabled=false; btn.textContent='Simpan Order';
  });
}
function tampilAlert(msg) {
  document.getElementById('alertForm').innerHTML =
    '<div style="background:#fdecea;border:1px solid #f5a9a0;border-radius:6px;padding:0.5rem 0.75rem;font-size:0.78rem;color:#a00;margin-bottom:0.75rem;font-family:var(--mono)">' + msg + '</div>';
}

// ── DETAIL ORDER ───────────────────────────────────────────
function bukaDetail(idOrder) {
  idOrderDetail = idOrder;
  document.getElementById('detailTitle').textContent = 'Detail — '+idOrder;
  document.getElementById('detailBody').innerHTML = '<div class="loading">Memuat…</div>';
  var order = semuaOrder.find(function(o){return o.ID_ORDER===idOrder;});
  document.getElementById('btnClose').style.display = (order&&(order.STATUS==='SELESAI'||order.STATUS==='BATAL'))?'none':'';
  new bootstrap.Modal(document.getElementById('modalDetail')).show();
  apiGet('getOrderDetail', {idOrder:idOrder}).then(function(res) {
    renderDetail(order, (res&&res.data)?res.data:[]);
  }).catch(function() {
    document.getElementById('detailBody').innerHTML='<div style="color:var(--red);font-family:var(--mono);font-size:0.78rem;padding:1rem">Gagal memuat detail.</div>';
  });
}
function renderDetail(order, details) {
  if (!order) return;
  var html = '<div class="kv-list">'+
    kv('Pelanggan',order.NAMA_PELANGGAN)+kv('No. PO',order.NO_PO||'—')+
    kv('Tgl. Order',fmtTgl(order.TGL_ORDER))+kv('Deadline',fmtTgl(order.DEADLINE))+
    kv('Status','<span class="badge-status '+kelasBadge(order.STATUS)+'">'+esc(order.STATUS)+'</span>')+
    kv('Keterangan',order.KETERANGAN||'—')+
  '</div>'+
  '<div style="font-family:var(--mono);font-size:0.65rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem;padding-bottom:0.3rem;border-bottom:1px solid var(--border)">Item Order</div>';
  if (!details.length) {
    html+='<div style="font-family:var(--mono);font-size:0.75rem;color:var(--muted);padding:0.5rem 0">Belum ada item.</div>';
  } else {
    html+='<table class="detail-table"><thead><tr><th>#</th><th>Item</th><th>Subitem</th><th>QTY</th><th>Sat</th><th>Harga</th></tr></thead><tbody>';
    details.forEach(function(d,i) {
      html+='<tr><td style="color:var(--muted);font-family:var(--mono);font-size:0.68rem">'+(i+1)+'</td>'+
        '<td>'+esc(d.NAMA_ITEM)+'</td><td style="font-family:var(--mono);font-size:0.72rem">'+esc(d.SUBITEM)+'</td>'+
        '<td style="font-family:var(--mono)">'+fmtAngka(d.QTY)+'</td>'+
        '<td style="font-family:var(--mono)">'+esc(d.SATUAN)+'</td>'+
        '<td style="font-family:var(--mono)">'+fmtRupiah(d.HARGA)+'</td></tr>';
    });
    html+='</tbody></table>';
  }
  document.getElementById('detailBody').innerHTML=html;
}
function kv(l,v){return '<div class="kv-item"><label>'+l+'</label><span>'+v+'</span></div>';}

// ── CLOSE ORDER ────────────────────────────────────────────
function closeOrderModal() {
  if (!idOrderDetail) return;
  if (!confirm('Close order '+idOrderDetail+'?\nPastikan semua item sudah selesai.')) return;
  var btn=document.getElementById('btnClose');
  btn.disabled=true; btn.textContent='Memproses…';
  apiPost({action:'closeOrder',idOrder:idOrderDetail}).then(function(res) {
    if (res&&res.status==='ok') { bootstrap.Modal.getInstance(document.getElementById('modalDetail')).hide(); muatOrder(); }
    else alert('Gagal: '+(res&&res.message||'Error'));
    btn.disabled=false; btn.textContent='✓ Close Order';
  }).catch(function(){alert('Gagal koneksi GAS.'); btn.disabled=false; btn.textContent='✓ Close Order';});
}

// ── API ────────────────────────────────────────────────────
var GAS_URL='https://script.google.com/macros/s/AKfycbzJEhc7gkNc3FVvbeGaEKuVO2DCdJ7gwwknpYCL6mv4xh4fGvwZPi2Ww6kfKZ1yxMiX/exec';
function apiGet(action,params){
  var url=GAS_URL+'?action='+encodeURIComponent(action);
  if(params) Object.keys(params).forEach(function(k){url+='&'+k+'='+encodeURIComponent(params[k]);});
  return fetch(url).then(function(r){return r.json();});
}
function apiPost(data){
  return fetch(GAS_URL,{method:'POST',body:JSON.stringify(data)}).then(function(r){return r.json();});
}

// ── HELPERS ────────────────────────────────────────────────
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtTgl(s){if(!s)return'—';var d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});}
function fmtAngka(n){return Number(n).toLocaleString('id-ID');}
function fmtRupiah(n){return 'Rp '+Number(n).toLocaleString('id-ID');}
</script>
