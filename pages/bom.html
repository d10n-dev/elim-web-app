<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIEO — BOM Item</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f5f4f0;--surface:#fff;--border:#d0cec8;--accent:#1a3a5c;--accent2:#c8401a;--text:#1c1c1c;--muted:#777;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;}
    *{box-sizing:border-box;}
    body{background:var(--bg);font-family:var(--sans);color:var(--text);font-size:14px;}
    .page-header{background:var(--accent);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--accent2);}
    .page-header .title{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
    .page-header .subtitle{font-size:11px;opacity:.6;margin-top:2px;font-family:var(--mono);}
    .btn-back{color:#fff;text-decoration:none;font-size:13px;opacity:.8;}
    .btn-back:hover{opacity:1;color:#fff;}

    /* PANEL PILIH ITEM */
    .panel{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;}
    .panel label{font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:6px;}
    .item-select-wrap{display:flex;gap:8px;align-items:center;}
    .item-select-wrap select{flex:1;font-size:13px;border:1px solid var(--border);border-radius:3px;padding:7px 10px;background:var(--bg);font-family:var(--sans);}
    .btn-load{background:var(--accent);color:#fff;border:none;border-radius:3px;padding:7px 16px;font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
    .btn-load:hover{background:#142d4a;}

    /* BOM EDITOR */
    .bom-wrap{padding:12px 16px 100px;}
    .section-title{font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;}
    .bom-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:8px;}

    /* TINTA */
    .tinta-row{display:flex;gap:8px;align-items:center;}
    .tinta-row select,.tinta-row input{font-size:13px;border:1px solid var(--border);border-radius:3px;padding:6px 10px;background:var(--bg);font-family:var(--sans);}
    .tinta-row select{min-width:160px;}
    .tinta-row input{flex:1;}

    /* BAHAN LIST */
    .bahan-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
    .bahan-row select{flex:1;font-size:13px;border:1px solid var(--border);border-radius:3px;padding:6px 8px;background:var(--bg);font-family:var(--sans);}
    .bahan-row input{font-size:12px;border:1px solid var(--border);border-radius:3px;padding:6px 8px;background:var(--bg);width:160px;font-family:var(--sans);}
    .btn-del{background:none;border:1px solid #fca5a5;color:#dc2626;border-radius:2px;padding:4px 8px;font-size:11px;font-family:var(--mono);cursor:pointer;white-space:nowrap;}
    .btn-del:hover{background:#fee2e2;}
    .btn-add-row{background:none;border:1px dashed var(--border);color:var(--muted);border-radius:3px;padding:5px 12px;font-size:12px;font-family:var(--mono);cursor:pointer;width:100%;margin-top:4px;}
    .btn-add-row:hover{border-color:var(--accent);color:var(--accent);}

    /* FINISHING LIST */
    .fin-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
    .fin-row select,.fin-row input{flex:1;font-size:13px;border:1px solid var(--border);border-radius:3px;padding:6px 8px;background:var(--bg);font-family:var(--sans);}

    /* SAVE */
    .save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:2px solid var(--border);padding:10px 16px;display:flex;gap:8px;justify-content:flex-end;}
    .btn-simpan{background:var(--accent2);color:#fff;border:none;border-radius:3px;padding:9px 24px;font-family:var(--mono);font-size:13px;font-weight:600;cursor:pointer;}
    .btn-simpan:hover{background:#a83314;}
    .btn-simpan:disabled{opacity:.5;cursor:not-allowed;}

    .loading-state{text-align:center;padding:40px;font-family:var(--mono);font-size:12px;color:var(--muted);}
    .spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .alert-bar{padding:8px 16px;font-family:var(--mono);font-size:12px;}
    .item-info{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;}
  </style>
</head>
<body>
<div class="page-header">
  <div>
    <div class="title">BOM — Bill of Materials</div>
    <div class="subtitle">SIEO — PT. Elim Citra Offset</div>
  </div>
  <a href="../index.html" class="btn-back">← Kembali</a>
</div>

<!-- PILIH ITEM -->
<div class="panel">
  <label>Pilih Item</label>
  <div class="item-select-wrap">
    <select id="selItem" onchange="infoItem()">
      <option value="">-- Pilih item --</option>
    </select>
    <button class="btn-load" onclick="muatBom()">Muat BOM</button>
  </div>
  <div class="item-info" id="itemInfo"></div>
</div>

<div id="alertBar" class="alert-bar"></div>

<!-- BOM EDITOR -->
<div class="bom-wrap" id="bomWrap" style="display:none">

  <!-- TINTA -->
  <div class="section-title">Tinta</div>
  <div class="bom-card">
    <div class="tinta-row">
      <select id="selTinta">
        <option value="">-- Pilih tinta --</option>
        <option value="HITAM">HITAM</option>
        <option value="CMYK">CMYK</option>
        <option value="SPOT COLOR">SPOT COLOR</option>
        <option value="UV">UV</option>
      </select>
      <input type="text" id="inputTinta" placeholder="Atau ketik warna spesifik...">
    </div>
  </div>

  <!-- BAHAN -->
  <div class="section-title">Bahan Baku</div>
  <div class="bom-card">
    <div id="listBahan"></div>
    <button class="btn-add-row" onclick="tambahRowBahan()">+ Tambah Bahan</button>
  </div>

  <!-- FINISHING -->
  <div class="section-title">Finishing <span style="font-size:10px;font-weight:400">(urutkan sesuai proses, PACKING selalu di akhir)</span></div>
  <div class="bom-card">
    <div id="listFinishing"></div>
    <button class="btn-add-row" onclick="tambahRowFinishing()">+ Tambah Finishing</button>
  </div>

  <!-- KETERANGAN -->
  <div class="section-title">Keterangan</div>
  <div class="bom-card">
    <textarea class="form-control" id="inputKeterangan" rows="2" placeholder="Catatan tambahan (opsional)" style="font-size:13px;border:1px solid var(--border);border-radius:3px;font-family:var(--sans);width:100%;"></textarea>
  </div>
</div>

<div class="loading-state" id="loadingBom" style="display:none">
  <span class="spinner"></span> Memuat BOM...
</div>

<!-- SAVE BAR -->
<div class="save-bar" id="saveBar" style="display:none">
  <button class="btn-simpan" id="btnSimpan" onclick="simpanBom()">Simpan BOM</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
  let dataItem = [];
  let dataBahan = [];
  const FINISHING_DEFAULT = ['POTONG','LAMINASI DOFF','LAMINASI GLOSSY','PON','FOIL','LEM','NOMERATOR','PERFORASI ATAS','PERFORASI SAMPING','BLOK LEM','PACKING'];

  window.onload = function() {
    Promise.all([apiGet('getItem'), apiGet('getBahan')]).then(([ri, rb]) => {
      dataItem = Array.isArray(ri) ? ri.filter(i => i.status === 'AKTIF') : [];
      dataBahan = Array.isArray(rb) ? rb.filter(b => b.status === 'AKTIF') : [];
      isiDropdownItem();
    }).catch(() => {
      document.getElementById('alertBar').innerHTML =
        '<div class="alert alert-danger py-2" style="font-size:12px">Gagal memuat data. Refresh halaman.</div>';
    });
  };

  function isiDropdownItem() {
    const sel = document.getElementById('selItem');
    dataItem.forEach(i => {
      const opt = document.createElement('option');
      opt.value = i.id_item;
      opt.textContent = i.id_item + ' — ' + i.nama_item;
      sel.appendChild(opt);
    });
  }

  function infoItem() {
    const id = document.getElementById('selItem').value;
    const item = dataItem.find(i => i.id_item === id);
    if (item) {
      document.getElementById('itemInfo').textContent =
        'Kategori: ' + item.kategori + ' | Satuan: ' + item.satuan + ' | PPS: ' + item.pps;
    } else {
      document.getElementById('itemInfo').textContent = '';
    }
    document.getElementById('bomWrap').style.display = 'none';
    document.getElementById('saveBar').style.display = 'none';
  }

  function muatBom() {
    const id = document.getElementById('selItem').value;
    if (!id) { tampilAlert('Pilih item dulu.', 'warning'); return; }
    document.getElementById('loadingBom').style.display = 'block';
    document.getElementById('bomWrap').style.display = 'none';
    document.getElementById('alertBar').innerHTML = '';

    apiGet('getBom', { id_item: id }).then(res => {
      document.getElementById('loadingBom').style.display = 'none';
      document.getElementById('bomWrap').style.display = 'block';
      document.getElementById('saveBar').style.display = 'flex';
      renderBom(res);
    }).catch(() => {
      document.getElementById('loadingBom').style.display = 'none';
      tampilAlert('Gagal memuat BOM.', 'danger');
    });
  }

  function renderBom(res) {
    // tinta
    const bom = res.bom && res.bom.length > 0 ? res.bom[0] : null;
    const tinta = bom ? bom.tinta : '';
    const keterangan = bom ? bom.keterangan : '';
    // cek apakah tinta ada di opsi
    const selTinta = document.getElementById('selTinta');
    const opsiTinta = ['HITAM','CMYK','SPOT COLOR','UV'];
    if (opsiTinta.includes(tinta)) {
      selTinta.value = tinta;
      document.getElementById('inputTinta').value = '';
    } else {
      selTinta.value = '';
      document.getElementById('inputTinta').value = tinta;
    }
    document.getElementById('inputKeterangan').value = keterangan;

    // bahan
    document.getElementById('listBahan').innerHTML = '';
    const bahan = res.bahan || [];
    if (bahan.length > 0) {
      bahan.forEach(b => tambahRowBahan(b.id_bahan, b.keterangan));
    } else {
      tambahRowBahan();
    }

    // finishing
    document.getElementById('listFinishing').innerHTML = '';
    const fin = res.finishing || [];
    if (fin.length > 0) {
      fin.forEach(f => tambahRowFinishing(f.jenis_finishing));
    } else {
      tambahRowFinishing();
      tambahRowFinishing('PACKING');
    }
  }

  function tambahRowBahan(idBahan, ket) {
    const div = document.createElement('div');
    div.className = 'bahan-row';
    const opsiStr = dataBahan.map(b =>
      `<option value="${b.id_bahan}" ${b.id_bahan === idBahan ? 'selected' : ''}>${b.id_bahan} — ${escHtml(b.nama_bahan)}</option>`
    ).join('');
    div.innerHTML = `
      <select><option value="">-- Pilih bahan --</option>${opsiStr}</select>
      <input type="text" placeholder="Keterangan bahan..." value="${escHtml(ket||'')}">
      <button class="btn-del" onclick="this.parentElement.remove()">Hapus</button>
    `;
    document.getElementById('listBahan').appendChild(div);
  }

  function tambahRowFinishing(val) {
    const div = document.createElement('div');
    div.className = 'fin-row';
    const opsiStr = FINISHING_DEFAULT.map(f =>
      `<option value="${f}" ${f === val ? 'selected' : ''}>${f}</option>`
    ).join('');
    div.innerHTML = `
      <select><option value="">-- Pilih finishing --</option>${opsiStr}</select>
      <input type="text" placeholder="Atau ketik finishing lain..." value="${(!FINISHING_DEFAULT.includes(val) && val) ? escHtml(val) : ''}">
      <button class="btn-del" onclick="this.parentElement.remove()">Hapus</button>
    `;
    document.getElementById('listFinishing').appendChild(div);
  }

  function simpanBom() {
    const idItem = document.getElementById('selItem').value;
    if (!idItem) return tampilAlert('Pilih item dulu.', 'warning');

    // tinta
    const selTintaVal = document.getElementById('selTinta').value;
    const inputTintaVal = document.getElementById('inputTinta').value.trim();
    const tinta = inputTintaVal || selTintaVal;
    if (!tinta) return tampilAlert('Tinta wajib diisi.', 'danger');

    // bahan
    const bahanRows = document.getElementById('listBahan').querySelectorAll('.bahan-row');
    const bahan = [];
    let bahanOk = true;
    bahanRows.forEach(row => {
      const idBahan = row.querySelector('select').value;
      const ket     = row.querySelector('input').value.trim();
      if (!idBahan) { bahanOk = false; return; }
      bahan.push({ id_bahan: idBahan, keterangan: ket });
    });
    if (!bahanOk || bahan.length === 0) return tampilAlert('Semua baris bahan harus dipilih, atau hapus baris kosong.', 'danger');

    // finishing
    const finRows = document.getElementById('listFinishing').querySelectorAll('.fin-row');
    const finishing = [];
    let finOk = true;
    finRows.forEach(row => {
      const selVal   = row.querySelector('select').value;
      const inputVal = row.querySelector('input').value.trim();
      const jenis    = inputVal || selVal;
      if (!jenis) { finOk = false; return; }
      finishing.push({ jenis_finishing: jenis });
    });
    if (!finOk || finishing.length === 0) return tampilAlert('Semua baris finishing harus diisi, atau hapus baris kosong.', 'danger');

    const keterangan = document.getElementById('inputKeterangan').value.trim();
    const payload = { id_item: idItem, tinta, keterangan, bahan, finishing };

    const btn = document.getElementById('btnSimpan');
    btn.textContent = 'Menyimpan...'; btn.disabled = true;

    apiPost('simpanBom', payload).then(res => {
      if (res.error) tampilAlert(res.error, 'danger');
      else tampilAlert('BOM berhasil disimpan.', 'success');
    }).catch(() => tampilAlert('Gagal menyimpan. Coba lagi.', 'danger'))
    .finally(() => { btn.textContent = 'Simpan BOM'; btn.disabled = false; });
  }

  function tampilAlert(msg, tipe) {
    document.getElementById('alertBar').innerHTML =
      `<div class="alert alert-${tipe} py-2" style="font-size:12px">${msg}</div>`;
  }

  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // apiGet dengan params tambahan
  const _apiGetOri = apiGet;
  function apiGet(action, params) {
    let url = GAS_URL + '?action=' + action;
    if (params) Object.keys(params).forEach(k => url += '&' + k + '=' + encodeURIComponent(params[k]));
    return fetch(url).then(r => r.json());
  }
</script>
</body>
</html>
