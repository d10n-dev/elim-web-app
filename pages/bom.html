<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIEO — BOM Item</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/sieo.css" rel="stylesheet">
  <style>
    .panel{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;}
    .panel label{font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:6px;}
    .item-select-wrap{display:flex;gap:8px;align-items:center;}
    .item-select-wrap .ac-wrap{flex:1;}
    .btn-load{background:var(--navy);color:#fff;border:none;border-radius:6px;padding:7px 16px;font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
    .btn-load:hover{background:#142d4a;}
    .item-info{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;}

    .bom-wrap{padding:12px 16px 100px;}
    .section-title{font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;}
    .warna-count{font-family:var(--mono);font-size:11px;color:var(--navy);margin-left:6px;font-weight:400;text-transform:none;letter-spacing:0;}
    .bom-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;}

    .row-item{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;}
    .row-item .ac-wrap{flex:1;}
    .ket-input{font-size:12px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--bg);width:140px;font-family:var(--sans);}
    .ket-input:focus{border-color:var(--navy);outline:none;}
    .btn-del{background:none;border:1px solid #fca5a5;color:#dc2626;border-radius:4px;padding:5px 8px;font-size:11px;font-family:var(--mono);cursor:pointer;white-space:nowrap;flex-shrink:0;}
    .btn-del:hover{background:#fee2e2;}
    .btn-add-row{background:none;border:1px dashed var(--border);color:var(--muted);border-radius:6px;padding:5px 12px;font-size:12px;font-family:var(--mono);cursor:pointer;width:100%;margin-top:4px;}
    .btn-add-row:hover{border-color:var(--navy);color:var(--navy);}

    .ac-input{width:100%;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:6px 10px;background:var(--bg);font-family:var(--sans);color:var(--text);}
    .ac-input:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 2px rgba(26,39,68,.12);}
    .ac-input.selected{border-color:#15803d;background:#f0fdf4;}

    .fin-row{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;}
    .fin-row .ac-wrap{flex:1;}

    .save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:2px solid var(--border);padding:10px 16px;display:flex;gap:8px;justify-content:flex-end;z-index:250;}
    .loading-state{text-align:center;padding:40px;font-family:var(--mono);font-size:12px;color:var(--muted);}
    .spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .alert-bar{padding:8px 16px;font-family:var(--mono);font-size:12px;}
    .bb-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;}
    .bb-row:last-child{border-bottom:none;}
    .bb-nama{font-weight:600;}
    .bb-meta{color:var(--muted);font-size:11px;font-family:var(--mono);}
    .btn-lengkapi{background:none;border:1px solid var(--navy);color:var(--navy);border-radius:6px;padding:4px 10px;font-size:11px;font-family:var(--mono);cursor:pointer;white-space:nowrap;}
    .btn-lengkapi:hover{background:var(--navy);color:#fff;}

    .komp-row{border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:6px;background:var(--bg);}
    .komp-row.nonaktif{opacity:.5;}
    .komp-row-grid{display:grid;grid-template-columns:1fr 110px;gap:6px;margin-bottom:6px;}
    .komp-row-grid2{display:grid;grid-template-columns:1fr 1fr 70px;gap:6px;margin-bottom:6px;}
    .komp-input,.komp-select{font-size:12px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:#fff;font-family:var(--sans);width:100%;}
    .komp-actions{display:flex;gap:6px;justify-content:flex-end;}
    .btn-komp-simpan{background:var(--navy);color:#fff;border:none;border-radius:5px;padding:5px 12px;font-size:11px;font-family:var(--mono);cursor:pointer;}
    .btn-komp-nonaktif{background:none;border:1px solid #fca5a5;color:#dc2626;border-radius:5px;padding:5px 10px;font-size:11px;font-family:var(--mono);cursor:pointer;}
    .komp-badge{display:inline-block;font-size:10px;font-family:var(--mono);font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px;}
    .komp-badge.final{background:#dcfce7;color:#166534;}
    .komp-badge.proses{background:#dbeafe;color:#1e40af;}
    .komponen-select{font-size:11px;border:1px solid var(--border);border-radius:6px;padding:6px 6px;background:#fff;font-family:var(--mono);width:118px;flex-shrink:0;}
  </style>
</head>
<body>
<div id="navRoot"></div>

<div class="panel">
  <label>Pilih Item</label>
  <div class="item-select-wrap">
    <div class="ac-wrap" id="acWrapItem">
      <input type="text" class="ac-input" id="inputItem" placeholder="Ketik ID atau nama item..." autocomplete="off">
      <div class="ac-dropdown" id="acDropItem"></div>
    </div>
    <button class="btn-load" onclick="muatBom()">Muat BOM</button>
  </div>
  <div class="item-info" id="itemInfo"></div>
</div>

<div class="panel" id="panelBelumBom" style="border-top:none">
  <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer" onclick="toggleBelumBom()">
    <span>⚠️ Item Belum Ada BOM <span id="belumBomCount" style="font-weight:400"></span></span>
    <span id="belumBomToggleIcon">▾</span>
  </label>
  <div id="belumBomWrap" style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;margin-top:4px">
    <div class="loading-state" style="padding:16px"><span class="spinner"></span> Memuat…</div>
  </div>
</div>

<div id="alertBar" class="alert-bar"></div>
<div class="loading-state" id="loadingBom" style="display:none"><span class="spinner"></span> Memuat BOM...</div>

<div class="bom-wrap" id="bomWrap" style="display:none">

  <div class="section-title">Komponen Item <span style="font-size:10px;font-weight:400;text-transform:none;letter-spacing:0">(kosongkan kalau item tidak butuh pemecahan cover/isi/dst)</span></div>
  <div class="bom-card" id="cardKomponen">
    <div id="listKomponen"></div>
    <button class="btn-add-row" onclick="tambahRowKomponenBaru()">+ Tambah Komponen</button>
  </div>

  <div class="section-title">
    Tinta <span class="warna-count" id="warnaCount"></span>
    <label style="float:right;text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;color:var(--text);cursor:pointer;">
      <input type="checkbox" id="chkTanpaCetak" onchange="toggleTanpaCetak()" style="margin-right:5px;vertical-align:middle;">Tidak dicetak (tanpa tinta)
    </label>
  </div>
  <div class="bom-card" id="cardTinta">
    <div id="listTinta"></div>
    <button class="btn-add-row" id="btnAddTinta" onclick="tambahRowTinta()">+ Tambah Tinta</button>
  </div>

  <div class="section-title">Bahan Baku</div>
  <div class="bom-card">
    <div id="listBahan"></div>
    <button class="btn-add-row" onclick="tambahRowBahan()">+ Tambah Bahan</button>
  </div>

  <div class="section-title">Finishing <span style="font-size:10px;font-weight:400;text-transform:none;letter-spacing:0">(PACKING selalu di akhir)</span></div>
  <div class="bom-card">
    <div id="listFinishing"></div>
    <button class="btn-add-row" onclick="tambahRowFinishing()">+ Tambah Finishing</button>
  </div>

  <div class="section-title">Keterangan</div>
  <div class="bom-card">
    <textarea id="inputKeterangan" rows="2" placeholder="Catatan tambahan (opsional)"
      style="width:100%;font-size:13px;border:1px solid var(--border);border-radius:3px;padding:8px;font-family:var(--sans);background:var(--bg);"></textarea>
  </div>
</div>

<div class="save-bar" id="saveBar" style="display:none">
  <button class="btn-simpan" id="btnSimpan" onclick="simpanBom()">Simpan BOM</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  let dataItem = [], dataTinta = [], dataBahan = [];
  let idItemAktif = null; // id_item dari BOM yang sedang diedit
  let dataKomponen = []; // komponen AKTIF milik item yg sedang dibuka (utk dropdown di baris BOM)
  const FINISHING_LIST = ['POTONG','LAMINASI DOFF','LAMINASI GLOSSY','PON','FOIL','LEM','NOMERATOR','PERFORASI ATAS','PERFORASI SAMPING','BLOK LEM','SPIRAL','JILID','PACKING'];

  function cekErrorSupabase(res) {
    if (res && (res.code || res.status === 'error')) return res.message || res.code || 'Error tidak diketahui.';
    return null;
  }

  // ===================== KOMPONEN ITEM =====================
  let komponenRowCounter = 0;

  async function muatKomponen(idItem) {
    const res = await dbRpc('get_komponen_item', { p_id_item: idItem });
    const err = cekErrorSupabase(res);
    const semua = (!err && Array.isArray(res)) ? res : [];
    dataKomponen = semua.filter(k => k.status === 'AKTIF');
    renderKomponenList(semua);
    if (err) tampilAlert('Gagal memuat komponen: ' + err, 'danger');
  }

  function renderKomponenList(semuaKomponen) {
    const wrap = document.getElementById('listKomponen');
    wrap.innerHTML = '';
    semuaKomponen.sort((a, b) => (a.urut || 0) - (b.urut || 0));
    semuaKomponen.forEach(k => wrap.appendChild(buatElKomponenRow(k)));
  }

  function buatElKomponenRow(k) {
    // k = null -> baris baru kosong; k = object -> baris existing (editable)
    const id = 'komprow' + (++komponenRowCounter);
    const div = document.createElement('div');
    div.className = 'komp-row' + (k && k.status === 'NONAKTIF' ? ' nonaktif' : '');
    div.id = id;
    const idKomponen = k ? k.id_komponen : null;
    const isFinal = k ? k.tipe === 'FINAL' : false;
    div.innerHTML = `
      <div class="komp-row-grid">
        <input type="text" class="komp-input" placeholder="Kode komponen (mis. COVER, ISI, JILID)" value="${escHtml(k ? k.kode_komponen : '')}" ${k && k.status === 'NONAKTIF' ? 'disabled' : ''}>
        <select class="komp-select" data-role="tipe" ${k && k.status === 'NONAKTIF' ? 'disabled' : ''}>
          <option value="PROSES" ${!isFinal ? 'selected' : ''}>PROSES</option>
          <option value="FINAL" ${isFinal ? 'selected' : ''}>FINAL</option>
        </select>
      </div>
      <div class="komp-row-grid2" data-role="oplahFields" style="${isFinal ? 'display:none' : ''}">
        <input type="number" step="0.01" class="komp-input" data-role="lembarPerPcs" placeholder="Lembar per pcs" value="${k && k.lembar_per_pcs != null ? k.lembar_per_pcs : ''}" ${k && k.status === 'NONAKTIF' ? 'disabled' : ''}>
        <input type="number" step="0.01" class="komp-input" data-role="mataPerLembar" placeholder="Mata per lembar" value="${k && k.mata_per_lembar != null ? k.mata_per_lembar : ''}" ${k && k.status === 'NONAKTIF' ? 'disabled' : ''}>
        <input type="number" class="komp-input" data-role="urut" placeholder="Urut" value="${k ? (k.urut || 1) : ''}" ${k && k.status === 'NONAKTIF' ? 'disabled' : ''}>
      </div>
      <div class="komp-actions">
        ${k && k.status === 'NONAKTIF'
          ? '<span style="font-size:11px;font-family:var(--mono);color:var(--muted)">nonaktif</span>'
          : `<button class="btn-komp-nonaktif" onclick="nonaktifkanKomponenRow('${id}', ${idKomponen})">${k ? 'Nonaktifkan' : 'Batal'}</button>
             <button class="btn-komp-simpan" onclick="simpanKomponenRow('${id}', ${idKomponen})">Simpan</button>`}
      </div>
    `;
    const selTipe = div.querySelector('[data-role="tipe"]');
    const oplahFields = div.querySelector('[data-role="oplahFields"]');
    if (selTipe) selTipe.addEventListener('change', () => {
      oplahFields.style.display = selTipe.value === 'FINAL' ? 'none' : 'grid';
    });
    return div;
  }

  function tambahRowKomponenBaru() {
    document.getElementById('listKomponen').appendChild(buatElKomponenRow(null));
  }

  async function simpanKomponenRow(rowId, idKomponenExisting) {
    const idItem = idItemAktif || (document.getElementById('inputItem')._getSelectedId ? document.getElementById('inputItem')._getSelectedId() : null);
    if (!idItem) return tampilAlert('Pilih & muat item terlebih dahulu.', 'warning');
    const row = document.getElementById(rowId);
    const kode = row.querySelector('.komp-input').value.trim().toUpperCase();
    const tipe = row.querySelector('[data-role="tipe"]').value;
    const lembarStr = row.querySelector('[data-role="lembarPerPcs"]').value;
    const mataStr = row.querySelector('[data-role="mataPerLembar"]').value;
    const urutStr = row.querySelector('[data-role="urut"]').value;
    if (!kode) return tampilAlert('Kode komponen wajib diisi.', 'danger');
    const lembar = lembarStr ? parseFloat(lembarStr) : null;
    const mata = mataStr ? parseFloat(mataStr) : null;
    const urut = urutStr ? parseInt(urutStr, 10) : 1;

    const btn = row.querySelector('.btn-komp-simpan');
    btn.disabled = true; btn.textContent = 'Menyimpan…';
    try {
      let res;
      if (idKomponenExisting) {
        res = await dbRpc('edit_komponen_item', {
          p_id_komponen: idKomponenExisting, p_kode: kode, p_tipe: tipe,
          p_lembar_per_pcs: lembar, p_mata_per_lembar: mata, p_urut: urut
        });
      } else {
        res = await dbRpc('tambah_komponen_item', {
          p_id_item: idItem, p_kode: kode, p_tipe: tipe,
          p_lembar_per_pcs: lembar, p_mata_per_lembar: mata, p_urut: urut, p_user: getNamaUser()
        });
      }
      if (res && res.status === 'error') throw new Error(res.message);
      const err = cekErrorSupabase(res);
      if (err) throw new Error(err);
      await muatKomponen(idItem);
      refreshKomponenSelects();
      tampilAlert('Komponen tersimpan.', 'success');
    } catch (e) {
      tampilAlert('Gagal simpan komponen: ' + (e.message || 'Error tidak diketahui.'), 'danger');
    } finally {
      btn.disabled = false; btn.textContent = 'Simpan';
    }
  }

  async function nonaktifkanKomponenRow(rowId, idKomponenExisting) {
    if (!idKomponenExisting) { document.getElementById(rowId).remove(); return; }
    if (!confirm('Nonaktifkan komponen ini? Baris BOM/SPK yang sudah memakainya tetap aman (histori).')) return;
    try {
      const res = await dbRpc('hapus_komponen_item', { p_id_komponen: idKomponenExisting });
      if (res && res.status === 'error') throw new Error(res.message);
      const idItem = idItemAktif || document.getElementById('inputItem')._getSelectedId();
      await muatKomponen(idItem);
      refreshKomponenSelects();
      tampilAlert('Komponen dinonaktifkan.', 'success');
    } catch (e) {
      tampilAlert('Gagal nonaktifkan: ' + (e.message || 'Error tidak diketahui.'), 'danger');
    }
  }

  function buildKomponenSelectHtml(selectedId) {
    if (!dataKomponen.length) return '';
    let opts = '<option value="">— (umum) —</option>';
    dataKomponen.forEach(k => {
      const sel = (selectedId != null && String(selectedId) === String(k.id_komponen)) ? 'selected' : '';
      opts += `<option value="${k.id_komponen}" ${sel}>${escHtml(k.kode_komponen)} (${k.tipe})</option>`;
    });
    return `<select class="komponen-select">${opts}</select>`;
  }

  // Refresh opsi dropdown komponen di semua baris Tinta/Bahan/Finishing yang sudah ada,
  // sambil pertahankan pilihan yang masih valid.
  function refreshKomponenSelects() {
    document.querySelectorAll('.tinta-row, .bahan-row, .fin-row').forEach(row => {
      const oldSel = row.querySelector('.komponen-select');
      const oldVal = oldSel ? oldSel.value : '';
      const wrapKomp = row.querySelector('.komponen-select-wrap');
      if (!wrapKomp) return;
      wrapKomp.innerHTML = buildKomponenSelectHtml(oldVal || null);
    });
  }

  // ===================== AUTOCOMPLETE ENGINE (fixed position, Android safe) =====================
  function buatAC(inputEl, dropEl, dataArr, idKey, namaKey, onSelect) {
    let selectedId = null;

    function positionDrop() {
      const r = inputEl.getBoundingClientRect();
      dropEl.style.top   = r.bottom + 'px';
      dropEl.style.left  = r.left + 'px';
      dropEl.style.width = r.width + 'px';
    }

    function filter(q) {
      q = q.toLowerCase();
      return dataArr.filter(d =>
        (d[idKey]   || '').toLowerCase().includes(q) ||
        (d[namaKey] || '').toLowerCase().includes(q)
      ).slice(0, 30);
    }

    function render(items) {
      dropEl.innerHTML = '';
      if (items.length === 0) {
        dropEl.innerHTML = '<div class="ac-empty">Tidak ditemukan</div>';
      } else {
        items.forEach(d => {
          const div = document.createElement('div');
          div.className = 'ac-item';
          div.innerHTML = d[idKey] === d[namaKey]
            ? `<span class="ac-item-nama">${escHtml(d[namaKey])}</span>`
            : `<span class="ac-item-id">${escHtml(d[idKey])}</span><span class="ac-item-nama">${escHtml(d[namaKey])}</span>`;
          div.addEventListener('mousedown', e => { e.preventDefault(); pilih(d); });
          div.addEventListener('touchstart', function(e){ this._ty = e.touches[0].clientY; this._moved = false; dropEl._touching = true; }, {passive:true});
          div.addEventListener('touchmove', function(e){ if (Math.abs(e.touches[0].clientY - this._ty) > 10) this._moved = true; }, {passive:true});
          div.addEventListener('touchend', function(e){ e.preventDefault(); dropEl._touching = false; if (this._moved) return; pilih(d); });
          dropEl.appendChild(div);
        });
      }
      positionDrop();
      dropEl.classList.add('open');
    }

    function pilih(d) {
      selectedId = d[idKey];
      inputEl.value = d[idKey] === d[namaKey] ? d[namaKey] : (d[idKey] + ' | ' + d[namaKey]);
      inputEl.classList.add('selected');
      dropEl.classList.remove('open');
      if (onSelect) onSelect(d);
    }

    function tutup() { dropEl.classList.remove('open'); }

    inputEl.addEventListener('input', () => {
      selectedId = null;
      inputEl.classList.remove('selected');
      const q = inputEl.value.trim();
      if (q.length === 0) { tutup(); return; }
      render(filter(q));
    });

    inputEl.addEventListener('focus', () => {
      const q = inputEl.value.trim();
      if (q.length > 0 && !selectedId) render(filter(q));
    });

    inputEl.addEventListener('blur', () => { setTimeout(() => { if (!dropEl._touching) tutup(); }, 250); });

    inputEl._getSelectedId = () => selectedId;
    inputEl._setItem = (d) => { if (d) pilih(d); };
    inputEl._clear = () => {
      selectedId = null;
      inputEl.value = '';
      inputEl.classList.remove('selected');
      tutup();
    };
  }

  // ===================== INIT =====================
  window.addEventListener('load', function() {
    if (!guardHalaman()) return;
    initNav('bom');

    Promise.all([
      dbGet('m_item',  { status: 'eq.AKTIF', order: 'nama_item.asc' }),
      dbGet('m_tinta', { status: 'eq.AKTIF', order: 'nama_tinta.asc' }),
      dbGet('m_bahan', { status: 'eq.AKTIF', order: 'nama_bahan.asc' })
    ]).then(([ri, rt, rb]) => {
      dataItem  = Array.isArray(ri) ? ri : [];
      dataTinta = Array.isArray(rt) ? rt : [];
      dataBahan = Array.isArray(rb) ? rb : [];

      buatAC(
        document.getElementById('inputItem'),
        document.getElementById('acDropItem'),
        dataItem, 'id_item', 'nama_item',
        function(d) {
          document.getElementById('itemInfo').textContent =
            'Kategori: ' + d.kategori + ' | Satuan: ' + d.satuan + ' | PPS: ' + d.pps;
          document.getElementById('bomWrap').style.display = 'none';
          document.getElementById('saveBar').style.display = 'none';
          document.getElementById('alertBar').innerHTML = '';
          idBomAktif = null;
        }
      );

      muatItemBelumBom();
    }).catch(() => {
      tampilAlert('Gagal memuat data master. Refresh halaman.', 'danger');
    });
  });

  // ===================== ITEM BELUM ADA BOM =====================
  function muatItemBelumBom() {
    const wrap = document.getElementById('belumBomWrap');
    dbRpc('get_item_belum_bom', { p_bulan: 12 }).then(res => {
      const rows = Array.isArray(res) ? res : [];
      document.getElementById('belumBomCount').textContent = '(' + rows.length + ')';
      if (!rows.length) {
        wrap.innerHTML = '<div style="padding:16px;text-align:center;color:var(--muted);font-size:12px">Semua item yang dipesan 12 bulan terakhir sudah ada BOM-nya ✓</div>';
        return;
      }
      wrap.innerHTML = rows.map(r => `
        <div class="bb-row">
          <div>
            <div class="bb-nama">${escHtml(r.nama_item)}</div>
            <div class="bb-meta">${escHtml(r.id_item)} · ${escHtml(r.kategori || '-')} · dipesan ${r.jumlah_order_pakai}x · terakhir ${formatTanggal(r.terakhir_dipesan)}</div>
          </div>
          <button class="btn-lengkapi" onclick="lengkapiBom('${r.id_item}')">Lengkapi BOM</button>
        </div>
      `).join('');
    }).catch(() => {
      wrap.innerHTML = '<div style="padding:16px;text-align:center;color:var(--danger,#dc2626);font-size:12px">Gagal memuat daftar.</div>';
    });
  }

  function toggleBelumBom() {
    const wrap = document.getElementById('belumBomWrap');
    const icon = document.getElementById('belumBomToggleIcon');
    const hidden = wrap.style.display === 'none';
    wrap.style.display = hidden ? 'block' : 'none';
    icon.textContent = hidden ? '▾' : '▸';
  }

  function lengkapiBom(idItem) {
    const d = dataItem.find(x => x.id_item === idItem);
    if (!d) { tampilAlert('Item tidak ditemukan di master, refresh halaman.', 'warning'); return; }
    const inputItem = document.getElementById('inputItem');
    inputItem._setItem(d);
    document.getElementById('itemInfo').textContent =
      'Kategori: ' + d.kategori + ' | Satuan: ' + d.satuan + ' | PPS: ' + d.pps;
    muatBom();
    inputItem.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ===================== MUAT BOM =====================
  async function muatBom() {
    const inputItem = document.getElementById('inputItem');
    const idItem = inputItem._getSelectedId ? inputItem._getSelectedId() : null;
    if (!idItem) { tampilAlert('Pilih item dari daftar terlebih dahulu.', 'warning'); return; }

    document.getElementById('loadingBom').style.display = 'block';
    document.getElementById('bomWrap').style.display = 'none';
    document.getElementById('alertBar').innerHTML = '';
    idItemAktif = null;

    try {
      // Muat komponen dulu, supaya dropdown komponen di baris BOM sudah siap
      await muatKomponen(idItem);

      const resBom = await dbGet('m_bom', { id_item: 'eq.' + idItem });
      const bom = Array.isArray(resBom) && resBom.length > 0 ? resBom[0] : null;
      idItemAktif = bom ? idItem : null;
      document.getElementById('inputKeterangan').value = bom ? (bom.keterangan || '') : '';

      if (!bom) {
        // BOM baru — kosong
        document.getElementById('chkTanpaCetak').checked = false;
        document.getElementById('cardTinta').style.display = 'block';
        document.getElementById('listTinta').innerHTML = '';
        document.getElementById('listBahan').innerHTML = '';
        document.getElementById('listFinishing').innerHTML = '';
        tambahRowTinta();
        tambahRowBahan();
        tambahRowFinishing();
        tambahRowFinishing('PACKING');
        updateWarnaCount();
      } else {
        const [tinta, bahan, finishing] = await Promise.all([
          dbGet('m_bom_tinta',     { id_item: 'eq.' + idItem, order: 'urut.asc' }),
          dbGet('m_bom_bahan',     { id_item: 'eq.' + idItem, order: 'urut.asc' }),
          dbGet('m_bom_finishing', { id_item: 'eq.' + idItem, order: 'urut.asc' })
        ]);
        const chkTC = document.getElementById('chkTanpaCetak');
        chkTC.checked = !!bom.tanpa_cetak;
        document.getElementById('cardTinta').style.display = bom.tanpa_cetak ? 'none' : 'block';

        document.getElementById('listTinta').innerHTML = '';
        const tArr = Array.isArray(tinta) ? tinta : [];
        if (tArr.length > 0) {
          tArr.forEach(t => {
            const obj = dataTinta.find(x => x.id_tinta === t.id_tinta);
            tambahRowTinta(obj || null, t.id_komponen);
          });
        } else if (!bom.tanpa_cetak) { tambahRowTinta(); }

        document.getElementById('listBahan').innerHTML = '';
        const bArr = Array.isArray(bahan) ? bahan : [];
        if (bArr.length > 0) {
          bArr.forEach(b => {
            const obj = dataBahan.find(x => x.id_bahan === b.id_bahan);
            tambahRowBahan(obj || null, b.keterangan, b.id_komponen);
          });
        } else { tambahRowBahan(); }

        document.getElementById('listFinishing').innerHTML = '';
        const fArr = Array.isArray(finishing) ? finishing : [];
        if (fArr.length > 0) {
          fArr.forEach(f => tambahRowFinishing(f.jenis_finishing, f.id_komponen));
        } else {
          tambahRowFinishing();
          tambahRowFinishing('PACKING');
        }
        updateWarnaCount();
      }

      document.getElementById('loadingBom').style.display = 'none';
      document.getElementById('bomWrap').style.display = 'block';
      document.getElementById('saveBar').style.display = 'flex';
    } catch (e) {
      document.getElementById('loadingBom').style.display = 'none';
      tampilAlert('Gagal memuat BOM.', 'danger');
    }
  }

  // ===================== ROW BUILDERS =====================
  let rowCounter = 0;

  function tambahRowTinta(tintaObj, idKomponenSel) {
    const id = 'trow' + (++rowCounter);
    const div = document.createElement('div');
    div.className = 'row-item tinta-row';
    div.id = id;
    div.innerHTML = `
      <div class="ac-wrap">
        <input type="text" class="ac-input" placeholder="Ketik nama tinta..." autocomplete="off">
        <div class="ac-dropdown"></div>
      </div>
      <span class="komponen-select-wrap">${buildKomponenSelectHtml(idKomponenSel)}</span>
      <button class="btn-del" onclick="document.getElementById('${id}').remove();updateWarnaCount()">Hapus</button>
    `;
    document.getElementById('listTinta').appendChild(div);
    const inp  = div.querySelector('.ac-input');
    const drop = div.querySelector('.ac-dropdown');
    document.body.appendChild(drop); // append to body agar tidak terpotong modal
    buatAC(inp, drop, dataTinta, 'id_tinta', 'nama_tinta', updateWarnaCount);
    if (tintaObj) inp._setItem(tintaObj);
    updateWarnaCount();
  }

  function tambahRowBahan(bahanObj, ket, idKomponenSel) {
    const id = 'brow' + (++rowCounter);
    const div = document.createElement('div');
    div.className = 'row-item bahan-row';
    div.id = id;
    div.innerHTML = `
      <div class="ac-wrap">
        <input type="text" class="ac-input" placeholder="Ketik nama bahan..." autocomplete="off">
        <div class="ac-dropdown"></div>
      </div>
      <span class="komponen-select-wrap">${buildKomponenSelectHtml(idKomponenSel)}</span>
      <input type="text" class="ket-input" placeholder="Keterangan..." value="${escHtml(ket||'')}">
      <button class="btn-del" onclick="document.getElementById('${id}').remove()">Hapus</button>
    `;
    document.getElementById('listBahan').appendChild(div);
    const inp  = div.querySelector('.ac-input');
    const drop = div.querySelector('.ac-dropdown');
    document.body.appendChild(drop);
    buatAC(inp, drop, dataBahan, 'id_bahan', 'nama_bahan', null);
    if (bahanObj) inp._setItem(bahanObj);
  }

  function tambahRowFinishing(val, idKomponenSel) {
    const id = 'frow' + (++rowCounter);
    const div = document.createElement('div');
    div.className = 'fin-row';
    div.id = id;
    div.innerHTML = `
      <div class="ac-wrap">
        <input type="text" class="ac-input" placeholder="Ketik atau pilih finishing..." autocomplete="off" value="${escHtml(val||'')}">
        <div class="ac-dropdown"></div>
      </div>
      <span class="komponen-select-wrap">${buildKomponenSelectHtml(idKomponenSel)}</span>
      <button class="btn-del" onclick="document.getElementById('${id}').remove()">Hapus</button>
    `;
    document.getElementById('listFinishing').appendChild(div);
    const inp  = div.querySelector('.ac-input');
    const drop = div.querySelector('.ac-dropdown');
    document.body.appendChild(drop);
    const finData = FINISHING_LIST.map(f => ({ id: f, nama: f }));
    buatAC(inp, drop, finData, 'id', 'nama', d => { inp.value = d.id; inp.classList.add('selected'); });
    if (val) {
      inp.classList.add('selected');
      inp._getSelectedId = () => val;
    }
    inp._getFinVal = () => inp.value.trim().toUpperCase();
  }

  function toggleTanpaCetak() {
    const chk = document.getElementById('chkTanpaCetak').checked;
    document.getElementById('cardTinta').style.display = chk ? 'none' : 'block';
    if (chk) {
      document.getElementById('listTinta').innerHTML = '';
      updateWarnaCount();
    } else if (document.querySelectorAll('#listTinta .tinta-row').length === 0) {
      tambahRowTinta();
    }
  }

  function updateWarnaCount() {
    const rows = document.querySelectorAll('#listTinta .tinta-row .ac-input');
    const isi = Array.from(rows).filter(r => r._getSelectedId && r._getSelectedId()).length;
    document.getElementById('warnaCount').textContent = isi > 0 ? isi + ' warna' : '';
  }

  // ===================== SIMPAN BOM =====================
  async function simpanBom() {
    const inputItem = document.getElementById('inputItem');
    const idItem = inputItem._getSelectedId ? inputItem._getSelectedId() : null;
    if (!idItem) return tampilAlert('Pilih item dari daftar terlebih dahulu.', 'warning');

    // Kumpulkan tinta
    const tanpaCetak = document.getElementById('chkTanpaCetak').checked;
    const tinta = [];
    let tintaError = false;
    if (!tanpaCetak) {
      document.querySelectorAll('#listTinta .tinta-row').forEach(row => {
        const inp = row.querySelector('.ac-input');
        if (!inp.value.trim()) return;
        const id = inp._getSelectedId ? inp._getSelectedId() : null;
        if (!id) { tintaError = true; return; }
        const selKomp = row.querySelector('.komponen-select');
        tinta.push({ id_tinta: id, id_komponen: selKomp && selKomp.value ? parseInt(selKomp.value, 10) : null });
      });
      if (tintaError)  return tampilAlert('Ada tinta yang tidak dikenali. Pilih dari daftar.', 'danger');
      if (!tinta.length) return tampilAlert('Minimal 1 tinta wajib diisi.', 'danger');
    }

    // Kumpulkan bahan
    const bahan = [];
    let bahanError = false;
    document.querySelectorAll('#listBahan .bahan-row').forEach(row => {
      const inp = row.querySelector('.ac-input');
      const ket = row.querySelector('.ket-input');
      if (!inp.value.trim()) return;
      const id = inp._getSelectedId ? inp._getSelectedId() : null;
      if (!id) { bahanError = true; return; }
      const selKomp = row.querySelector('.komponen-select');
      bahan.push({ id_bahan: id, keterangan: ket ? ket.value.trim() : '', id_komponen: selKomp && selKomp.value ? parseInt(selKomp.value, 10) : null });
    });
    if (bahanError)  return tampilAlert('Ada bahan yang tidak dikenali. Pilih dari daftar.', 'danger');
    if (!bahan.length) return tampilAlert('Minimal 1 bahan wajib diisi.', 'danger');

    // Kumpulkan finishing
    const finishing = [];
    document.querySelectorAll('#listFinishing .fin-row').forEach(row => {
      const inp = row.querySelector('.ac-input');
      const val = inp._getFinVal ? inp._getFinVal() : inp.value.trim().toUpperCase();
      if (!val) return;
      const selKomp = row.querySelector('.komponen-select');
      finishing.push({ jenis_finishing: val, id_komponen: selKomp && selKomp.value ? parseInt(selKomp.value, 10) : null });
    });
    if (!finishing.length) return tampilAlert('Minimal 1 finishing wajib diisi.', 'danger');

    const keterangan = document.getElementById('inputKeterangan').value.trim();
    const btn = document.getElementById('btnSimpan');
    btn.textContent = 'Menyimpan...'; btn.disabled = true;

    try {
      let idItem = inputItem._getSelectedId();

      if (idItemAktif) {
        // Update header
        const resUpd = await dbUpdate('m_bom', { id_item: 'eq.' + idItem }, { keterangan, tanpa_cetak: tanpaCetak });
        if (resUpd && resUpd.code) throw new Error('Update header: ' + resUpd.message);
        // Hapus semua detail lama
        await Promise.allSettled([
          dbDelete('m_bom_tinta',     { id_item: 'eq.' + idItem }),
          dbDelete('m_bom_bahan',     { id_item: 'eq.' + idItem }),
          dbDelete('m_bom_finishing', { id_item: 'eq.' + idItem })
        ]);
      } else {
        // Insert header baru
        const resIns = await dbInsert('m_bom', { id_item: idItem, keterangan, tanpa_cetak: tanpaCetak });
        if (resIns && resIns.code) throw new Error('Insert header: ' + resIns.message);
        idItemAktif = idItem;
      }

      // Bulk insert detail dengan urut (tinta di-skip kalau tanpa_cetak)
      if (tinta.length > 0) {
        const resTinta = await dbInsert('m_bom_tinta',
          tinta.map((t, i) => ({ id_item: idItem, urut: i + 1, id_tinta: t.id_tinta, id_komponen: t.id_komponen }))
        );
        if (resTinta && resTinta.code) throw new Error('Insert tinta: ' + resTinta.message);
      }

      const resBahan = await dbInsert('m_bom_bahan',
        bahan.map((b, i) => ({ id_item: idItem, urut: i + 1, id_bahan: b.id_bahan, keterangan: b.keterangan, id_komponen: b.id_komponen }))
      );
      if (resBahan && resBahan.code) throw new Error('Insert bahan: ' + resBahan.message);

      const resFin = await dbInsert('m_bom_finishing',
        finishing.map((f, i) => ({ id_item: idItem, urut: i + 1, jenis_finishing: f.jenis_finishing, id_komponen: f.id_komponen }))
      );
      if (resFin && resFin.code) throw new Error('Insert finishing: ' + resFin.message);

      tampilAlert('BOM berhasil disimpan.', 'success');
    } catch (e) {
      tampilAlert('Gagal menyimpan: ' + (e.message || 'Coba lagi.'), 'danger');
    } finally {
      btn.textContent = 'Simpan BOM'; btn.disabled = false;
    }
  }

  function tampilAlert(msg, tipe) {
    document.getElementById('alertBar').innerHTML =
      `<div class="alert alert-${tipe} py-2" style="font-size:12px">${msg}</div>`;
    window.scrollTo(0, 0);
  }
</script>
</body>
</html>
