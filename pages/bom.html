<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIEO — BOM Item</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="../css/sieo.css" rel="stylesheet">
  <style>
    .panel{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;}
    .panel label{font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:6px;}
    .item-select-wrap{display:flex;gap:8px;align-items:center;}
    .item-select-wrap .ac-wrap{flex:1;}
    .btn-load{background:var(--navy);color:#fff;border:none;border-radius:6px;padding:7px 16px;font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
    .btn-load:hover{background:#142d4a;}
    .item-info{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;}

    .bom-wrap{padding:12px 16px 100px;}
    .section-title{font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;}
    .warna-count{font-family:var(--mono);font-size:11px;color:var(--navy);margin-left:6px;font-weight:400;text-transform:none;letter-spacing:0;}
    .bom-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;}

    .row-item{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;}
    .row-item .ac-wrap{flex:1;}
    .ket-input{font-size:12px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--bg);width:140px;font-family:var(--sans);}
    .ket-input:focus{border-color:var(--navy);outline:none;}
    .btn-del{background:none;border:1px solid #fca5a5;color:#dc2626;border-radius:4px;padding:5px 8px;font-size:11px;font-family:var(--mono);cursor:pointer;white-space:nowrap;flex-shrink:0;}
    .btn-del:hover{background:#fee2e2;}
    .btn-add-row{background:none;border:1px dashed var(--border);color:var(--muted);border-radius:6px;padding:5px 12px;font-size:12px;font-family:var(--mono);cursor:pointer;width:100%;margin-top:4px;}
    .btn-add-row:hover{border-color:var(--navy);color:var(--navy);}

    .ac-input{width:100%;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:6px 10px;background:var(--bg);font-family:var(--sans);color:var(--text);}
    .ac-input:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 2px rgba(26,39,68,.12);}
    .ac-input.selected{border-color:#15803d;background:#f0fdf4;}

    .fin-row{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px;}
    .fin-row .ac-wrap{flex:1;}

    .save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:2px solid var(--border);padding:10px 16px;display:flex;gap:8px;justify-content:flex-end;z-index:250;}
    .loading-state{text-align:center;padding:40px;font-family:var(--mono);font-size:12px;color:var(--muted);}
    .spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .alert-bar{padding:8px 16px;font-family:var(--mono);font-size:12px;}
  </style>
</head>
<body>
<div id="navRoot"></div>

<div class="panel">
  <label>Pilih Item</label>
  <div class="item-select-wrap">
    <div class="ac-wrap" id="acWrapItem">
      <input type="text" class="ac-input" id="inputItem" placeholder="Ketik ID atau nama item..." autocomplete="off">
      <div class="ac-dropdown" id="acDropItem"></div>
    </div>
    <button class="btn-load" onclick="muatBom()">Muat BOM</button>
  </div>
  <div class="item-info" id="itemInfo"></div>
</div>

<div id="alertBar" class="alert-bar"></div>
<div class="loading-state" id="loadingBom" style="display:none"><span class="spinner"></span> Memuat BOM...</div>

<div class="bom-wrap" id="bomWrap" style="display:none">

  <div class="section-title">Tinta <span class="warna-count" id="warnaCount"></span></div>
  <div class="bom-card">
    <div id="listTinta"></div>
    <button class="btn-add-row" onclick="tambahRowTinta()">+ Tambah Tinta</button>
  </div>

  <div class="section-title">Bahan Baku</div>
  <div class="bom-card">
    <div id="listBahan"></div>
    <button class="btn-add-row" onclick="tambahRowBahan()">+ Tambah Bahan</button>
  </div>

  <div class="section-title">Finishing <span style="font-size:10px;font-weight:400;text-transform:none;letter-spacing:0">(PACKING selalu di akhir)</span></div>
  <div class="bom-card">
    <div id="listFinishing"></div>
    <button class="btn-add-row" onclick="tambahRowFinishing()">+ Tambah Finishing</button>
  </div>

  <div class="section-title">Keterangan</div>
  <div class="bom-card">
    <textarea id="inputKeterangan" rows="2" placeholder="Catatan tambahan (opsional)"
      style="width:100%;font-size:13px;border:1px solid var(--border);border-radius:3px;padding:8px;font-family:var(--sans);background:var(--bg);"></textarea>
  </div>
</div>

<div class="save-bar" id="saveBar" style="display:none">
  <button class="btn-simpan" id="btnSimpan" onclick="simpanBom()">Simpan BOM</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
  let dataItem = [], dataTinta = [], dataBahan = [];
  let idItemAktif = null; // id_item dari BOM yang sedang diedit
  const FINISHING_LIST = ['POTONG','LAMINASI DOFF','LAMINASI GLOSSY','PON','FOIL','LEM','NOMERATOR','PERFORASI ATAS','PERFORASI SAMPING','BLOK LEM','SPIRAL','JILID','PACKING'];

  // ===================== AUTOCOMPLETE ENGINE (fixed position, Android safe) =====================
  function buatAC(inputEl, dropEl, dataArr, idKey, namaKey, onSelect) {
    let selectedId = null;

    function positionDrop() {
      const r = inputEl.getBoundingClientRect();
      dropEl.style.top   = r.bottom + 'px';
      dropEl.style.left  = r.left + 'px';
      dropEl.style.width = r.width + 'px';
    }

    function filter(q) {
      q = q.toLowerCase();
      return dataArr.filter(d =>
        (d[idKey]   || '').toLowerCase().includes(q) ||
        (d[namaKey] || '').toLowerCase().includes(q)
      ).slice(0, 30);
    }

    function render(items) {
      dropEl.innerHTML = '';
      if (items.length === 0) {
        dropEl.innerHTML = '<div class="ac-empty">Tidak ditemukan</div>';
      } else {
        items.forEach(d => {
          const div = document.createElement('div');
          div.className = 'ac-item';
          div.innerHTML = d[idKey] === d[namaKey]
            ? `<span class="ac-item-nama">${escHtml(d[namaKey])}</span>`
            : `<span class="ac-item-id">${escHtml(d[idKey])}</span><span class="ac-item-nama">${escHtml(d[namaKey])}</span>`;
          div.addEventListener('mousedown', e => { e.preventDefault(); pilih(d); });
          div.addEventListener('touchend',  e => { e.preventDefault(); pilih(d); });
          dropEl.appendChild(div);
        });
      }
      positionDrop();
      dropEl.classList.add('open');
    }

    function pilih(d) {
      selectedId = d[idKey];
      inputEl.value = d[idKey] === d[namaKey] ? d[namaKey] : (d[idKey] + ' | ' + d[namaKey]);
      inputEl.classList.add('selected');
      dropEl.classList.remove('open');
      if (onSelect) onSelect(d);
    }

    function tutup() { dropEl.classList.remove('open'); }

    inputEl.addEventListener('input', () => {
      selectedId = null;
      inputEl.classList.remove('selected');
      const q = inputEl.value.trim();
      if (q.length === 0) { tutup(); return; }
      render(filter(q));
    });

    inputEl.addEventListener('focus', () => {
      const q = inputEl.value.trim();
      if (q.length > 0 && !selectedId) render(filter(q));
    });

    inputEl.addEventListener('blur', () => { setTimeout(tutup, 200); });

    inputEl._getSelectedId = () => selectedId;
    inputEl._setItem = (d) => { if (d) pilih(d); };
    inputEl._clear = () => {
      selectedId = null;
      inputEl.value = '';
      inputEl.classList.remove('selected');
      tutup();
    };
  }

  // ===================== INIT =====================
  window.addEventListener('load', function() {
    if (!guardHalaman()) return;
    initNav('bom');

    Promise.all([
      dbGet('m_item',  { status: 'eq.AKTIF', order: 'nama_item.asc' }),
      dbGet('m_tinta', { status: 'eq.AKTIF', order: 'nama_tinta.asc' }),
      dbGet('m_bahan', { status: 'eq.AKTIF', order: 'nama_bahan.asc' })
    ]).then(([ri, rt, rb]) => {
      dataItem  = Array.isArray(ri) ? ri : [];
      dataTinta = Array.isArray(rt) ? rt : [];
      dataBahan = Array.isArray(rb) ? rb : [];

      buatAC(
        document.getElementById('inputItem'),
        document.getElementById('acDropItem'),
        dataItem, 'id_item', 'nama_item',
        function(d) {
          document.getElementById('itemInfo').textContent =
            'Kategori: ' + d.kategori + ' | Satuan: ' + d.satuan + ' | PPS: ' + d.pps;
          document.getElementById('bomWrap').style.display = 'none';
          document.getElementById('saveBar').style.display = 'none';
          document.getElementById('alertBar').innerHTML = '';
          idBomAktif = null;
        }
      );
    }).catch(() => {
      tampilAlert('Gagal memuat data master. Refresh halaman.', 'danger');
    });
  });

  // ===================== MUAT BOM =====================
  function muatBom() {
    const inputItem = document.getElementById('inputItem');
    const idItem = inputItem._getSelectedId ? inputItem._getSelectedId() : null;
    if (!idItem) { tampilAlert('Pilih item dari daftar terlebih dahulu.', 'warning'); return; }

    document.getElementById('loadingBom').style.display = 'block';
    document.getElementById('bomWrap').style.display = 'none';
    document.getElementById('alertBar').innerHTML = '';
    idItemAktif = null;

    // Ambil header BOM
    dbGet('m_bom', { id_item: 'eq.' + idItem }).then(resBom => {
      const bom = Array.isArray(resBom) && resBom.length > 0 ? resBom[0] : null;
      idItemAktif = bom ? idItem : null;

      document.getElementById('inputKeterangan').value = bom ? (bom.keterangan || '') : '';

      if (!bom) {
        // BOM baru — kosong
        document.getElementById('listTinta').innerHTML = '';
        document.getElementById('listBahan').innerHTML = '';
        document.getElementById('listFinishing').innerHTML = '';
        tambahRowTinta();
        tambahRowBahan();
        tambahRowFinishing();
        tambahRowFinishing('PACKING');
        updateWarnaCount();
        document.getElementById('loadingBom').style.display = 'none';
        document.getElementById('bomWrap').style.display = 'block';
        document.getElementById('saveBar').style.display = 'flex';
        return;
      }

      // Ambil semua detail BOM sekaligus
      return Promise.all([
        dbGet('m_bom_tinta',     { id_item: 'eq.' + idItem, order: 'urut.asc' }),
        dbGet('m_bom_bahan',     { id_item: 'eq.' + idItem, order: 'urut.asc' }),
        dbGet('m_bom_finishing', { id_item: 'eq.' + idItem, order: 'urut.asc' })
      ]).then(([tinta, bahan, finishing]) => {
        document.getElementById('listTinta').innerHTML = '';
        const tArr = Array.isArray(tinta) ? tinta : [];
        if (tArr.length > 0) {
          tArr.forEach(t => {
            const obj = dataTinta.find(x => x.id_tinta === t.id_tinta);
            tambahRowTinta(obj || null);
          });
        } else { tambahRowTinta(); }

        document.getElementById('listBahan').innerHTML = '';
        const bArr = Array.isArray(bahan) ? bahan : [];
        if (bArr.length > 0) {
          bArr.forEach(b => {
            const obj = dataBahan.find(x => x.id_bahan === b.id_bahan);
            tambahRowBahan(obj || null, b.keterangan);
          });
        } else { tambahRowBahan(); }

        document.getElementById('listFinishing').innerHTML = '';
        const fArr = Array.isArray(finishing) ? finishing : [];
        if (fArr.length > 0) {
          fArr.forEach(f => tambahRowFinishing(f.jenis_finishing));
        } else {
          tambahRowFinishing();
          tambahRowFinishing('PACKING');
        }

        updateWarnaCount();
        document.getElementById('loadingBom').style.display = 'none';
        document.getElementById('bomWrap').style.display = 'block';
        document.getElementById('saveBar').style.display = 'flex';
      });
    }).catch(() => {
      document.getElementById('loadingBom').style.display = 'none';
      tampilAlert('Gagal memuat BOM.', 'danger');
    });
  }

  // ===================== ROW BUILDERS =====================
  let rowCounter = 0;

  function tambahRowTinta(tintaObj) {
    const id = 'trow' + (++rowCounter);
    const div = document.createElement('div');
    div.className = 'row-item tinta-row';
    div.id = id;
    div.innerHTML = `
      <div class="ac-wrap">
        <input type="text" class="ac-input" placeholder="Ketik nama tinta..." autocomplete="off">
        <div class="ac-dropdown"></div>
      </div>
      <button class="btn-del" onclick="document.getElementById('${id}').remove();updateWarnaCount()">Hapus</button>
    `;
    document.getElementById('listTinta').appendChild(div);
    const inp  = div.querySelector('.ac-input');
    const drop = div.querySelector('.ac-dropdown');
    document.body.appendChild(drop); // append to body agar tidak terpotong modal
    buatAC(inp, drop, dataTinta, 'id_tinta', 'nama_tinta', updateWarnaCount);
    if (tintaObj) inp._setItem(tintaObj);
    updateWarnaCount();
  }

  function tambahRowBahan(bahanObj, ket) {
    const id = 'brow' + (++rowCounter);
    const div = document.createElement('div');
    div.className = 'row-item bahan-row';
    div.id = id;
    div.innerHTML = `
      <div class="ac-wrap">
        <input type="text" class="ac-input" placeholder="Ketik nama bahan..." autocomplete="off">
        <div class="ac-dropdown"></div>
      </div>
      <input type="text" class="ket-input" placeholder="Keterangan..." value="${escHtml(ket||'')}">
      <button class="btn-del" onclick="document.getElementById('${id}').remove()">Hapus</button>
    `;
    document.getElementById('listBahan').appendChild(div);
    const inp  = div.querySelector('.ac-input');
    const drop = div.querySelector('.ac-dropdown');
    document.body.appendChild(drop);
    buatAC(inp, drop, dataBahan, 'id_bahan', 'nama_bahan', null);
    if (bahanObj) inp._setItem(bahanObj);
  }

  function tambahRowFinishing(val) {
    const id = 'frow' + (++rowCounter);
    const div = document.createElement('div');
    div.className = 'fin-row';
    div.id = id;
    div.innerHTML = `
      <div class="ac-wrap">
        <input type="text" class="ac-input" placeholder="Ketik atau pilih finishing..." autocomplete="off" value="${escHtml(val||'')}">
        <div class="ac-dropdown"></div>
      </div>
      <button class="btn-del" onclick="document.getElementById('${id}').remove()">Hapus</button>
    `;
    document.getElementById('listFinishing').appendChild(div);
    const inp  = div.querySelector('.ac-input');
    const drop = div.querySelector('.ac-dropdown');
    document.body.appendChild(drop);
    const finData = FINISHING_LIST.map(f => ({ id: f, nama: f }));
    buatAC(inp, drop, finData, 'id', 'nama', d => { inp.value = d.id; inp.classList.add('selected'); });
    if (val) {
      inp.classList.add('selected');
      inp._getSelectedId = () => val;
    }
    inp._getFinVal = () => inp.value.trim().toUpperCase();
  }

  function updateWarnaCount() {
    const rows = document.querySelectorAll('#listTinta .tinta-row .ac-input');
    const isi = Array.from(rows).filter(r => r._getSelectedId && r._getSelectedId()).length;
    document.getElementById('warnaCount').textContent = isi > 0 ? isi + ' warna' : '';
  }

  // ===================== SIMPAN BOM =====================
  async function simpanBom() {
    const inputItem = document.getElementById('inputItem');
    const idItem = inputItem._getSelectedId ? inputItem._getSelectedId() : null;
    if (!idItem) return tampilAlert('Pilih item dari daftar terlebih dahulu.', 'warning');

    // Kumpulkan tinta
    const tinta = [];
    let tintaError = false;
    document.querySelectorAll('#listTinta .tinta-row .ac-input').forEach(inp => {
      if (!inp.value.trim()) return;
      const id = inp._getSelectedId ? inp._getSelectedId() : null;
      if (!id) { tintaError = true; return; }
      tinta.push(id);
    });
    if (tintaError)  return tampilAlert('Ada tinta yang tidak dikenali. Pilih dari daftar.', 'danger');
    if (!tinta.length) return tampilAlert('Minimal 1 tinta wajib diisi.', 'danger');

    // Kumpulkan bahan
    const bahan = [];
    let bahanError = false;
    document.querySelectorAll('#listBahan .bahan-row').forEach(row => {
      const inp = row.querySelector('.ac-input');
      const ket = row.querySelector('.ket-input');
      if (!inp.value.trim()) return;
      const id = inp._getSelectedId ? inp._getSelectedId() : null;
      if (!id) { bahanError = true; return; }
      bahan.push({ id_bahan: id, keterangan: ket ? ket.value.trim() : '' });
    });
    if (bahanError)  return tampilAlert('Ada bahan yang tidak dikenali. Pilih dari daftar.', 'danger');
    if (!bahan.length) return tampilAlert('Minimal 1 bahan wajib diisi.', 'danger');

    // Kumpulkan finishing
    const finishing = [];
    document.querySelectorAll('#listFinishing .fin-row').forEach(row => {
      const inp = row.querySelector('.ac-input');
      const val = inp._getFinVal ? inp._getFinVal() : inp.value.trim().toUpperCase();
      if (val) finishing.push(val);
    });
    if (!finishing.length) return tampilAlert('Minimal 1 finishing wajib diisi.', 'danger');

    const keterangan = document.getElementById('inputKeterangan').value.trim();
    const btn = document.getElementById('btnSimpan');
    btn.textContent = 'Menyimpan...'; btn.disabled = true;

    try {
      let idItem = inputItem._getSelectedId();

      if (idItemAktif) {
        // Update header
        const resUpd = await dbUpdate('m_bom', { id_item: 'eq.' + idItem }, { keterangan });
        if (resUpd && resUpd.code) throw new Error('Update header: ' + resUpd.message);
        // Hapus semua detail lama
        await Promise.allSettled([
          dbDelete('m_bom_tinta',     { id_item: 'eq.' + idItem }),
          dbDelete('m_bom_bahan',     { id_item: 'eq.' + idItem }),
          dbDelete('m_bom_finishing', { id_item: 'eq.' + idItem })
        ]);
      } else {
        // Insert header baru
        const resIns = await dbInsert('m_bom', { id_item: idItem, keterangan });
        if (resIns && resIns.code) throw new Error('Insert header: ' + resIns.message);
        idItemAktif = idItem;
      }

      // Bulk insert detail dengan urut
      const resTinta = await dbInsert('m_bom_tinta',
        tinta.map((id_tinta, i) => ({ id_item: idItem, urut: i + 1, id_tinta }))
      );
      if (resTinta && resTinta.code) throw new Error('Insert tinta: ' + resTinta.message);

      const resBahan = await dbInsert('m_bom_bahan',
        bahan.map((b, i) => ({ id_item: idItem, urut: i + 1, id_bahan: b.id_bahan, keterangan: b.keterangan }))
      );
      if (resBahan && resBahan.code) throw new Error('Insert bahan: ' + resBahan.message);

      const resFin = await dbInsert('m_bom_finishing',
        finishing.map((jenis_finishing, i) => ({ id_item: idItem, urut: i + 1, jenis_finishing }))
      );
      if (resFin && resFin.code) throw new Error('Insert finishing: ' + resFin.message);

      tampilAlert('BOM berhasil disimpan.', 'success');
    } catch (e) {
      tampilAlert('Gagal menyimpan: ' + (e.message || 'Coba lagi.'), 'danger');
    } finally {
      btn.textContent = 'Simpan BOM'; btn.disabled = false;
    }
  }

  function tampilAlert(msg, tipe) {
    document.getElementById('alertBar').innerHTML =
      `<div class="alert alert-${tipe} py-2" style="font-size:12px">${msg}</div>`;
    window.scrollTo(0, 0);
  }
</script>
</body>
</html>
