<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Master Operator — SIEO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--navy:#1a2744;--navy-dk:#131e36;--orange:#e8521a;--bg:#eef1f7;--surface:#fff;--border:#d0d8e8;--text:#1a2744;--muted:#6b7a99;--green:#1a9e5c;--green-bg:#e6f7ef;--red:#dc3545;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding-bottom:2rem;}
    .topbar{background:var(--navy);border-bottom:3px solid var(--orange);padding:.7rem 1.1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
    .topbar-left{display:flex;align-items:center;gap:.75rem;}
    .topbar-back{color:rgba(255,255,255,.7);font-size:.75rem;font-family:var(--mono);text-decoration:none;}
    .topbar-back:hover{color:#fff;}
    .topbar-divider{color:rgba(255,255,255,.2);}
    .topbar-title{font-family:var(--mono);font-weight:600;font-size:.88rem;letter-spacing:.05em;color:#fff;text-transform:uppercase;}
    #userPill{font-family:var(--mono);font-size:.7rem;color:rgba(255,255,255,.6);}
    .main{padding:1.1rem;}
    .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:.5rem;flex-wrap:wrap;}
    .toolbar-left{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
    .toolbar-left input,.toolbar-left select{font-family:var(--mono);font-size:.75rem;border:1px solid var(--border);border-radius:6px;padding:.45rem .65rem;background:var(--surface);color:var(--text);}
    .toolbar-left input{min-width:160px;}
    .btn-buat{background:var(--orange);color:#fff;border:none;font-family:var(--mono);font-size:.75rem;font-weight:600;padding:.5rem .9rem;border-radius:6px;cursor:pointer;white-space:nowrap;}
    .btn-buat:hover{background:#d04515;}
    .counter-bar{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-bottom:.6rem;}
    .tbl-wrap{background:var(--surface);border-radius:10px;border:1px solid var(--border);overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:.8rem;}
    thead th{background:var(--navy);color:#fff;font-family:var(--mono);font-size:.68rem;font-weight:600;letter-spacing:.05em;padding:.6rem .75rem;text-align:left;white-space:nowrap;}
    tbody tr{border-bottom:1px solid var(--border);}
    tbody tr:last-child{border-bottom:none;}
    tbody tr:hover{background:#f5f7fb;}
    tbody td{padding:.55rem .75rem;vertical-align:middle;}
    .td-mono{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap;}
    .td-nama{font-weight:500;}
    .badge-status{font-family:var(--mono);font-size:.63rem;font-weight:600;padding:.2rem .5rem;border-radius:4px;letter-spacing:.04em;white-space:nowrap;}
    .bd-internal{background:#e8f0fe;color:#1a56b0;}
    .bd-vendor{background:#fff3e0;color:#c45a00;}
    .bd-aktif{background:var(--green-bg);color:var(--green);}
    .bd-nonaktif{background:#fff0f0;color:var(--red);}
    .btn-edit{background:#fff;color:var(--navy);border:1px solid var(--border);font-family:var(--mono);font-size:.7rem;padding:.3rem .65rem;border-radius:5px;cursor:pointer;}
    .btn-edit:hover{background:var(--bg);}
    .loading{text-align:center;padding:2rem;font-family:var(--mono);font-size:.8rem;color:var(--muted);}
    .modal-content{border-radius:12px;border:1px solid var(--border);}
    .modal-header{background:var(--navy);color:#fff;border-radius:12px 12px 0 0;padding:.8rem 1.1rem;border-bottom:none;}
    .modal-title{font-family:var(--mono);font-size:.85rem;font-weight:600;letter-spacing:.04em;}
    .modal-header .btn-close{filter:invert(1);opacity:.7;}
    .modal-body{padding:1.1rem;}
    .form-label{font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:.3rem;display:block;}
    .form-control,.form-select{font-family:var(--mono);font-size:.8rem;border:1px solid var(--border);border-radius:6px;padding:.5rem .7rem;width:100%;color:var(--text);background:var(--surface);}
    .form-control:focus,.form-select:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 2px rgba(26,39,68,.1);}
    .mb-3{margin-bottom:.85rem;}
    .btn-simpan{background:var(--navy);color:#fff;border:none;font-family:var(--mono);font-size:.75rem;font-weight:600;padding:.55rem 1.1rem;border-radius:6px;cursor:pointer;}
    .btn-simpan:hover{background:var(--navy-dk);}
    .btn-simpan:disabled{opacity:.5;cursor:not-allowed;}
    .btn-batal{background:transparent;color:var(--muted);border:1px solid var(--border);font-family:var(--mono);font-size:.75rem;padding:.55rem 1rem;border-radius:6px;cursor:pointer;}
    .alert-box{font-family:var(--mono);font-size:.75rem;padding:.5rem .75rem;border-radius:6px;margin-bottom:.6rem;}
    .alert-err{background:#fff0f0;color:var(--red);border:1px solid #ffc9c9;}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="../index.html" class="topbar-back">&#8592; Menu</a>
    <span class="topbar-divider">|</span>
    <span class="topbar-title">Master Operator</span>
  </div>
  <div style="display:flex;align-items:center;gap:1rem">
    <span id="userPill"></span>
    <button class="btn-buat" id="btnTambah" onclick="bukaModalTambah()" style="display:none">+ Tambah</button>
  </div>
</div>

<div class="main">
  <div class="toolbar">
    <div class="toolbar-left">
      <input type="text" id="searchNama" placeholder="Cari nama operator..." oninput="renderTabel()"/>
      <select id="filterTipe" onchange="renderTabel()">
        <option value="">Semua Tipe</option>
        <option value="INTERNAL">Internal</option>
        <option value="VENDOR">Vendor</option>
      </select>
      <select id="filterStatus" onchange="renderTabel()">
        <option value="">Semua Status</option>
        <option value="AKTIF">Aktif</option>
        <option value="NONAKTIF">Nonaktif</option>
      </select>
    </div>
  </div>

  <div class="counter-bar" id="counterBar">Memuat data…</div>

  <div class="tbl-wrap">
    <table>
      <thead><tr><th>ID</th><th>Nama Operator</th><th>Tipe</th><th>Status</th><th></th></tr></thead>
      <tbody id="tbody"><tr><td colspan="5" class="loading">Memuat data…</td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="modalOperator" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modalJudul">Tambah Operator</span>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="alertForm"></div>
        <input type="hidden" id="fId"/>
        <div class="mb-3">
          <label class="form-label">Nama Operator *</label>
          <input type="text" class="form-control" id="fNama" placeholder="cth: WARDI"/>
        </div>
        <div class="mb-3">
          <label class="form-label">Tipe</label>
          <select class="form-select" id="fTipe">
            <option value="INTERNAL">Internal</option>
            <option value="VENDOR">Vendor</option>
          </select>
        </div>
        <div class="mb-3" id="statusGroup" style="display:none">
          <label class="form-label">Status</label>
          <select class="form-select" id="fStatus">
            <option value="AKTIF">Aktif</option>
            <option value="NONAKTIF">Nonaktif</option>
          </select>
        </div>
        <div class="d-flex gap-2 justify-content-end mt-3">
          <button class="btn-batal" data-bs-dismiss="modal">Batal</button>
          <button class="btn-simpan" id="btnSimpan" onclick="simpanOperator()">Simpan</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
'use strict';
var semuaOperator = [];
var modalInst;
var bisaKelola = false;

document.addEventListener('DOMContentLoaded', function() {
  guardHalaman();
  modalInst  = new bootstrap.Modal(document.getElementById('modalOperator'));
  bisaKelola = ['MANAGER','DIREKTUR'].indexOf(getRoleUser()) >= 0;
  if (bisaKelola) document.getElementById('btnTambah').style.display = '';
  muatData();
});

function muatData() {
  dbGet('m_operator', { order: 'id_operator.asc' }).then(function(res) {
    semuaOperator = Array.isArray(res) ? res : [];
    renderTabel();
  }).catch(function() {
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="5" class="loading" style="color:var(--red)">Gagal memuat data.</td></tr>';
    document.getElementById('counterBar').textContent = 'Gagal memuat data.';
  });
}

function renderTabel() {
  var cari   = document.getElementById('searchNama').value.toLowerCase().trim();
  var tipe   = document.getElementById('filterTipe').value;
  var status = document.getElementById('filterStatus').value;

  var data = semuaOperator.filter(function(o) {
    return (!cari   || (o.nama_operator||'').toLowerCase().indexOf(cari) >= 0) &&
           (!tipe   || o.tipe   === tipe) &&
           (!status || o.status === status);
  });

  if (!data.length) {
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="5" class="loading">Tidak ada data.</td></tr>';
    document.getElementById('counterBar').textContent = '0 dari ' + semuaOperator.length + ' operator';
    return;
  }

  document.getElementById('tbody').innerHTML = data.map(function(o) {
    var bdTipe = o.tipe === 'VENDOR' ? 'bd-vendor' : 'bd-internal';
    var bdStat = o.status === 'AKTIF' ? 'bd-aktif'  : 'bd-nonaktif';
    return '<tr>' +
      '<td class="td-mono">' + escHtml(o.id_operator) + '</td>' +
      '<td class="td-nama">' + escHtml(o.nama_operator) + '</td>' +
      '<td><span class="badge-status ' + bdTipe + '">' + escHtml(o.tipe) + '</span></td>' +
      '<td><span class="badge-status ' + bdStat + '">' + escHtml(o.status) + '</span></td>' +
      '<td>' + (bisaKelola
        ? '<button class="btn-edit" onclick=\'bukaModalEdit(' + JSON.stringify(o) + ')\'>Edit</button>'
        : '') + '</td>' +
    '</tr>';
  }).join('');
  document.getElementById('counterBar').textContent = data.length + ' dari ' + semuaOperator.length + ' operator';
}

function bukaModalTambah() {
  document.getElementById('modalJudul').textContent = 'Tambah Operator';
  document.getElementById('alertForm').innerHTML = '';
  document.getElementById('fId').value    = '';
  document.getElementById('fNama').value  = '';
  document.getElementById('fTipe').value  = 'INTERNAL';
  document.getElementById('fStatus').value = 'AKTIF';
  document.getElementById('statusGroup').style.display = 'none';
  modalInst.show();
}

function bukaModalEdit(o) {
  document.getElementById('modalJudul').textContent = 'Edit Operator — ' + o.id_operator;
  document.getElementById('alertForm').innerHTML = '';
  document.getElementById('fId').value    = o.id_operator;
  document.getElementById('fNama').value  = o.nama_operator;
  document.getElementById('fTipe').value  = o.tipe   || 'INTERNAL';
  document.getElementById('fStatus').value = o.status || 'AKTIF';
  document.getElementById('statusGroup').style.display = 'block';
  modalInst.show();
}

function simpanOperator() {
  var alertEl = document.getElementById('alertForm');
  alertEl.innerHTML = '';
  var id     = document.getElementById('fId').value;
  var nama   = document.getElementById('fNama').value.trim().toUpperCase();
  var tipe   = document.getElementById('fTipe').value;
  var status = document.getElementById('fStatus').value;

  if (!nama) {
    alertEl.innerHTML = '<div class="alert-box alert-err">Nama Operator wajib diisi.</div>';
    return;
  }

  var btn = document.getElementById('btnSimpan');
  btn.disabled = true; btn.textContent = 'Menyimpan…';

  var payload = { nama_operator: nama, tipe: tipe, status: status };
  var p;
  if (id) {
    p = dbUpdate('m_operator', { id_operator: 'eq.' + id }, payload);
  } else {
    payload.id_operator = generateIdLokal(semuaOperator, 'OPR', 'id_operator', 3);
    p = dbInsert('m_operator', payload);
  }

  p.then(function(res) {
    if (res && res.code) throw new Error(res.message || 'Gagal menyimpan');
    modalInst.hide(); muatData();
  }).catch(function(err) {
    alertEl.innerHTML = '<div class="alert-box alert-err">' + escHtml(err.message||'Gagal menyimpan') + '</div>';
  }).finally(function() {
    btn.disabled = false; btn.textContent = 'Simpan';
  });
}
</script>
</body>
</html>
