<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Laporan Kinerja Operator — SIEO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="../css/sieo.css" rel="stylesheet"/>
  <style>
    .filter-bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end;padding:.85rem 1.1rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .filter-bar .fld label{font-family:var(--mono);font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.2rem;}
    .filter-bar input{font-family:var(--mono);font-size:.78rem;}
    .info-bar{font-family:var(--mono);font-size:.72rem;color:var(--muted);padding:.5rem 1.1rem;}
    .tbl-oplah th, .tbl-oplah td{text-align:right;white-space:nowrap;font-family:var(--mono);font-size:.78rem;}
    .tbl-oplah th:first-child, .tbl-oplah td:first-child{text-align:left;font-family:var(--sans);}
    .tbl-oplah thead th{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface);}
    .row-total{font-weight:600;background:var(--surface);}
    .row-total td{color:var(--navy);}
    .btn-navy{background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:.78rem;font-family:var(--mono);font-weight:600;padding:.4rem .85rem;cursor:pointer;}
    .btn-navy:hover{background:var(--navy-mid);}
  </style>
</head>
<body>
<div id="navRoot"></div>

<div id="kontenLaporan" style="display:none">

  <div class="filter-bar">
    <div class="fld">
      <label>Tanggal Awal</label>
      <input type="date" id="tglAwal" class="form-control form-control-sm">
    </div>
    <div class="fld">
      <label>Tanggal Akhir</label>
      <input type="date" id="tglAkhir" class="form-control form-control-sm">
    </div>
    <div class="fld">
      <button class="btn-navy" onclick="muatLaporan()">Tampilkan</button>
    </div>
  </div>

  <div id="statusBox" class="info-bar">Memuat...</div>

  <div class="table-responsive">
    <table class="table table-bordered tbl-oplah bg-white mb-0">
      <thead>
        <tr>
          <th>Operator</th>
          <th>Cetak</th>
          <th>Potong</th>
          <th>Finishing</th>
          <th>Packing</th>
          <th>Total Oplah</th>
        </tr>
      </thead>
      <tbody id="tabelBody"></tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>

// Default periode gajian: tgl 26 s/d tgl 25 bulan berikutnya.
// Tanggal akhir default = hari ini, biar bisa lihat laporan parsial di tengah periode.
function defaultTglAwal() {
  const now = new Date();
  const tgl = now.getDate();
  const bulan = tgl >= 26 ? now.getMonth() : now.getMonth() - 1;
  return new Date(now.getFullYear(), bulan, 26);
}

function formatDateInput(d) {
  return d.toISOString().slice(0, 10);
}

function formatRibuan(n) {
  return Number(n || 0).toLocaleString('id-ID');
}

async function muatLaporan() {
  const tglAwal = document.getElementById('tglAwal').value;
  const tglAkhir = document.getElementById('tglAkhir').value;
  const statusBox = document.getElementById('statusBox');
  const tabelBody = document.getElementById('tabelBody');

  if (!tglAwal || !tglAkhir) {
    statusBox.textContent = 'Tanggal awal dan akhir wajib diisi.';
    return;
  }

  statusBox.textContent = 'Memuat...';
  tabelBody.innerHTML = '';

  const res = await dbRpc('get_laporan_oplah_operator', {
    p_tgl_awal: tglAwal,
    p_tgl_akhir: tglAkhir
  });

  if (!cekAksesGAS(res)) return;

  if (res && res.message) {
    statusBox.textContent = 'Gagal memuat data: ' + res.message;
    return;
  }

  if (!Array.isArray(res) || res.length === 0) {
    statusBox.textContent = 'Tidak ada data produksi pada rentang tanggal ini.';
    return;
  }

  statusBox.textContent = `Menampilkan ${res.length} operator, periode ${tglAwal} s/d ${tglAkhir}.`;

  let totalCetak = 0, totalPotong = 0, totalFinishing = 0, totalPacking = 0, totalOplah = 0;

  res.forEach(row => {
    totalCetak     += Number(row.cetak || 0);
    totalPotong    += Number(row.potong || 0);
    totalFinishing += Number(row.finishing || 0);
    totalPacking   += Number(row.packing || 0);
    totalOplah     += Number(row.total_oplah || 0);

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escHtml(row.operator)}</td>
      <td>${formatRibuan(row.cetak)}</td>
      <td>${formatRibuan(row.potong)}</td>
      <td>${formatRibuan(row.finishing)}</td>
      <td>${formatRibuan(row.packing)}</td>
      <td>${formatRibuan(row.total_oplah)}</td>
    `;
    tabelBody.appendChild(tr);
  });

  const trTotal = document.createElement('tr');
  trTotal.className = 'row-total';
  trTotal.innerHTML = `
    <td>TOTAL</td>
    <td>${formatRibuan(totalCetak)}</td>
    <td>${formatRibuan(totalPotong)}</td>
    <td>${formatRibuan(totalFinishing)}</td>
    <td>${formatRibuan(totalPacking)}</td>
    <td>${formatRibuan(totalOplah)}</td>
  `;
  tabelBody.appendChild(trTotal);
}

// ── INIT ────────────────────────────────────────────────────
window.addEventListener('load', function() {
  if (!guardHalaman()) return;

  const role = getRoleUser();
  if (role !== 'DIREKTUR' && role !== 'MANAGER') {
    window.location.replace('../index.html');
    return;
  }

  initNav('laporan kinerja');

  document.getElementById('tglAwal').value = formatDateInput(defaultTglAwal());
  document.getElementById('tglAkhir').value = formatDateInput(new Date());

  document.getElementById('kontenLaporan').style.display = '';
  muatLaporan();
});
</script>
</body>
</html>
