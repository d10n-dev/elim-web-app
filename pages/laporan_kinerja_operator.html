<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Laporan Kinerja Operator — SIEO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="../css/sieo.css" rel="stylesheet"/>
  <style>
    .filter-bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end;padding:.85rem 1.1rem;background:var(--surface);border-bottom:1px solid var(--border);}
    .filter-bar .fld label{font-family:var(--mono);font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.2rem;}
    .filter-bar input, .filter-bar select{font-family:var(--mono);font-size:.78rem;}
    .info-bar{font-family:var(--mono);font-size:.72rem;color:var(--muted);padding:.5rem 1.1rem;}
    .tbl-oplah th, .tbl-oplah td{text-align:right;white-space:nowrap;font-family:var(--mono);font-size:.78rem;}
    .tbl-oplah th:first-child, .tbl-oplah td:first-child,
    .tbl-oplah th.txt-left, .tbl-oplah td.txt-left{text-align:left;font-family:var(--sans);white-space:normal;}
    .tbl-oplah thead th{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface);}
    .tbl-oplah tbody tr.row-clickable{cursor:pointer;}
    .tbl-oplah tbody tr.row-clickable:hover{background:#f4f7fc;}
    .row-tgl-header td{background:var(--navy);color:#fff;font-weight:600;font-family:var(--mono);font-size:.72rem;}
    .row-subtotal td{background:#eef1f5;font-weight:600;color:var(--navy);}
    .row-grandtotal td{background:var(--navy);color:#fff;font-weight:700;}
    .btn-navy{background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:.78rem;font-family:var(--mono);font-weight:600;padding:.4rem .85rem;cursor:pointer;}
    .btn-navy:hover{background:var(--navy-mid);}
    .nav-tabs .nav-link{font-family:var(--mono);font-size:.8rem;color:var(--muted);}
    .nav-tabs .nav-link.active{color:var(--navy);font-weight:600;border-bottom-color:var(--orange);}
    .op-link{color:var(--navy);text-decoration:underline;cursor:pointer;font-family:var(--sans);}
    .op-link:hover{color:var(--orange);}
  </style>
</head>
<body>
<div id="navRoot"></div>

<div id="kontenLaporan" style="display:none">

  <div class="filter-bar">
    <div class="fld">
      <label>Tanggal Awal</label>
      <input type="date" id="tglAwal" class="form-control form-control-sm">
    </div>
    <div class="fld">
      <label>Tanggal Akhir</label>
      <input type="date" id="tglAkhir" class="form-control form-control-sm">
    </div>
    <div class="fld">
      <button class="btn-navy" onclick="muatSemua()">Tampilkan</button>
    </div>
  </div>

  <ul class="nav nav-tabs px-3 pt-2" id="tabKinerja">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#paneIndividu" type="button">Cetak &amp; Potong</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#paneTim" type="button">Finishing &amp; Packing (Tim)</button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- ===================== TAB 1: INDIVIDU, GROUPING TANGGAL ===================== -->
    <div class="tab-pane fade show active" id="paneIndividu">
      <div id="statusIndividu" class="info-bar">Memuat...</div>
      <div class="table-responsive">
        <table class="table table-bordered tbl-oplah bg-white mb-0">
          <thead>
            <tr>
              <th class="txt-left">Operator</th>
              <th>Cetak</th>
              <th>Potong</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="tabelIndividu"></tbody>
        </table>
      </div>
      <div class="info-bar">Klik baris operator untuk lihat detail pengerjaan harian (sepanjang periode).</div>
    </div>

    <!-- ===================== TAB 2: TIM, PIVOT PER TANGGAL ===================== -->
    <div class="tab-pane fade" id="paneTim">
      <div id="statusTim" class="info-bar">Memuat...</div>
      <div class="table-responsive">
        <table class="table table-bordered tbl-oplah bg-white mb-0">
          <thead>
            <tr>
              <th class="txt-left">Tanggal</th>
              <th>Oplah Finishing</th>
              <th>Oplah Packing</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="tabelTim"></tbody>
        </table>
      </div>
      <div class="info-bar">Klik baris tanggal untuk lihat siapa saja tim &amp; detail per baris log hari itu.</div>
    </div>

  </div>
</div>

<!-- ===================== MODAL: DETAIL TIM 1 HARI (Finishing + Packing) ===================== -->
<div class="modal fade" id="modalDetailTim" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="modalDetailTimTitle">Detail Tim</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modalDetailTimBody"></div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== MODAL: DETAIL HARIAN OPERATOR ===================== -->
<div class="modal fade" id="modalDetailOperator" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="modalDetailOperatorTitle">Detail Operator</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="modalDetailOperatorBody" class="table-responsive"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>

// Default periode gajian: tgl 26 s/d tgl 25 bulan berikutnya.
function defaultTglAwal() {
  const now = new Date();
  const tgl = now.getDate();
  const bulan = tgl >= 26 ? now.getMonth() : now.getMonth() - 1;
  return new Date(now.getFullYear(), bulan, 26);
}

function formatDateInput(d) {
  return d.toISOString().slice(0, 10);
}

function formatRibuan(n) {
  return Number(n || 0).toLocaleString('id-ID');
}

function getRangeTanggal() {
  return {
    awal: document.getElementById('tglAwal').value,
    akhir: document.getElementById('tglAkhir').value
  };
}

function muatSemua() {
  muatIndividu();
  muatTim();
}

// ============ TAB 1: INDIVIDU, GROUPING TANGGAL ============
async function muatIndividu() {
  const { awal, akhir } = getRangeTanggal();
  const statusBox = document.getElementById('statusIndividu');
  const tabelBody = document.getElementById('tabelIndividu');

  if (!awal || !akhir) { statusBox.textContent = 'Tanggal awal dan akhir wajib diisi.'; return; }

  statusBox.textContent = 'Memuat...';
  tabelBody.innerHTML = '';

  const res = await dbRpc('get_laporan_individu_harian', { p_tgl_awal: awal, p_tgl_akhir: akhir });
  if (!cekAksesGAS(res)) return;

  if (res && res.message) { statusBox.textContent = 'Gagal memuat data: ' + res.message; return; }
  if (!Array.isArray(res) || res.length === 0) { statusBox.textContent = 'Tidak ada data Cetak/Potong pada rentang ini.'; return; }

  statusBox.textContent = `Periode ${awal} s/d ${akhir}.`;

  // Group by tgl (data sudah terurut tgl DESC dari RPC)
  const grup = {};
  const urutanTgl = [];
  res.forEach(r => {
    if (!grup[r.tgl]) { grup[r.tgl] = []; urutanTgl.push(r.tgl); }
    grup[r.tgl].push(r);
  });

  let grandCetak = 0, grandPotong = 0;

  urutanTgl.forEach(tgl => {
    const trHeader = document.createElement('tr');
    trHeader.className = 'row-tgl-header';
    trHeader.innerHTML = `<td colspan="4">${formatTanggal(tgl)}</td>`;
    tabelBody.appendChild(trHeader);

    let subCetak = 0, subPotong = 0;
    grup[tgl].forEach(row => {
      const cetak = Number(row.cetak || 0);
      const potong = Number(row.potong || 0);
      subCetak += cetak;
      subPotong += potong;

      const tr = document.createElement('tr');
      tr.className = 'row-clickable';
      tr.innerHTML = `
        <td class="txt-left">${escHtml(row.operator)}</td>
        <td>${formatRibuan(cetak)}</td>
        <td>${formatRibuan(potong)}</td>
        <td>${formatRibuan(cetak + potong)}</td>
      `;
      tr.addEventListener('click', () => bukaDetailOperator(row.operator));
      tabelBody.appendChild(tr);
    });

    const trSub = document.createElement('tr');
    trSub.className = 'row-subtotal';
    trSub.innerHTML = `
      <td class="txt-left">Subtotal ${formatTanggal(tgl)}</td>
      <td>${formatRibuan(subCetak)}</td>
      <td>${formatRibuan(subPotong)}</td>
      <td>${formatRibuan(subCetak + subPotong)}</td>
    `;
    tabelBody.appendChild(trSub);

    grandCetak += subCetak;
    grandPotong += subPotong;
  });

  const trGrand = document.createElement('tr');
  trGrand.className = 'row-grandtotal';
  trGrand.innerHTML = `
    <td class="txt-left">GRAND TOTAL</td>
    <td>${formatRibuan(grandCetak)}</td>
    <td>${formatRibuan(grandPotong)}</td>
    <td>${formatRibuan(grandCetak + grandPotong)}</td>
  `;
  tabelBody.appendChild(trGrand);
}

// ============ TAB 2: TIM, PIVOT PER TANGGAL ============
async function muatTim() {
  const { awal, akhir } = getRangeTanggal();
  const statusBox = document.getElementById('statusTim');
  const tabelBody = document.getElementById('tabelTim');

  if (!awal || !akhir) { statusBox.textContent = 'Tanggal awal dan akhir wajib diisi.'; return; }

  statusBox.textContent = 'Memuat...';
  tabelBody.innerHTML = '';

  const res = await dbRpc('get_laporan_tim_harian', { p_tgl_awal: awal, p_tgl_akhir: akhir });
  if (!cekAksesGAS(res)) return;

  if (res && res.message) { statusBox.textContent = 'Gagal memuat data: ' + res.message; return; }
  if (!Array.isArray(res) || res.length === 0) { statusBox.textContent = 'Tidak ada data Finishing/Packing pada rentang ini.'; return; }

  statusBox.textContent = `${res.length} hari, periode ${awal} s/d ${akhir}.`;

  let grandFinishing = 0, grandPacking = 0;

  res.forEach(row => {
    const finishing = Number(row.finishing_oplah || 0);
    const packing = Number(row.packing_oplah || 0);
    grandFinishing += finishing;
    grandPacking += packing;

    const tr = document.createElement('tr');
    tr.className = 'row-clickable';
    tr.innerHTML = `
      <td class="txt-left">${formatTanggal(row.tgl)}</td>
      <td>${formatRibuan(Math.round(finishing))}</td>
      <td>${formatRibuan(Math.round(packing))}</td>
      <td>${formatRibuan(Math.round(finishing + packing))}</td>
    `;
    tr.addEventListener('click', () => bukaDetailTim(
      row.tgl,
      finishing > 0, packing > 0,
      row.daftar_operator_finishing, row.daftar_operator_packing
    ));
    tabelBody.appendChild(tr);
  });

  const trGrand = document.createElement('tr');
  trGrand.className = 'row-grandtotal';
  trGrand.innerHTML = `
    <td class="txt-left">GRAND TOTAL</td>
    <td>${formatRibuan(Math.round(grandFinishing))}</td>
    <td>${formatRibuan(Math.round(grandPacking))}</td>
    <td>${formatRibuan(Math.round(grandFinishing + grandPacking))}</td>
  `;
  tabelBody.appendChild(trGrand);
}

// ============ MODAL: DETAIL TIM 1 HARI (Finishing + Packing) ============
async function bukaDetailTim(tanggal, adaFinishing, adaPacking, daftarFinishing, daftarPacking) {
  const titleEl = document.getElementById('modalDetailTimTitle');
  const bodyEl = document.getElementById('modalDetailTimBody');
  titleEl.textContent = `Detail Tim — ${formatTanggal(tanggal)}`;
  bodyEl.innerHTML = '<div class="info-bar">Memuat...</div>';

  const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalDetailTim'));
  modal.show();

  const panggilan = [];
  if (adaFinishing) panggilan.push(dbRpc('get_detail_tim_hari', { p_tanggal: tanggal, p_jenis: 'FINISHING' }));
  else panggilan.push(Promise.resolve([]));
  if (adaPacking) panggilan.push(dbRpc('get_detail_tim_hari', { p_tanggal: tanggal, p_jenis: 'PACKING' }));
  else panggilan.push(Promise.resolve([]));

  const [resFinishing, resPacking] = await Promise.all(panggilan);

  function renderBagian(labelJenis, res, daftarNama) {
    if (!Array.isArray(res) || res.length === 0) return '';

    const namaSet = new Set();
    (daftarNama || '').split(',').forEach(nm => { const n = nm.trim(); if (n) namaSet.add(n); });

    let html = `<h6 class="mt-2 mb-2" style="font-family:var(--mono);font-size:.8rem;color:var(--navy);">${labelJenis}</h6>`;
    html += `
      <table class="table table-sm table-bordered tbl-oplah mb-2">
        <thead><tr><th class="txt-left">Keterangan</th><th class="txt-left">Mesin/Vendor</th><th>Qty Asli</th><th>PPS</th><th>Oplah</th><th class="txt-left">Operator (baris ini)</th></tr></thead>
        <tbody>`;
    res.forEach(r => {
      html += `
        <tr>
          <td class="txt-left">${escHtml(r.keterangan || '-')}</td>
          <td class="txt-left">${escHtml(r.mesin_vendor || '-')}</td>
          <td>${formatRibuan(r.qty_asli)}</td>
          <td>${r.pps}</td>
          <td>${formatRibuan(Math.round(r.oplah))}</td>
          <td class="txt-left">${escHtml(r.operator || '-')}</td>
        </tr>`;
    });
    html += `</tbody></table>`;

    if (namaSet.size > 0) {
      html += `<div class="info-bar" style="padding:0 0 .4rem;">Klik nama untuk riwayat harian operator (semua jenis, sepanjang periode):</div><div class="mb-3">`;
      namaSet.forEach(nm => {
        html += `<span class="op-link me-3" onclick="bukaDetailOperator('${nm.replace(/'/g, "\\'")}')">${escHtml(nm)}</span>`;
      });
      html += `</div>`;
    }
    return html;
  }

  let html = '';
  html += renderBagian('FINISHING', resFinishing, daftarFinishing);
  html += renderBagian('PACKING', resPacking, daftarPacking);

  bodyEl.innerHTML = html || '<div class="info-bar">Tidak ada detail.</div>';
}

// ============ MODAL: DETAIL HARIAN OPERATOR (lintas jenis, sepanjang periode) ============
async function bukaDetailOperator(namaOperator) {
  const { awal, akhir } = getRangeTanggal();
  const titleEl = document.getElementById('modalDetailOperatorTitle');
  const bodyEl = document.getElementById('modalDetailOperatorBody');
  titleEl.textContent = `Detail Harian — ${namaOperator} (${awal} s/d ${akhir})`;
  bodyEl.innerHTML = '<div class="info-bar">Memuat...</div>';

  const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('modalDetailOperator'));
  modal.show();

  const res = await dbRpc('get_detail_harian_operator', {
    p_operator: namaOperator,
    p_tgl_awal: awal,
    p_tgl_akhir: akhir
  });
  if (!cekAksesGAS(res)) return;

  if (res && res.message) { bodyEl.innerHTML = `<div class="info-bar">Gagal memuat: ${escHtml(res.message)}</div>`; return; }
  if (!Array.isArray(res) || res.length === 0) { bodyEl.innerHTML = '<div class="info-bar">Tidak ada data pada periode ini.</div>'; return; }

  let totalOplah = 0;
  let html = `
    <table class="table table-sm table-bordered tbl-oplah mb-0">
      <thead><tr><th class="txt-left">Tanggal</th><th class="txt-left">Jenis</th><th>Qty Asli</th><th>PPS</th><th>Oplah</th><th class="txt-left">Keterangan</th></tr></thead>
      <tbody>`;
  res.forEach(r => {
    totalOplah += Number(r.oplah || 0);
    html += `
      <tr>
        <td class="txt-left">${formatTanggal(r.tgl)}</td>
        <td class="txt-left">${escHtml(r.jenis)}</td>
        <td>${formatRibuan(r.qty_asli)}</td>
        <td>${r.pps}</td>
        <td>${formatRibuan(Math.round(r.oplah))}</td>
        <td class="txt-left">${escHtml(r.keterangan || '-')}</td>
      </tr>`;
  });
  html += `
      <tr class="row-grandtotal">
        <td class="txt-left" colspan="4">TOTAL OPLAH</td>
        <td>${formatRibuan(Math.round(totalOplah))}</td>
        <td></td>
      </tr>
    </tbody></table>`;

  bodyEl.innerHTML = html;
}

// ── INIT ────────────────────────────────────────────────────
window.addEventListener('load', function() {
  if (!guardHalaman()) return;

  const role = getRoleUser();
  if (role !== 'DIREKTUR' && role !== 'MANAGER') {
    window.location.replace('../index.html');
    return;
  }

  initNav('laporan kinerja');

  document.getElementById('tglAwal').value = formatDateInput(defaultTglAwal());
  document.getElementById('tglAkhir').value = formatDateInput(new Date());

  document.getElementById('kontenLaporan').style.display = '';
  muatSemua();
});
</script>
</body>
</html>
