<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Laporan Piutang — SIEO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="../css/sieo.css" rel="stylesheet"/>
  <style>
    .rekap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-bottom:.85rem;}
    .rekap-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.7rem .85rem;}
    .rekap-card .lbl{font-family:var(--mono);font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
    .rekap-card .val{font-family:var(--mono);font-size:1.05rem;font-weight:600;color:var(--navy);margin-top:.2rem;}
    .rekap-card.warn .val{color:var(--red);}
    .td-mono{font-family:var(--mono);font-size:.75rem;} .td-right{text-align:right;}
    .badge-jt{font-family:var(--mono);font-size:.6rem;font-weight:600;padding:.15rem .4rem;border-radius:3px;}
    .jt-aman{background:var(--green-bg);color:var(--green);}
    .jt-dekat{background:#fff3cd;color:#856404;}
    .jt-lewat{background:#fdecea;color:var(--red);}
    .badge-sumber-sj{background:#e8f0fe;color:#1a56db;border:1px solid #a4c0f9;font-family:var(--mono);font-size:.58rem;padding:.1rem .35rem;border-radius:3px;}
    .badge-sumber-saldo{background:#fef9e7;color:#7d6608;border:1px solid #f9e79f;font-family:var(--mono);font-size:.58rem;padding:.1rem .35rem;border-radius:3px;}
    .row-pelanggan{cursor:pointer;}
    .row-pelanggan:hover{background:#f4f7fc;}
    .row-pelanggan .chev{display:inline-block;transition:transform .15s;margin-right:.4rem;color:var(--muted);}
    .row-pelanggan.open .chev{transform:rotate(90deg);}
    .row-detail{display:none;background:#fafbfd;}
    .row-detail.open{display:table-row;}
    .row-detail td{padding:0 !important;}
    .det-inner-tbl{width:100%;border-collapse:collapse;}
    .det-inner-tbl th{font-family:var(--mono);font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:.35rem .6rem;border-bottom:1px solid var(--border);text-align:left;}
    .det-inner-tbl td{font-size:.76rem;padding:.4rem .6rem;border-bottom:1px solid #eef1f7;}
    .det-inner-tbl td.td-right{text-align:right;}
    .btn-navy{background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:.78rem;font-family:var(--mono);font-weight:600;padding:.4rem .85rem;cursor:pointer;}
    .btn-navy:hover{background:var(--navy-mid);}
    .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--border);border-radius:6px;font-size:.78rem;font-family:var(--mono);padding:.4rem .85rem;cursor:pointer;}
    .btn-outline:hover{border-color:var(--navy);}
  </style>
</head>
<body>
<div id="navRoot"></div>

<div class="rekap-grid" id="lpCards">
  <div class="rekap-card"><div class="lbl">Total Piutang</div><div class="val" id="lpTotalSisa">…</div></div>
  <div class="rekap-card"><div class="lbl">Jumlah Pelanggan</div><div class="val" id="lpJmlPelanggan">…</div></div>
  <div class="rekap-card warn"><div class="lbl">Jatuh Tempo Lewat</div><div class="val" id="lpJmlLewat">…</div></div>
</div>

<div class="toolbar">
  <input type="text" id="lpCari" placeholder="Cari nama pelanggan…" oninput="renderLaporan()"/>
  <select id="lpEntitas" onchange="muatLaporan()">
    <option value="">PT &amp; DK</option>
    <option value="PT">PT Elim</option>
    <option value="DK">DK Offset</option>
  </select>
  <button class="btn-outline" onclick="exportCsv()">⬇️ Export CSV</button>
</div>

<div class="info-bar" id="lpInfoBar">Memuat data…</div>

<div class="tbl-wrap">
  <table>
    <thead><tr>
      <th>Pelanggan</th>
      <th class="td-right">Jml Invoice</th>
      <th class="td-right">Jatuh Tempo Lewat</th>
      <th class="td-right">Total Sisa</th>
    </tr></thead>
    <tbody id="lpTbody"><tr><td colspan="4" class="loading">Memuat…</td></tr></tbody>
  </table>
</div>

<script src="../js/api.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/utils.js"></script>
<script>
'use strict';
function esc(s){return escHtml(s);}
function fmtRupiah(n){return formatRupiah(n);}
function fmtTgl(s){
  if(!s)return '—';
  var d=new Date(s);
  if(isNaN(d))return s;
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtAngka(n){return Number(n||0).toLocaleString('id-ID');}

var dataMentah=[]; // hasil RPC (per invoice)
var grupPelanggan=[]; // hasil groupBy nama_pelanggan
var openSet={}; // nama_pelanggan yang expand-nya terbuka

function badgeJatuhTempo(hariTerlambat){
  if(hariTerlambat>0) return '<span class="badge-jt jt-lewat">TELAT '+hariTerlambat+' HARI</span>';
  return '<span class="badge-jt jt-aman">AMAN</span>';
}

function muatLaporan(){
  document.getElementById('lpInfoBar').textContent='Memuat data…';
  var entitas=document.getElementById('lpEntitas').value;
  dbRpc('get_laporan_piutang_pelanggan',{ p_entitas: entitas || null }).then(function(res){
    if(!Array.isArray(res)){
      document.getElementById('lpInfoBar').textContent='Gagal memuat: '+(res&&res.message?res.message:'error tidak diketahui');
      return;
    }
    dataMentah=res;
    groupData();
    renderCards();
    renderLaporan();
    document.getElementById('lpInfoBar').textContent=dataMentah.length+' invoice, '+grupPelanggan.length+' pelanggan.';
  }).catch(function(e){
    document.getElementById('lpInfoBar').textContent='Error: '+(e&&e.message?e.message:JSON.stringify(e));
  });
}

function groupData(){
  var map={};
  dataMentah.forEach(function(r){
    var key=r.nama_pelanggan||'—';
    if(!map[key]){
      map[key]={nama_pelanggan:key,jumlah_invoice:0,jumlah_lewat:0,total_sisa:0,invoices:[]};
    }
    map[key].jumlah_invoice++;
    if(r.hari_terlambat>0) map[key].jumlah_lewat++;
    map[key].total_sisa+=Number(r.sisa_piutang||0);
    map[key].invoices.push(r);
  });
  grupPelanggan=Object.values(map).sort(function(a,b){return b.total_sisa-a.total_sisa;});
}

function renderCards(){
  var totalSisa=grupPelanggan.reduce(function(s,g){return s+g.total_sisa;},0);
  var jmlLewat=dataMentah.filter(function(r){return r.hari_terlambat>0;}).length;
  document.getElementById('lpTotalSisa').textContent=fmtRupiah(totalSisa);
  document.getElementById('lpJmlPelanggan').textContent=fmtAngka(grupPelanggan.length);
  document.getElementById('lpJmlLewat').textContent=fmtAngka(jmlLewat);
}

function renderLaporan(){
  var q=(document.getElementById('lpCari').value||'').toLowerCase();
  var data=grupPelanggan;
  if(q) data=data.filter(function(g){return g.nama_pelanggan.toLowerCase().indexOf(q)>=0;});

  var tb=document.getElementById('lpTbody');
  if(!data.length){tb.innerHTML='<tr><td colspan="4" class="loading">Tidak ada data.</td></tr>';return;}

  var html='';
  data.forEach(function(g){
    var isOpen=!!openSet[g.nama_pelanggan];
    html+='<tr class="row-pelanggan'+(isOpen?' open':'')+'" onclick="toggleExpand(\''+g.nama_pelanggan.replace(/'/g,"\\'")+'\')">'+
      '<td><span class="chev">▶</span>'+esc(g.nama_pelanggan)+'</td>'+
      '<td class="td-mono td-right">'+g.jumlah_invoice+'</td>'+
      '<td class="td-mono td-right">'+(g.jumlah_lewat>0?('<span class="badge-jt jt-lewat">'+g.jumlah_lewat+'</span>'):'0')+'</td>'+
      '<td class="td-mono td-right" style="font-weight:600">'+fmtRupiah(g.total_sisa)+'</td>'+
    '</tr>';
    html+='<tr class="row-detail'+(isOpen?' open':'')+'" id="det-'+encodeURIComponent(g.nama_pelanggan)+'"><td colspan="4">'+
      renderDetailTabel(g.invoices)+
    '</td></tr>';
  });
  tb.innerHTML=html;
}

function renderDetailTabel(invoices){
  var sorted=invoices.slice().sort(function(a,b){return new Date(a.tgl)-new Date(b.tgl);});
  var rows=sorted.map(function(r){
    var badge=r.sumber==='SALDO_AWAL'
      ?'<span class="badge-sumber-saldo">SALDO AWAL</span>'
      :'<span class="badge-sumber-sj">SJ</span>';
    return '<tr>'+
      '<td>'+badge+' <span class="td-mono">'+esc(r.no_nota||'—')+'</span></td>'+
      '<td class="td-mono">'+fmtTgl(r.tgl)+'</td>'+
      '<td class="td-mono">'+esc(r.entitas)+'</td>'+
      '<td class="td-mono td-right">'+fmtRupiah(r.total_tagih)+'</td>'+
      '<td class="td-mono td-right" style="font-weight:600">'+fmtRupiah(r.sisa_piutang)+'</td>'+
      '<td class="td-mono">'+fmtTgl(r.tgl_jatuh_tempo)+'</td>'+
      '<td>'+badgeJatuhTempo(r.hari_terlambat)+'</td>'+
    '</tr>';
  }).join('');
  return '<table class="det-inner-tbl"><thead><tr>'+
    '<th>No. Nota</th><th>Tanggal</th><th>Entitas</th><th class="td-right">Total Tagih</th>'+
    '<th class="td-right">Sisa</th><th>Jatuh Tempo</th><th>Status</th>'+
  '</tr></thead><tbody>'+rows+'</tbody></table>';
}

function toggleExpand(nama){
  openSet[nama]=!openSet[nama];
  renderLaporan();
}

function exportCsv(){
  var rows=[['Pelanggan','Sumber','No. Nota','Tanggal','Entitas','Total Tagih','Sisa Piutang','Jatuh Tempo','Hari Terlambat']];
  var q=(document.getElementById('lpCari').value||'').toLowerCase();
  var data=grupPelanggan;
  if(q) data=data.filter(function(g){return g.nama_pelanggan.toLowerCase().indexOf(q)>=0;});
  data.forEach(function(g){
    g.invoices.forEach(function(r){
      rows.push([
        g.nama_pelanggan, r.sumber, r.no_nota||'', fmtTgl(r.tgl), r.entitas,
        r.total_tagih, r.sisa_piutang, fmtTgl(r.tgl_jatuh_tempo), r.hari_terlambat
      ]);
    });
  });
  var csv=rows.map(function(row){
    return row.map(function(v){
      var s=String(v===undefined||v===null?'':v);
      if(s.indexOf(',')>=0||s.indexOf('"')>=0||s.indexOf('\n')>=0){
        s='"'+s.replace(/"/g,'""')+'"';
      }
      return s;
    }).join(',');
  }).join('\r\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='laporan_piutang_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

window.addEventListener('load', function() {
  if (!guardHalaman()) return;
  initNav('laporan');
  muatLaporan();
});
</script>
</body>
</html>
