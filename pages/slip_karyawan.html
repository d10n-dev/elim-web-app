<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Slip Gaji Saya — SIEO</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="../css/sieo.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<style>
  .topbar-slip{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.85rem 1.1rem;background:var(--surface);border-bottom:1px solid var(--border);}
  .topbar-slip select{font-family:var(--mono);font-size:.78rem;padding:.4rem .6rem;border:1px solid var(--border);border-radius:6px;min-width:200px;}
  .wrap-slip{padding:1.1rem;max-width:640px;margin:0 auto;}
  .card-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem 1.1rem;margin-bottom:1rem;}
  .slip-pre{font-family:var(--mono);font-size:.82rem;white-space:pre-wrap;background:var(--bg);border-radius:6px;padding:1rem;border:1px solid var(--border);}
  .empty-state{text-align:center;padding:3rem 1rem;color:var(--muted);}
  .btn-navy{background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:.78rem;font-family:var(--mono);font-weight:600;padding:.5rem 1rem;cursor:pointer;}
  .btn-navy:hover{background:var(--navy-mid);color:#fff;}

  .slip-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:1.5rem;}
  .slip-header{text-align:center;border-bottom:2px solid var(--navy);padding-bottom:.8rem;margin-bottom:1rem;}
  .slip-company{font-family:var(--mono);font-weight:600;color:var(--navy);font-size:.85rem;letter-spacing:.03em;}
  .slip-title{font-family:var(--sans);font-weight:600;font-size:1.1rem;color:var(--navy);margin-top:.2rem;}
  .slip-info td{font-size:.8rem;padding:.15rem 0;}
  .slip-info td:first-child{color:var(--muted);width:110px;}
  .slip-table{width:100%;margin-top:.9rem;border-top:1px solid var(--border);}
  .slip-table td{padding:.35rem 0;font-size:.82rem;border-bottom:1px dashed var(--border);}
  .slip-table td.r{text-align:right;font-family:var(--mono);}
  .slip-table tr.total td{font-weight:700;border-top:2px solid var(--navy);border-bottom:none;padding-top:.5rem;}
  .slip-section-title{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);font-weight:600;margin:1.1rem 0 .4rem;border-bottom:1px solid var(--border);padding-bottom:.3rem;}
  .slip-mini-tbl{width:100%;font-size:.75rem;}
  .slip-mini-tbl td{padding:.25rem 0;border-bottom:1px solid #f0f2f6;}
  .slip-mini-tbl td.r{text-align:right;font-family:var(--mono);}
  .saldo-bon-box{background:var(--bg);border-radius:6px;padding:.6rem .8rem;font-size:.8rem;margin-top:.3rem;}
  .saldo-bon-box b{font-family:var(--mono);}
  .btn-print{background:var(--orange);color:#fff;border:none;border-radius:6px;font-size:.8rem;font-family:var(--mono);font-weight:600;padding:.55rem 1.1rem;cursor:pointer;width:100%;margin-top:1rem;}

  @media print {
    .topbar-slip, #navRoot, .btn-print, #debugBox { display:none !important; }
    body, .wrap-slip { padding:0; margin:0; max-width:none; }
    .slip-card { border:none; }
  }
</style>
</head>
<body>
<div id="debugBox" style="display:none;background:#fde9e9;color:#b00020;font-family:monospace;font-size:.78rem;padding:.8rem 1rem;white-space:pre-wrap;border-bottom:3px solid #b00020;"></div>
<script>
  function tampilkanErrorHalaman(msg) {
    const box = document.getElementById('debugBox');
    box.style.display = 'block';
    box.textContent += (box.textContent ? '\n---\n' : '') + msg;
  }
  window.onerror = function (msg, url, line, col) {
    tampilkanErrorHalaman('JS ERROR: ' + msg + '\nFile: ' + url + '\nBaris: ' + line + ':' + col);
  };
  window.addEventListener('unhandledrejection', function (ev) {
    tampilkanErrorHalaman('PROMISE ERROR: ' + (ev.reason && ev.reason.message ? ev.reason.message : JSON.stringify(ev.reason)));
  });
</script>
<div id="navRoot"></div>

<div id="konten" style="display:none">
  <div class="topbar-slip">
    <strong id="judulHalaman">Slip Gaji Saya</strong>
    <select id="selKaryawanTest" style="display:none" onchange="gantiKaryawanTest()"></select>
    <select id="selPeriodeSlip" onchange="muatSlip()"></select>
  </div>
  <div class="wrap-slip">
    <div id="areaSlip"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script>
const NAMA_HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
let modeDirektur = false;
let nipTerpilih = null;
let daftarPeriodeSlip = [];

async function gantiKaryawanTest() {
  nipTerpilih = document.getElementById('selKaryawanTest').value;
  await muatDaftarPeriode();
}

async function muatDaftarPeriode() {
  const res = await dbRpc('get_periode_slip_view', { p_nip: modeDirektur ? nipTerpilih : null });
  daftarPeriodeSlip = res || [];
  const sel = document.getElementById('selPeriodeSlip');
  sel.innerHTML = daftarPeriodeSlip.map(p =>
    `<option value="${p.id_periode}">${formatTanggal(p.tgl_mulai)} – ${formatTanggal(p.tgl_selesai)}${p.status !== 'FINAL' ? ' [' + p.status + ']' : ''}</option>`
  ).join('');
  if (!daftarPeriodeSlip.length) {
    sel.innerHTML = '<option value="">Belum ada slip</option>';
    document.getElementById('areaSlip').innerHTML = '<div class="empty-state">Belum ada slip gaji yang bisa ditampilkan untuk periode manapun.</div>';
    return;
  }
  await muatSlip();
}

async function muatSlip() {
  const idPeriode = document.getElementById('selPeriodeSlip').value;
  if (!idPeriode) return;
  const targetNip = modeDirektur ? nipTerpilih : null;
  const h = await dbRpc('get_slip_gaji_view', { p_id_periode: idPeriode, p_nip: targetNip });
  if (!h) {
    document.getElementById('areaSlip').innerHTML = '<div class="empty-state">Slip tidak ditemukan untuk periode ini.</div>';
    return;
  }
  const [detail, saldoBon, riwayatBon] = await Promise.all([
    dbRpc('get_detail_harian_view', { p_id_periode: idPeriode, p_nip: targetNip }),
    dbRpc('get_saldo_bon_view', { p_nip: targetNip }),
    dbRpc('get_riwayat_bon_view', { p_nip: targetNip, p_limit: 15 })
  ]);

  const baris = (detail || []).filter(r => r.status !== 'HADIR' && r.status !== 'LIBUR');
  const rincianHtml = baris.length
    ? baris.map(r => {
        const d = new Date(r.tanggal + 'T00:00:00');
        return `<tr><td>${formatTanggal(r.tanggal)} (${NAMA_HARI[d.getDay()]})</td><td>${r.status}</td><td>${escHtml(r.keterangan || '')}</td></tr>`;
      }).join('')
    : '<tr><td colspan="3" class="text-muted">Semua hari kerja hadir normal</td></tr>';

  const riwayatBonHtml = (riwayatBon || []).length
    ? riwayatBon.map(r => `<tr><td>${formatTanggal(r.tanggal)}</td><td>${r.jenis}</td>
        <td class="r" style="${r.nominal < 0 ? 'color:var(--green)' : 'color:var(--red)'}">${formatRupiah(r.nominal)}</td>
        <td>${escHtml(r.keterangan || '')}</td></tr>`).join('')
    : '<tr><td colspan="4" class="text-muted">Belum ada transaksi bon</td></tr>';

  document.getElementById('areaSlip').innerHTML = `
    <div class="slip-card" id="slipPrintArea">
      <div class="slip-header">
        <div class="slip-company">PT. ELIM CITRA OFFSET / DK OFFSET</div>
        <div class="slip-title">SLIP GAJI</div>
      </div>
      <table class="slip-info">
        <tr><td>Nama</td><td>: ${escHtml(h.nama_lengkap || h.nama)}</td></tr>
        <tr><td>NIP</td><td>: ${h.nip}</td></tr>
        <tr><td>Periode</td><td>: ${formatTanggal(h.tgl_mulai)} – ${formatTanggal(h.tgl_selesai)}</td></tr>
      </table>
      <table class="slip-table">
        <tr><td>Gaji Pokok</td><td class="r">${formatRupiah(h.gaji_pokok_rp)}</td></tr>
        <tr><td>Bonus Dasar</td><td class="r">${formatRupiah(h.bonus_dasar_rp)}</td></tr>
        <tr><td>Kinerja</td><td class="r">${h.persen_kinerja}%</td></tr>
        <tr><td>Potongan Jam (${Number(h.jam_potongan_biasa + h.jam_izin_shortfall).toFixed(1)} jam)</td><td class="r">- ${formatRupiah((h.jam_potongan_biasa + h.jam_izin_shortfall) * h.pokok_perjam)}</td></tr>
        <tr><td>Alpa (${h.hari_alpa} hari) + Denda 40%</td><td class="r">- ${formatRupiah(h.jam_alpa * h.pokok_perjam + Number(h.denda_alpa_rp))}</td></tr>
        <tr><td>Lembur</td><td class="r">+ ${formatRupiah(h.lembur_bonus_rp)}</td></tr>
        <tr><td>Potongan Bon Periode Ini</td><td class="r">- ${formatRupiah(h.bon_dipotong_rp)}</td></tr>
        <tr><td>Penyesuaian Manual</td><td class="r">${Number(h.penyesuaian_rp || 0) < 0 ? '- ' + formatRupiah(Math.abs(h.penyesuaian_rp)) : '+ ' + formatRupiah(h.penyesuaian_rp || 0)}</td></tr>
        <tr class="total"><td>Bonus Final</td><td class="r">${formatRupiah(h.bonus_final_rp)}</td></tr>
        <tr class="total"><td>TOTAL CAIR (Pokok + Bonus)</td><td class="r">${formatRupiah(Number(h.gaji_pokok_rp) + Number(h.bonus_final_rp))}</td></tr>
      </table>
      ${h.sisa_minus_rp > 0 ? `<div class="saldo-bon-box" style="color:var(--red)">⚠ Sisa kurang <b>${formatRupiah(h.sisa_minus_rp)}</b> masuk saldo BON bulan depan.</div>` : ''}

      <div class="slip-section-title">Rincian Non-Hadir</div>
      <table class="slip-mini-tbl"><tbody>${rincianHtml}</tbody></table>

      <div class="slip-section-title">Saldo & Riwayat Bon</div>
      <div class="saldo-bon-box">Sisa saldo bon saat ini: <b style="${saldoBon > 0 ? 'color:var(--red)' : 'color:var(--green)'}">${formatRupiah(saldoBon || 0)}</b></div>
      <table class="slip-mini-tbl" style="margin-top:.5rem"><tbody>${riwayatBonHtml}</tbody></table>
    </div>
    <button class="btn-print" onclick="window.print()">🖨️ Print / Simpan sebagai PDF</button>
  `;
}

window.addEventListener('load', async function () {
  try {
    if (!guardHalaman()) return;
    initNav('slip_karyawan');
    document.getElementById('konten').style.display = '';

    const role = getRoleUser();
    modeDirektur = (role === 'DIREKTUR');

    if (modeDirektur) {
      document.getElementById('judulHalaman').textContent = 'Slip Gaji (Mode Test — Direktur)';
      const daftar = await dbRpc('get_daftar_karyawan_test', {});
      const sel = document.getElementById('selKaryawanTest');
      sel.style.display = '';
      sel.innerHTML = (daftar || []).map(k => `<option value="${k.nip}">${k.nip} — ${k.nama_lengkap || k.nama}</option>`).join('');
      if (daftar && daftar.length) {
        nipTerpilih = daftar[0].nip;
        await muatDaftarPeriode();
      } else {
        document.getElementById('areaSlip').innerHTML = '<div class="empty-state">Belum ada data karyawan di menu Gajian.</div>';
      }
    } else {
      const profil = await dbRpc('get_profil_login_saya', {});
      if (!profil) {
        document.getElementById('areaSlip').innerHTML =
          '<div class="empty-state">Akun kamu belum terhubung ke data karyawan.<br>Hubungi Direktur untuk menghubungkan email login ini ke data gajimu.</div>';
        document.getElementById('selPeriodeSlip').style.display = 'none';
        return;
      }
      document.getElementById('judulHalaman').textContent = 'Slip Gaji — ' + (profil.nama_lengkap || profil.nama);
      await muatDaftarPeriode();
    }
  } catch (err) {
    tampilkanErrorHalaman('INIT ERROR: ' + (err && err.message ? err.message : err) + (err && err.stack ? ('\n' + err.stack) : ''));
  }
});
</script>
</body>
</html>
