<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIEO — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:   #1a2744;
      --orange: #e8521a;
      --bg:     #eef1f7;
      --mono:   'IBM Plex Mono', monospace;
      --sans:   'IBM Plex Sans', sans-serif;
    }
    body {
      background: var(--bg);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border: 1px solid #d0d8e8;
      border-top: 4px solid var(--orange);
      border-radius: 10px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(26,39,68,0.10);
    }
    .logo-text {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 1.5rem;
      color: var(--navy);
      letter-spacing: 0.08em;
    }
    .logo-sub {
      font-size: 0.75rem;
      color: #6b7a99;
      font-family: var(--mono);
      margin-top: 0.2rem;
    }
    .btn-google {
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-family: var(--mono);
      font-size: 0.85rem;
      font-weight: 600;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-google:hover { background: #243257; }
    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-box {
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 0.6rem 0.85rem;
      border-radius: 6px;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="logo-text">SIEO</div>
      <div class="logo-sub">PT. Elim Citra Offset</div>
    </div>

    <div id="statusBox"></div>

    <button class="btn-google mt-3" id="btnLogin" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#EA4335" d="M9 3.48c1.69 0 2.83.73 3.48 1.34l2.54-2.48C13.46.89 11.43 0 9 0 5.48 0 2.44 2.07.96 5.07l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z"/>
        <path fill="#FBBC05" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.66 2.08-1.9 2.92l2.9 2.25c1.7-1.57 2.68-3.88 2.68-6.67z"/>
        <path fill="#34A853" d="M3.88 10.67A5.54 5.54 0 0 1 3.48 9c0-.58.1-1.14.39-1.67L.96 5.07A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.03l2.92-2.36z"/>
        <path fill="#4285F4" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.25c-.78.54-1.83.9-3.06.9-2.38 0-4.4-1.57-5.12-3.73L.97 12.93C2.45 15.93 5.48 18 9 18z"/>
      </svg>
      Masuk dengan Google
    </button>

    <div class="text-center mt-3" style="font-size:0.68rem;color:#6b7a99;font-family:var(--mono)">
      Hanya akun yang sudah disetujui Direktur dapat masuk
    </div>
  </div>

  <script>
    const SUPA_URL = 'https://sodwffpzgwocujsqrncd.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvZHdmZnB6Z3dvY3Vqc3FybmNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NDkwNjAsImV4cCI6MjA5NzEyNTA2MH0.hMUyH2Td64AMstyh0j3HQGOMaIqRk8h2V_tfj6QiBK4';

    function setStatus(pesan, tipe = 'info') {
      const warna = { info: '#eef1f7', ok: '#e6f7ef', err: '#fdecea' };
      const teks  = { info: '#1a2744', ok: '#1a9e5c', err: '#dc3545' };
      document.getElementById('statusBox').innerHTML = `
        <div class="status-box" style="background:${warna[tipe]};color:${teks[tipe]}">${pesan}</div>`;
    }

    function getSesi() {
      try { return JSON.parse(localStorage.getItem('sieo_sesi')); } catch(e) { return null; }
    }

    function loginGoogle() {
      const redirectTo = encodeURIComponent(window.location.origin + '/pages/login.html');
      window.location.href =
        `${SUPA_URL}/auth/v1/authorize?provider=google&redirect_to=${redirectTo}`;
    }

    async function handleCallback() {
      const hash = window.location.hash;
      if (!hash || !hash.includes('access_token')) return;

      setStatus('Memverifikasi akun…', 'info');
      document.getElementById('btnLogin').disabled = true;

      try {
        const params       = new URLSearchParams(hash.substring(1));
        const accessToken  = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        const expiresAt    = params.get('expires_at');

        if (!accessToken) throw new Error('Token tidak ditemukan');

        // Ambil data user dari Supabase Auth
        const resAuth = await fetch(`${SUPA_URL}/auth/v1/user`, {
          headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${accessToken}` }
        });
        const userData = await resAuth.json();
        if (!userData.email) throw new Error('Gagal ambil data akun Google');

        // Cek di tabel m_user
        const resUser = await fetch(
          `${SUPA_URL}/rest/v1/m_user?email=eq.${encodeURIComponent(userData.email)}&select=*`,
          { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${accessToken}` } }
        );
        const userRows = await resUser.json();
        const userDb   = userRows && userRows[0] ? userRows[0] : null;

        // Direktur hardcode — selalu bisa masuk
        const isDirektur = userData.email === 'dion.krisnata@gmail.com';

        if (!userDb && !isDirektur) {
          // User belum terdaftar — daftarkan sebagai PENDING
          await fetch(`${SUPA_URL}/rest/v1/m_user`, {
            method: 'POST',
            headers: {
              'apikey': SUPA_KEY,
              'Authorization': `Bearer ${accessToken}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=minimal'
            },
            body: JSON.stringify({
              email:      userData.email,
              nama:       userData.user_metadata?.full_name || userData.email,
              role:       null,
              status:     'PENDING',
              tgl_daftar: new Date().toISOString()
            })
          });
          setStatus('Akun kamu belum disetujui. Hubungi Direktur untuk aktivasi.', 'err');
          document.getElementById('btnLogin').disabled = false;
          return;
        }

        if (!isDirektur && userDb.status !== 'AKTIF') {
          setStatus('Akun belum aktif. Status: ' + userDb.status, 'err');
          document.getElementById('btnLogin').disabled = false;
          return;
        }

        // Update last_login
        const roleUser = isDirektur ? 'DIREKTUR' : userDb.role;
        if (!isDirektur) {
          await fetch(
            `${SUPA_URL}/rest/v1/m_user?email=eq.${encodeURIComponent(userData.email)}`,
            {
              method: 'PATCH',
              headers: {
                'apikey': SUPA_KEY,
                'Authorization': `Bearer ${accessToken}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ last_login: new Date().toISOString() })
            }
          );
        }

        // Simpan sesi
        localStorage.setItem('sieo_sesi', JSON.stringify({
          access_token:  accessToken,
          refresh_token: refreshToken,
          expires_at:    expiresAt ? parseInt(expiresAt) : null,
          user_info: {
            email:  userData.email,
            nama:   isDirektur ? 'Direktur' : (userDb.nama || userData.user_metadata?.full_name || userData.email),
            role:   roleUser,
            status: isDirektur ? 'AKTIF' : userDb.status
          }
        }));

        // Bersihkan hash dari URL
        history.replaceState(null, '', window.location.pathname);

        setStatus('Login berhasil. Mengalihkan…', 'ok');
        setTimeout(() => { window.location.href = '/index.html'; }, 800);

      } catch(err) {
        setStatus('Error: ' + err.message, 'err');
        document.getElementById('btnLogin').disabled = false;
      }
    }

    // Cek kalau sudah login
    const sesiAda = getSesi();
    if (sesiAda && sesiAda.access_token) {
      window.location.href = '/index.html';
    } else {
      handleCallback();
    }
  </script>
</body>
</html>
