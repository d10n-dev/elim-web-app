<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SIEO</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    background:#eef1f7; font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .login-card {
    background:#fff; border-radius:12px;
    box-shadow:0 4px 24px rgba(26,39,68,0.10);
    padding:40px 32px 32px; width:100%; max-width:400px;
  }
  .logo-bar {
    background:#1a2744; border-bottom:4px solid #e8521a;
    border-radius:12px 12px 0 0; padding:18px 24px;
    margin:-40px -32px 28px;
  }
  .logo-bar h1 { font-family:'IBM Plex Mono',monospace; color:#fff; font-size:1.5rem; margin:0; letter-spacing:2px; }
  .logo-bar p  { color:#adb9d6; font-size:0.78rem; margin:4px 0 0; }
  .status-box  { border-radius:8px; padding:14px 16px; font-size:0.88rem; margin-bottom:16px; display:none; }
  .status-box.show { display:block; }
  #btnGoogle {
    width:100%; background:#fff; border:2px solid #1a2744; color:#1a2744;
    font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:0.95rem;
    padding:12px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition:background 0.2s;
  }
  #btnGoogle:hover   { background:#eef1f7; }
  #btnGoogle:disabled{ opacity:0.6; cursor:not-allowed; }
  .divider { border:none; border-top:1px solid #e0e4ef; margin:20px 0; }
  #formDaftar { display:none; }
  #formDaftar.show { display:block; }
  .form-label { font-size:0.85rem; font-weight:600; color:#1a2744; }
  .form-control:focus { border-color:#1a2744; box-shadow:0 0 0 2px rgba(26,39,68,0.15); }
  .btn-navy { background:#1a2744; border:none; color:#fff; font-weight:600; width:100%; padding:10px; border-radius:8px; }
  .btn-navy:hover { background:#243560; color:#fff; }
  .btn-link-sm { font-size:0.82rem; color:#6c757d; text-decoration:none; cursor:pointer; display:inline-block; margin-top:8px; }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-bar">
    <h1>SIEO</h1>
    <p>Sistem Informasi Elim Offset</p>
  </div>

  <div id="statusBox" class="status-box"></div>

  <div id="sectionLogin">
    <p class="text-muted mb-3" style="font-size:0.88rem;">
      Masuk menggunakan akun Google yang terdaftar.
    </p>
    <button id="btnGoogle" onclick="loginGoogle()">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Masuk dengan Google
    </button>
  </div>

  <div id="formDaftar">
    <hr class="divider">
    <p style="font-size:0.88rem; color:#1a2744; font-weight:600;">
      Email belum terdaftar. Lengkapi data untuk mendaftar:
    </p>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="text" id="inputEmailDaftar" class="form-control" readonly>
    </div>
    <div class="mb-3">
      <label class="form-label">Nama Lengkap</label>
      <input type="text" id="inputNama" class="form-control" placeholder="Nama sesuai identitas">
    </div>
    <button class="btn btn-navy" onclick="daftarUser()">Kirim Permohonan</button>
    <br>
    <span class="btn-link-sm" onclick="resetLogin()">← Kembali</span>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="../utils.js"></script>
<script src="../api.js"></script>
<script>
const CLIENT_ID = '177308402957-5s8pvglbtbb9pg73p7kg1acq8o3h8p31.apps.googleusercontent.com';
let _idToken = null;
let _email   = null;
let _gsiReady = false;

// Cek kalau sudah login → langsung redirect
window.addEventListener('load', function() {
  var sesi = getSesi();
  if (sesi) { redirectByRole(sesi.role); return; }
  // Pastikan GSI library load sebelum pakai
  waitGSI();
});

function waitGSI(attempt) {
  attempt = attempt || 0;
  if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
    _gsiReady = true;
    // Inisialisasi diam — tanpa auto prompt, tanpa render tombol
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: handleCredential,
      auto_select: false,
      cancel_on_tap_outside: true,
      ux_mode: 'popup'
    });
  } else if (attempt < 20) {
    setTimeout(function(){ waitGSI(attempt + 1); }, 300);
  }
}

// ── KLIK TOMBOL LOGIN ──
function loginGoogle() {
  if (!_gsiReady) {
    tampilStatus('warning', 'Koneksi ke Google belum siap. Coba lagi.');
    return;
  }
  setBtn(true, 'Membuka login Google...');
  // Pakai popup — lebih andal di Android Chrome
  google.accounts.id.prompt(function(notif) {
    // One Tap tidak muncul atau di-skip → tidak apa-apa, popup tetap akan muncul
    if (notif.isNotDisplayed() || notif.isSkippedMoment()) {
      // One Tap tidak tersedia — fallback: buka OAuth popup manual
      bukaOAuthPopup();
    }
  });
}

// Fallback: OAuth popup via token client
function bukaOAuthPopup() {
  var tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: 'openid email profile',
    callback: '' // tidak dipakai, kita pakai id_token dari id flow
  });
  // Ganti pendekatan: pakai renderButton tersembunyi + trigger click
  var hidden = document.getElementById('_gsiHidden');
  if (!hidden) {
    hidden = document.createElement('div');
    hidden.id = '_gsiHidden';
    hidden.style.cssText = 'position:absolute;top:-9999px;left:-9999px;';
    document.body.appendChild(hidden);
  }
  hidden.innerHTML = '';
  google.accounts.id.renderButton(hidden, {
    type: 'standard', theme: 'outline', size: 'large'
  });
  // Trigger klik tombol GSI yang ter-render
  var gsBtn = hidden.querySelector('div[role="button"]') || hidden.querySelector('button');
  if (gsBtn) {
    gsBtn.click();
  } else {
    // Terakhir: minta user tap tombol GSI yang dimunculkan
    tampilStatus('info', 'Ketuk tombol di bawah untuk masuk.');
    var wrap = document.getElementById('sectionLogin');
    var vis  = document.getElementById('_gsiVisible');
    if (!vis) {
      vis = document.createElement('div');
      vis.id = '_gsiVisible';
      vis.style.marginTop = '12px';
      wrap.appendChild(vis);
    }
    vis.innerHTML = '';
    google.accounts.id.renderButton(vis, {
      theme: 'outline', size: 'large', width: 336, text: 'signin_with'
    });
    setBtn(false);
  }
}

// ── CALLBACK dari GSI setelah user pilih akun ──
function handleCredential(response) {
  _idToken = response.credential;
  // Decode email dari JWT payload (tidak verifikasi — GAS yang verifikasi)
  try {
    var payload = JSON.parse(atob(_idToken.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    _email = payload.email || '';
  } catch(e) { _email = ''; }

  tampilStatus('secondary', 'Memverifikasi akun...');
  setBtn(true, 'Memverifikasi...');

  // Pakai POST bukan GET — token terlalu panjang untuk URL
  apiPost('cekUser', { idToken: _idToken })
    .then(function(res) {
      if (res.status === 'ok') {
        simpanSesi(res.user);
        // Simpan idToken terpisah untuk halaman lain (user_management, dll)
        localStorage.setItem('sieo_idtoken', _idToken);
        tampilStatus('success', 'Login berhasil! Mengalihkan...');
        setTimeout(function(){ redirectByRole(res.user.role); }, 800);

      } else if (res.status === 'pending_daftar') {
        document.getElementById('inputEmailDaftar').value = _email;
        document.getElementById('sectionLogin').style.display = 'none';
        document.getElementById('formDaftar').classList.add('show');
        tampilStatus('info', 'Email belum terdaftar. Lengkapi form pendaftaran.');
        setBtn(false);

      } else if (res.status === 'pending') {
        tampilStatus('warning', res.message);
        setBtn(false);

      } else if (res.status === 'nonaktif') {
        tampilStatus('danger', res.message);
        setBtn(false);

      } else {
        tampilStatus('danger', res.message || 'Terjadi kesalahan. Coba lagi.');
        setBtn(false);
      }
    })
    .catch(function(err) {
      tampilStatus('danger', 'Gagal menghubungi server. Periksa koneksi internet.');
      setBtn(false);
    });
}

// ── DAFTAR USER BARU ──
function daftarUser() {
  var nama = document.getElementById('inputNama').value.trim();
  if (!nama) { tampilStatus('warning', 'Nama lengkap wajib diisi.'); return; }
  tampilStatus('secondary', 'Mengirim permohonan...');

  apiPost('daftarUser', { idToken: _idToken, nama: nama })
    .then(function(res) {
      if (res.status === 'ok') {
        document.getElementById('formDaftar').classList.remove('show');
        document.getElementById('sectionLogin').style.display = 'block';
        tampilStatus('success', 'Permohonan terkirim. Tunggu persetujuan Direktur.');
        setBtn(false);
      } else {
        tampilStatus('danger', res.message || 'Gagal mendaftar.');
      }
    })
    .catch(function(){ tampilStatus('danger', 'Gagal menghubungi server.'); });
}

// ── HELPERS ──
function tampilStatus(tipe, pesan) {
  var box = document.getElementById('statusBox');
  box.className = 'status-box show alert alert-' + tipe;
  box.textContent = pesan;
}

function setBtn(disabled, label) {
  var btn = document.getElementById('btnGoogle');
  btn.disabled = !!disabled;
  if (label) {
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>' + label;
  } else {
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Masuk dengan Google';
  }
}

function resetLogin() {
  _idToken = null; _email = null;
  document.getElementById('formDaftar').classList.remove('show');
  document.getElementById('sectionLogin').style.display = 'block';
  document.getElementById('inputNama').value = '';
  document.getElementById('statusBox').className = 'status-box';
  setBtn(false);
}

function redirectByRole(role) {
  window.location.href = (role === 'SALES') ? '../pages/harga.html' : '../index.html';
}
</script>
</body>
</html>
