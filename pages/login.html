<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SIEO</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { background:#eef1f7; font-family:'IBM Plex Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { background:#fff; border-radius:12px; box-shadow:0 4px 24px rgba(26,39,68,0.10); padding:40px 32px 32px; width:100%; max-width:400px; }
  .logo-bar { background:#1a2744; border-bottom:4px solid #e8521a; border-radius:12px 12px 0 0; padding:18px 24px; margin:-40px -32px 28px; }
  .logo-bar h1 { font-family:'IBM Plex Mono',monospace; color:#fff; font-size:1.5rem; margin:0; letter-spacing:2px; }
  .logo-bar p  { color:#adb9d6; font-size:0.78rem; margin:4px 0 0; }
  .status-box  { border-radius:8px; padding:14px 16px; font-size:0.88rem; margin-bottom:16px; display:none; }
  .status-box.show { display:block; word-break:break-all; }
  #btnGoogle {
    width:100%; background:#fff; border:2px solid #1a2744; color:#1a2744;
    font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:0.95rem;
    padding:12px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
  #btnGoogle:disabled { opacity:0.5; cursor:not-allowed; }
  .divider { border:none; border-top:1px solid #e0e4ef; margin:20px 0; }
  #formDaftar { display:none; }
  #formDaftar.show { display:block; }
  .form-label { font-size:0.85rem; font-weight:600; color:#1a2744; }
  .form-control:focus { border-color:#1a2744; box-shadow:0 0 0 2px rgba(26,39,68,0.15); }
  .btn-navy { background:#1a2744; border:none; color:#fff; font-weight:600; width:100%; padding:10px; border-radius:8px; }
  .btn-link-sm { font-size:0.82rem; color:#6c757d; cursor:pointer; display:inline-block; margin-top:8px; }
  #debugBox { background:#f8f9fa; border:1px solid #dee2e6; border-radius:6px; padding:10px; font-size:0.75rem; font-family:monospace; margin-top:12px; display:none; word-break:break-all; max-height:200px; overflow-y:auto; }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo-bar">
    <h1>SIEO</h1>
    <p>Sistem Informasi Elim Offset</p>
  </div>

  <div id="statusBox" class="status-box"></div>
  <div id="debugBox"></div>

  <div id="sectionLogin">
    <p class="text-muted mb-3" style="font-size:0.88rem;">Masuk menggunakan akun Google yang terdaftar.</p>
    <button id="btnGoogle" onclick="loginGoogle()">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Masuk dengan Google
    </button>
  </div>

  <div id="formDaftar">
    <hr class="divider">
    <p style="font-size:0.88rem; color:#1a2744; font-weight:600;">Email belum terdaftar. Lengkapi data untuk mendaftar:</p>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="text" id="inputEmailDaftar" class="form-control" readonly>
    </div>
    <div class="mb-3">
      <label class="form-label">Nama Lengkap</label>
      <input type="text" id="inputNama" class="form-control" placeholder="Nama sesuai identitas">
    </div>
    <button class="btn btn-navy" onclick="daftarUser()">Kirim Permohonan</button>
    <br><span class="btn-link-sm" onclick="resetLogin()">← Kembali</span>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/api.js"></script>
<script>
const CLIENT_ID    = '177308402957-5s8pvglbtbb9pg73p7kg1acq8o3h8p31.apps.googleusercontent.com';
const REDIRECT_URI = 'https://d10n-dev.github.io/elim-web-app/pages/login.html';

let _idToken = null;
let _email   = null;

function debug(msg) {
  var box = document.getElementById('debugBox');
  box.style.display = 'block';
  box.innerHTML += '<div>' + new Date().toLocaleTimeString('id-ID') + ' — ' + escHtml(String(msg)) + '</div>';
}

(function init() {
  var sesi = getSesi();
  if (sesi) { redirectByRole(sesi.role); return; }
  var hash = window.location.hash;
  if (hash && hash.length > 1) {
    prosesHash(hash);
  }
})();

function parseHash(hash) {
  var raw    = hash.replace(/^#/, '');
  var params = {};
  raw.split('&').forEach(function(part) {
    var eq  = part.indexOf('=');
    if (eq < 0) return;
    var key = decodeURIComponent(part.substring(0, eq));
    var val = part.substring(eq + 1);
    params[key] = val;
  });
  return params;
}

function prosesHash(hash) {
  tampilStatus('secondary', 'Memverifikasi akun...');
  document.getElementById('btnGoogle').disabled = true;

  var params = parseHash(hash);
  debug('Hash keys: ' + Object.keys(params).join(', '));

  _idToken = params['id_token'] || null;
  history.replaceState(null, '', window.location.pathname);

  if (!_idToken) {
    debug('id_token tidak ditemukan di hash');
    tampilStatus('danger', 'Login gagal: token tidak diterima. Coba lagi.');
    document.getElementById('btnGoogle').disabled = false;
    return;
  }

  debug('Token ditemukan, panjang: ' + _idToken.length);

  try {
    var parts   = _idToken.split('.');
    var b64     = parts[1].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var payload = JSON.parse(atob(b64));
    _email = payload.email || '';
    debug('Email: ' + _email);
  } catch(e) {
    debug('Gagal decode JWT: ' + e.message);
    _email = '';
  }

  debug('Mengirim ke GAS...');
  apiPost('cekUser', { idToken: _idToken })
    .then(function(res) {
      debug('GAS response: ' + JSON.stringify(res));
      if (res.status === 'ok') {
        simpanSesi(res.user);
        localStorage.setItem('sieo_idtoken', _idToken);
        tampilStatus('success', 'Login berhasil! Mengalihkan...');
        setTimeout(function(){ redirectByRole(res.user.role); }, 800);

      } else if (res.status === 'pending_daftar') {
        document.getElementById('inputEmailDaftar').value = _email;
        document.getElementById('sectionLogin').style.display = 'none';
        document.getElementById('formDaftar').classList.add('show');
        tampilStatus('info', 'Email belum terdaftar. Lengkapi form pendaftaran.');
        document.getElementById('btnGoogle').disabled = false;

      } else if (res.status === 'pending') {
        tampilStatus('warning', res.message);
        document.getElementById('btnGoogle').disabled = false;

      } else if (res.status === 'nonaktif') {
        tampilStatus('danger', res.message);
        document.getElementById('btnGoogle').disabled = false;

      } else {
        tampilStatus('danger', res.message || 'Terjadi kesalahan.');
        document.getElementById('btnGoogle').disabled = false;
      }
    })
    .catch(function(err) {
      debug('Fetch error: ' + err.message);
      tampilStatus('danger', 'Gagal menghubungi server.');
      document.getElementById('btnGoogle').disabled = false;
    });
}

function loginGoogle() {
  var nonce  = Math.random().toString(36).substring(2);
  var state  = Math.random().toString(36).substring(2) + Date.now().toString(36);
  sessionStorage.setItem('oauth_state', state);
  var p = new URLSearchParams({
    client_id: CLIENT_ID, redirect_uri: REDIRECT_URI,
    response_type: 'id_token', scope: 'openid email profile',
    nonce: nonce, state: state, prompt: 'select_account'
  });
  window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + p.toString();
}

function daftarUser() {
  var nama = document.getElementById('inputNama').value.trim();
  if (!nama) { tampilStatus('warning', 'Nama lengkap wajib diisi.'); return; }
  tampilStatus('secondary', 'Mengirim permohonan...');
  apiPost('daftarUser', { idToken: _idToken, nama: nama })
    .then(function(res) {
      if (res.status === 'ok') {
        document.getElementById('formDaftar').classList.remove('show');
        document.getElementById('sectionLogin').style.display = 'block';
        tampilStatus('success', 'Permohonan terkirim. Tunggu persetujuan Direktur.');
      } else {
        tampilStatus('danger', res.message || 'Gagal mendaftar.');
      }
    })
    .catch(function(){ tampilStatus('danger', 'Gagal menghubungi server.'); });
}

function tampilStatus(tipe, pesan) {
  var box = document.getElementById('statusBox');
  box.className = 'status-box show alert alert-' + tipe;
  box.textContent = pesan;
}

function resetLogin() {
  _idToken = null; _email = null;
  document.getElementById('formDaftar').classList.remove('show');
  document.getElementById('sectionLogin').style.display = 'block';
  document.getElementById('inputNama').value = '';
  document.getElementById('statusBox').className = 'status-box';
  document.getElementById('btnGoogle').disabled = false;
}

function redirectByRole(role) {
  window.location.href = (role === 'SALES') ? '../pages/harga.html' : '../index.html';
}
</script>
</body>
</html>
