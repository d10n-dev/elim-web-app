<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIEO — BOM Item</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f5f4f0;--surface:#fff;--border:#d0cec8;--accent:#1a3a5c;--accent2:#c8401a;--text:#1c1c1c;--muted:#777;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;}
    *{box-sizing:border-box;}
    body{background:var(--bg);font-family:var(--sans);color:var(--text);font-size:14px;}
    .page-header{background:var(--accent);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--accent2);}
    .page-header .title{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;}
    .page-header .subtitle{font-size:11px;opacity:.6;margin-top:2px;font-family:var(--mono);}
    .btn-back{color:#fff;text-decoration:none;font-size:13px;opacity:.8;}
    .btn-back:hover{opacity:1;color:#fff;}
    .panel{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;}
    .panel label{font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:6px;}
    .item-select-wrap{display:flex;gap:8px;align-items:center;}
    .item-select-wrap select{flex:1;font-size:13px;border:1px solid var(--border);border-radius:3px;padding:7px 10px;background:var(--bg);font-family:var(--sans);}
    .btn-load{background:var(--accent);color:#fff;border:none;border-radius:3px;padding:7px 16px;font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
    .btn-load:hover{background:#142d4a;}
    .item-info{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;}
    .bom-wrap{padding:12px 16px 100px;}
    .section-title{font-family:var(--mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:8px;}
    .section-count{background:var(--accent);color:#fff;border-radius:10px;padding:1px 8px;font-size:10px;}
    .bom-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:8px;}

    /* ROW STYLES */
    .row-item{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
    .row-item input[type=text]{flex:1;font-size:13px;border:1px solid var(--border);border-radius:3px;padding:6px 8px;background:var(--bg);font-family:var(--sans);}
    .row-item input[type=text]:focus{border-color:var(--accent);outline:none;}
    .row-item .ket-input{font-size:12px;border:1px solid var(--border);border-radius:3px;padding:6px 8px;background:var(--bg);width:150px;font-family:var(--sans);}
    .row-item .ket-input:focus{border-color:var(--accent);outline:none;}
    .id-badge{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap;min-width:60px;}
    .btn-del{background:none;border:1px solid #fca5a5;color:#dc2626;border-radius:2px;padding:4px 8px;font-size:11px;font-family:var(--mono);cursor:pointer;white-space:nowrap;flex-shrink:0;}
    .btn-del:hover{background:#fee2e2;}
    .btn-add-row{background:none;border:1px dashed var(--border);color:var(--muted);border-radius:3px;padding:5px 12px;font-size:12px;font-family:var(--mono);cursor:pointer;width:100%;margin-top:4px;}
    .btn-add-row:hover{border-color:var(--accent);color:var(--accent);}

    /* FINISHING */
    .fin-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
    .fin-row input{flex:1;font-size:13px;border:1px solid var(--border);border-radius:3px;padding:6px 8px;background:var(--bg);font-family:var(--sans);}
    .fin-row input:focus{border-color:var(--accent);outline:none;}

    /* NOT FOUND HINT */
    .not-found-hint{font-size:11px;color:var(--accent2);font-family:var(--mono);margin-top:2px;display:none;}

    .save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:2px solid var(--border);padding:10px 16px;display:flex;gap:8px;justify-content:flex-end;align-items:center;}
    .btn-simpan{background:var(--accent2);color:#fff;border:none;border-radius:3px;padding:9px 24px;font-family:var(--mono);font-size:13px;font-weight:600;cursor:pointer;}
    .btn-simpan:hover{background:#a83314;}
    .btn-simpan:disabled{opacity:.5;cursor:not-allowed;}
    .loading-state{text-align:center;padding:40px;font-family:var(--mono);font-size:12px;color:var(--muted);}
    .spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .alert-bar{padding:8px 16px;font-family:var(--mono);font-size:12px;}
    .warna-count{font-family:var(--mono);font-size:11px;color:var(--accent);margin-left:4px;}
  </style>
</head>
<body>
<div class="page-header">
  <div>
    <div class="title">BOM — Bill of Materials</div>
    <div class="subtitle">SIEO — PT. Elim Citra Offset</div>
  </div>
  <a href="../index.html" class="btn-back">← Kembali</a>
</div>

<div class="panel">
  <label>Pilih Item</label>
  <div class="item-select-wrap">
    <select id="selItem" onchange="infoItem()">
      <option value="">-- Pilih item --</option>
    </select>
    <button class="btn-load" onclick="muatBom()">Muat BOM</button>
  </div>
  <div class="item-info" id="itemInfo"></div>
</div>

<div id="alertBar" class="alert-bar"></div>
<div class="loading-state" id="loadingBom" style="display:none"><span class="spinner"></span> Memuat BOM...</div>

<!-- datalist untuk tinta (search) -->
<datalist id="dlistTinta"></datalist>
<!-- datalist untuk bahan -->
<datalist id="dlistBahan"></datalist>
<!-- datalist untuk finishing -->
<datalist id="dlistFinishing">
  <option value="POTONG">
  <option value="LAMINASI DOFF">
  <option value="LAMINASI GLOSSY">
  <option value="PON">
  <option value="FOIL">
  <option value="LEM">
  <option value="NOMERATOR">
  <option value="PERFORASI ATAS">
  <option value="PERFORASI SAMPING">
  <option value="BLOK LEM">
  <option value="SPIRAL">
  <option value="JILID">
  <option value="PACKING">
</datalist>

<div class="bom-wrap" id="bomWrap" style="display:none">

  <!-- TINTA -->
  <div class="section-title">
    Tinta
    <span class="warna-count" id="warnaCount"></span>
  </div>
  <div class="bom-card">
    <div id="listTinta"></div>
    <button class="btn-add-row" onclick="tambahRowTinta()">+ Tambah Tinta</button>
  </div>

  <!-- BAHAN -->
  <div class="section-title">Bahan Baku</div>
  <div class="bom-card">
    <div id="listBahan"></div>
    <button class="btn-add-row" onclick="tambahRowBahan()">+ Tambah Bahan</button>
  </div>

  <!-- FINISHING -->
  <div class="section-title">Finishing <span style="font-size:10px;font-weight:400">(PACKING selalu di akhir)</span></div>
  <div class="bom-card">
    <div id="listFinishing"></div>
    <button class="btn-add-row" onclick="tambahRowFinishing()">+ Tambah Finishing</button>
  </div>

  <!-- KETERANGAN -->
  <div class="section-title">Keterangan</div>
  <div class="bom-card">
    <textarea id="inputKeterangan" rows="2" placeholder="Catatan tambahan (opsional)"
      style="width:100%;font-size:13px;border:1px solid var(--border);border-radius:3px;padding:8px;font-family:var(--sans);background:var(--bg);"></textarea>
  </div>
</div>

<div class="save-bar" id="saveBar" style="display:none">
  <button class="btn-simpan" id="btnSimpan" onclick="simpanBom()">Simpan BOM</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script>
  let dataItem = [];
  let dataTinta = [];
  let dataBahan = [];

  window.onload = function() {
    Promise.all([
      apiGet('getItem'),
      apiGet('getTinta'),
      apiGet('getBahan')
    ]).then(([ri, rt, rb]) => {
      dataItem  = Array.isArray(ri) ? ri.filter(i => i.status === 'AKTIF') : [];
      dataTinta = Array.isArray(rt) ? rt.filter(t => t.status === 'AKTIF') : [];
      dataBahan = Array.isArray(rb) ? rb.filter(b => b.status === 'AKTIF') : [];
      isiDropdowns();
    }).catch(() => {
      document.getElementById('alertBar').innerHTML =
        '<div class="alert alert-danger py-2" style="font-size:12px">Gagal memuat data master. Refresh halaman.</div>';
    });
  };

  function isiDropdowns() {
    // item dropdown
    const selItem = document.getElementById('selItem');
    dataItem.forEach(i => {
      const opt = document.createElement('option');
      opt.value = i.id_item;
      opt.textContent = i.id_item + ' — ' + i.nama_item;
      selItem.appendChild(opt);
    });

    // datalist tinta — format: "ID | NAMA" untuk pencarian
    const dlTinta = document.getElementById('dlistTinta');
    dataTinta.forEach(t => {
      const opt = document.createElement('option');
      opt.value = t.id_tinta + ' | ' + t.nama_tinta;
      dlTinta.appendChild(opt);
    });

    // datalist bahan
    const dlBahan = document.getElementById('dlistBahan');
    dataBahan.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.id_bahan + ' | ' + b.nama_bahan;
      dlBahan.appendChild(opt);
    });
  }

  function infoItem() {
    const id   = document.getElementById('selItem').value;
    const item = dataItem.find(i => i.id_item === id);
    document.getElementById('itemInfo').textContent = item
      ? 'Kategori: ' + item.kategori + ' | Satuan: ' + item.satuan + ' | PPS: ' + item.pps
      : '';
    document.getElementById('bomWrap').style.display = 'none';
    document.getElementById('saveBar').style.display = 'none';
    document.getElementById('alertBar').innerHTML = '';
  }

  function muatBom() {
    const id = document.getElementById('selItem').value;
    if (!id) { tampilAlert('Pilih item dulu.', 'warning'); return; }
    document.getElementById('loadingBom').style.display = 'block';
    document.getElementById('bomWrap').style.display = 'none';
    document.getElementById('alertBar').innerHTML = '';

    apiGet('getBomV2', { id_item: id }).then(res => {
      document.getElementById('loadingBom').style.display = 'none';
      document.getElementById('bomWrap').style.display = 'block';
      document.getElementById('saveBar').style.display = 'flex';
      renderBom(res);
    }).catch(() => {
      document.getElementById('loadingBom').style.display = 'none';
      tampilAlert('Gagal memuat BOM.', 'danger');
    });
  }

  function renderBom(res) {
    const bom = res.bom && res.bom.length > 0 ? res.bom[0] : null;
    document.getElementById('inputKeterangan').value = bom ? bom.keterangan : '';

    // tinta
    document.getElementById('listTinta').innerHTML = '';
    const tinta = res.tinta || [];
    if (tinta.length > 0) {
      tinta.forEach(t => {
        const tObj = dataTinta.find(x => x.id_tinta === t.id_tinta);
        tambahRowTinta(t.id_tinta, tObj ? tObj.nama_tinta : t.id_tinta);
      });
    } else {
      tambahRowTinta();
    }

    // bahan
    document.getElementById('listBahan').innerHTML = '';
    const bahan = res.bahan || [];
    if (bahan.length > 0) {
      bahan.forEach(b => {
        const bObj = dataBahan.find(x => x.id_bahan === b.id_bahan);
        tambahRowBahan(b.id_bahan, bObj ? bObj.nama_bahan : b.id_bahan, b.keterangan);
      });
    } else {
      tambahRowBahan();
    }

    // finishing
    document.getElementById('listFinishing').innerHTML = '';
    const fin = res.finishing || [];
    if (fin.length > 0) {
      fin.forEach(f => tambahRowFinishing(f.jenis_finishing));
    } else {
      tambahRowFinishing();
      tambahRowFinishing('PACKING');
    }

    updateWarnaCount();
  }

  // ---- ROW BUILDERS ----

  function tambahRowTinta(idTinta, namaTinta) {
    const div = document.createElement('div');
    div.className = 'row-item tinta-row';
    const displayVal = idTinta ? (idTinta + ' | ' + (namaTinta || idTinta)) : '';
    div.innerHTML = `
      <input type="text" list="dlistTinta" placeholder="Ketik nama atau kode tinta..." value="${escHtml(displayVal)}" oninput="updateWarnaCount()">
      <button class="btn-del" onclick="this.parentElement.remove();updateWarnaCount()">Hapus</button>
    `;
    div.querySelector('input').dataset.idTinta = idTinta || '';
    document.getElementById('listTinta').appendChild(div);
    updateWarnaCount();
  }

  function tambahRowBahan(idBahan, namaBahan, ket) {
    const div = document.createElement('div');
    div.className = 'row-item bahan-row';
    const displayVal = idBahan ? (idBahan + ' | ' + (namaBahan || idBahan)) : '';
    div.innerHTML = `
      <input type="text" list="dlistBahan" placeholder="Ketik nama atau kode bahan..." value="${escHtml(displayVal)}">
      <input type="text" class="ket-input" placeholder="Keterangan..." value="${escHtml(ket||'')}">
      <button class="btn-del" onclick="this.parentElement.remove()">Hapus</button>
    `;
    document.getElementById('listBahan').appendChild(div);
  }

  function tambahRowFinishing(val) {
    const div = document.createElement('div');
    div.className = 'fin-row';
    div.innerHTML = `
      <input type="text" list="dlistFinishing" placeholder="Ketik atau pilih finishing..." value="${escHtml(val||'')}">
      <button class="btn-del" onclick="this.parentElement.remove()">Hapus</button>
    `;
    document.getElementById('listFinishing').appendChild(div);
  }

  function updateWarnaCount() {
    const rows = document.getElementById('listTinta').querySelectorAll('.tinta-row input');
    const isi  = Array.from(rows).filter(r => r.value.trim()).length;
    document.getElementById('warnaCount').textContent = isi > 0 ? isi + ' warna' : '';
  }

  // ---- PARSE INPUT ----

  function parseIdDariInput(val, dataArr, idKey) {
    val = val.trim();
    if (!val) return null;
    // format: "ID | NAMA"
    if (val.includes(' | ')) {
      return val.split(' | ')[0].trim();
    }
    // coba cari by ID langsung
    const found = dataArr.find(x => x[idKey].toUpperCase() === val.toUpperCase());
    return found ? found[idKey] : null;
  }

  // ---- SIMPAN ----

  function simpanBom() {
    const idItem = document.getElementById('selItem').value;
    if (!idItem) return tampilAlert('Pilih item dulu.', 'warning');

    // parse tinta
    const tintaRows = document.getElementById('listTinta').querySelectorAll('.tinta-row input');
    const tinta = [];
    let tintaError = false;
    tintaRows.forEach(inp => {
      if (!inp.value.trim()) return;
      const id = parseIdDariInput(inp.value, dataTinta, 'id_tinta');
      if (!id) { tintaError = true; return; }
      tinta.push({ id_tinta: id });
    });
    if (tintaError) return tampilAlert('Tinta tidak dikenali. Pilih dari daftar yang tersedia, atau tambahkan tinta baru di Master Tinta.', 'danger');
    if (tinta.length === 0) return tampilAlert('Minimal 1 tinta wajib diisi.', 'danger');

    // parse bahan
    const bahanRows = document.getElementById('listBahan').querySelectorAll('.bahan-row');
    const bahan = [];
    let bahanError = false;
    bahanRows.forEach(row => {
      const inp = row.querySelectorAll('input')[0];
      const ket = row.querySelectorAll('input')[1];
      if (!inp.value.trim()) return;
      const id = parseIdDariInput(inp.value, dataBahan, 'id_bahan');
      if (!id) { bahanError = true; return; }
      bahan.push({ id_bahan: id, keterangan: ket ? ket.value.trim() : '' });
    });
    if (bahanError) return tampilAlert('Bahan tidak dikenali. Pilih dari daftar yang tersedia, atau tambahkan bahan baru di Master Bahan.', 'danger');
    if (bahan.length === 0) return tampilAlert('Minimal 1 bahan wajib diisi.', 'danger');

    // parse finishing
    const finRows = document.getElementById('listFinishing').querySelectorAll('.fin-row input');
    const finishing = [];
    finRows.forEach(inp => {
      const val = inp.value.trim();
      if (val) finishing.push({ jenis_finishing: val });
    });
    if (finishing.length === 0) return tampilAlert('Minimal 1 finishing wajib diisi.', 'danger');

    const keterangan = document.getElementById('inputKeterangan').value.trim();
    const payload = { id_item: idItem, keterangan, bahan, tinta, finishing };

    const btn = document.getElementById('btnSimpan');
    btn.textContent = 'Menyimpan...'; btn.disabled = true;

    apiPost('simpanBomV2', payload).then(res => {
      if (res.error) tampilAlert(res.error, 'danger');
      else tampilAlert('BOM berhasil disimpan.', 'success');
    }).catch(() => tampilAlert('Gagal menyimpan. Coba lagi.', 'danger'))
    .finally(() => { btn.textContent = 'Simpan BOM'; btn.disabled = false; });
  }

  function tampilAlert(msg, tipe) {
    document.getElementById('alertBar').innerHTML =
      `<div class="alert alert-${tipe} py-2" style="font-size:12px">${msg}</div>`;
    window.scrollTo(0,0);
  }

  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function apiGet(action, params) {
    let url = GAS_URL + '?action=' + action;
    if (params) Object.keys(params).forEach(k => url += '&' + k + '=' + encodeURIComponent(params[k]));
    return fetch(url).then(r => r.json());
  }
</script>
</body>
</html>
