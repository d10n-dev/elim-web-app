<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIEO — Elim Citra Offset</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="css/sieo.css" rel="stylesheet" />
  <style>
    .splash {
      min-height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    .splash-logo {
      width: 168px;
      height: 168px;
      margin-bottom: 1.25rem;
      filter: drop-shadow(0 6px 18px rgba(26,39,68,.18));
    }
    .splash-name {
      font-family: var(--mono);
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--navy);
    }
    .splash-sub {
      font-family: var(--sans);
      font-size: .82rem;
      color: var(--muted);
      margin-top: .35rem;
    }
    .splash-hint {
      margin-top: 2.25rem;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: .4rem;
    }
  </style>
</head>
<body>

  <div id="navRoot"></div>

  <div class="splash">
    <img src="assets/logo_elim.png" alt="Logo Elim Citra Offset" class="splash-logo" />
    <div class="splash-name">PT. Elim Citra Offset</div>
    <div class="splash-sub">Sistem Informasi Elim Offset</div>
    <div class="splash-hint">☰ Buka menu di pojok kanan atas untuk mulai</div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script>
    window.addEventListener('load', function () {
      if (!guardHalaman()) return;
      initNav(null, 'SIEO'); // tidak ada item menu aktif di halaman index
    });
  </script>

</body>
</html>
