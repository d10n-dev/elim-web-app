<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>SIEO — Sistem Informasi Elim Offset</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
          <link rel="stylesheet" href="style.css">
          </head>
          <body>

            <nav class="navbar navbar-dark bg-dark px-3">
                <span class="navbar-brand fw-bold">SIEO</span>
                    <span class="text-white-50 small">PT. Elim Citra Offset</span>
                      </nav>

                        <div class="container mt-4">
                            <div class="card">
                                  <div class="card-body">
                                          <h5 class="card-title">Test Koneksi GAS</h5>
                                                  <p class="text-muted small">Pastikan GAS sudah di-deploy sebelum test.</p>
                                                          <button class="btn btn-primary" onclick="testKoneksi()">Test Koneksi</button>
                                                                  <div id="hasil" class="mt-3"></div>
                                                                        </div>
                                                                            </div>
                                                                              </div>

                                                                                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
                                                                                  <script src="js/api.js"></script>
                                                                                    <script src="js/utils.js"></script>
                                                                                      <script>
                                                                                          function testKoneksi() {
                                                                                                const hasil = document.getElementById('hasil');
                                                                                                      hasil.innerHTML = '<span class="text-muted">Menghubungkan...</span>';
                                                                                                            apiGet('ping')
                                                                                                                    .then(res => {
                                                                                                                              hasil.innerHTML = '<span class="text-success fw-bold">✅ Koneksi berhasil: ' + res.message + '</span>';
                                                                                                                                      })
                                                                                                                                              .catch(err => {
                                                                                                                                                        hasil.innerHTML = '<span class="text-danger fw-bold">❌ Gagal: ' + err + '</span>';
                                                                                                                                                                });
                                                                                                                                                                    }
                                                                                                                                                                      </script>

                                                                                                                                                                      </body>
                                                                                                                                                                      </html>
